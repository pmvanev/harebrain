<svg width="210" height="64" viewBox="0 0 210 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tri-agent glyph: a QCA disc and an RA disc trade an ask arrow and a dashed answer arrow; an EA card above judges the dialogue with a 1 to 5 score.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .sage-tint      { color: rgba(79, 107, 63, 0.10); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.12); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- QCA disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><ellipse cx="28" cy="40" rx="22" ry="12"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="28" cy="40" rx="22" ry="12" stroke-width="1.4" fill="none"/>
    <text x="28" y="43" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" letter-spacing="0.08em" stroke="none">QCA</text>
  </g>
  <!-- RA disc -->
  <g class="sage-tint" stroke="none" fill="currentColor"><ellipse cx="118" cy="40" rx="20" ry="12"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <ellipse cx="118" cy="40" rx="20" ry="12" stroke-width="1.4" fill="none"/>
    <text x="118" y="43" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" letter-spacing="0.08em" stroke="none">RA</text>
  </g>
  <!-- ask arrow (top) -->
  <g class="ink" stroke="currentColor" fill="currentColor">
    <line x1="51" y1="33" x2="95" y2="33" stroke-width="1.2"/>
    <polygon points="98,33 92,30 92,36" stroke="none"/>
    <text x="56" y="28" font-family="ui-monospace, monospace" font-size="7" stroke="none">CQ&#x1d62;</text>
  </g>
  <!-- answer arrow (bottom, dashed) -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="95" y1="48" x2="53" y2="48" stroke-width="1.1" stroke-dasharray="3 3"/>
    <polygon points="50,48 56,45 56,51" stroke="none"/>
    <text x="78" y="59" font-family="ui-monospace, monospace" font-size="7" stroke="none">R&#x1d62;</text>
  </g>
  <!-- EA card (judge) -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="150" y="14" width="52" height="36" rx="4"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="150" y="14" width="52" height="36" rx="4" stroke-width="1.4" fill="none"/>
    <text x="176" y="29" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" stroke="none">EA</text>
    <text x="176" y="43" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" stroke="none">1&#8211;5</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="176" y="10" font-family="ui-monospace, monospace" font-size="6" text-anchor="middle" letter-spacing="0.1em">JUDGE</text>
  </g>
  <!-- transcript -> EA (dashed up) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <path d="M 122 30 Q 138 22 150 28" stroke-width="1.1" fill="none" stroke-dasharray="3 2"/>
    <polygon points="150,28 144,27 146,33" stroke="none"/>
  </g>
</svg>

<svg width="216" height="60" viewBox="0 0 216 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Judge-debate glyph: a row of judge discs starts split between correct and incorrect, a Bayesian belief arrow pulls them toward a single seed disc, and a KS stability needle halts the loop.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.10); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.10); }
    .sage-tint      { color: rgba(79, 107, 63, 0.12); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.12); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.12); }
      .sage-tint      { color: rgba(177, 201, 140, 0.16); }
    }
  </style>
  <!-- seed disc (correct) -->
  <g class="sage-tint" stroke="none" fill="currentColor"><circle cx="22" cy="30" r="11"/></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="30" r="11"/><polyline points="17,30 21,34 27,25"/></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="22" y="52" font-family="Fraunces, serif" font-style="italic" font-size="7" text-anchor="middle">seed</text></g>
  <!-- belief arrow -->
  <g class="blueprint" stroke="currentColor" fill="currentColor"><line x1="36" y1="30" x2="58" y2="30" stroke-width="1.3"/><polygon points="61,30 55,27 55,33" stroke="none"/></g>
  <g class="blueprint" stroke="none" fill="currentColor"><text x="48" y="14" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle">amplify</text></g>
  <!-- mixed ensemble converging: round 0 split, round t aligned -->
  <g stroke="currentColor" fill="none" stroke-width="1.3">
    <g class="oxblood"><circle cx="74" cy="16" r="6"/></g>
    <g class="blueprint"><circle cx="74" cy="30" r="6"/></g>
    <g class="oxblood"><circle cx="74" cy="44" r="6"/></g>
  </g>
  <g class="muted" stroke="currentColor" fill="currentColor"><line x1="84" y1="30" x2="100" y2="30" stroke-width="1.1"/><polygon points="103,30 97,27 97,33" stroke="none"/></g>
  <g stroke="currentColor" fill="none" stroke-width="1.3">
    <g class="blueprint"><circle cx="116" cy="16" r="6"/></g>
    <g class="blueprint"><circle cx="116" cy="30" r="6"/></g>
    <g class="blueprint"><circle cx="116" cy="44" r="6"/></g>
  </g>
  <g class="muted" stroke="none" fill="currentColor"><text x="95" y="58" font-family="JetBrains Mono, monospace" font-size="6" text-anchor="middle">bimodal converge</text></g>
  <!-- KS stability gauge -->
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1"><line x1="136" y1="30" x2="150" y2="30" stroke-dasharray="2 2"/></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.5">
    <path d="M158 42 a18 18 0 0 1 34 0"/>
    <line x1="175" y1="42" x2="186" y2="29" stroke-linecap="round"/>
  </g>
  <g class="sage" stroke="none" fill="currentColor"><text x="175" y="55" font-family="Fraunces, serif" font-style="italic" font-size="7" text-anchor="middle">KS &lt; 0.05 → stop</text></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="200" y="20" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle">D&#8348;</text></g>
</svg>

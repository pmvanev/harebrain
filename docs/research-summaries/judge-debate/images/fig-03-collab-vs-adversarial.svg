<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two debate protocols on the same tasks. Left in oxblood: adversarial debate (MAD) with opposing debaters and a deciding judge, underperforming even a single model. Right in blueprint: collaborative belief refinement, agents pooling reasoning toward consensus, beating single and majority voting. A bottom ranking strip orders methods: MAD less than Single less than majority less than collaborative Debate.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.08); }
    .sage-tint      { color: rgba(79, 107, 63, 0.12); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.12); }
      .sage-tint      { color: rgba(177, 201, 140, 0.16); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="20" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">the protocol is the variable — not the act of talking</text></g>

  <!-- LEFT: adversarial / MAD -->
  <g class="oxblood" stroke="none" fill="currentColor"><text x="146" y="44" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle">adversarial (MAD)</text></g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="30" y="54" width="232" height="120" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="30" y="54" width="232" height="120" rx="6" stroke-width="1.3"/></g>
  <!-- two opposing debaters + judge -->
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.3"><circle cx="78" cy="92" r="14"/><circle cx="214" cy="92" r="14"/></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="8"><text x="78" y="95" text-anchor="middle">pro</text><text x="214" y="95" text-anchor="middle">con</text></g>
  <g class="muted" stroke="currentColor" fill="currentColor" stroke-width="1.2"><line x1="92" y1="92" x2="200" y2="92"/><polygon points="92,92 99,89 99,95" stroke="none"/><polygon points="200,92 193,89 193,95" stroke="none"/></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.3"><rect x="128" y="128" width="36" height="24" rx="4"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="146" y="144" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">judge</text></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor" stroke-width="1"><line x1="82" y1="104" x2="132" y2="128" stroke-dasharray="2 2"/><line x1="210" y1="104" x2="160" y2="128" stroke-dasharray="2 2"/></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="146" y="168" font-family="Spectral, serif" font-size="8.5" font-style="italic" text-anchor="middle">wrong side gets equal footing to persuade</text></g>

  <!-- divider -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1" stroke-dasharray="2 3"><line x1="280" y1="40" x2="280" y2="184"/></g>

  <!-- RIGHT: collaborative -->
  <g class="blueprint" stroke="none" fill="currentColor"><text x="414" y="44" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle">collaborative refinement</text></g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="298" y="54" width="232" height="120" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="298" y="54" width="232" height="120" rx="6" stroke-width="1.3"/></g>
  <!-- three agents pooling toward consensus -->
  <g class="blueprint" stroke="currentColor" fill="none" stroke-width="1.3"><circle cx="346" cy="80" r="12"/><circle cx="346" cy="132" r="12"/><circle cx="482" cy="106" r="12"/></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="477,106 480,109 486,101"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor" stroke-width="1.2">
    <line x1="358" y1="84" x2="468" y2="102" stroke-dasharray="3 2"/>
    <line x1="358" y1="128" x2="468" y2="110" stroke-dasharray="3 2"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor"><text x="414" y="158" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">share reasoning → update posteriors</text></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="414" y="170" font-family="Spectral, serif" font-size="8.5" font-style="italic" text-anchor="middle">seed pulls the panel to consensus</text></g>

  <!-- ranking strip -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1"><line x1="40" y1="200" x2="520" y2="200"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="280" y="224" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle">accuracy on judgment tasks</text></g>
  <g font-family="JetBrains Mono, monospace" font-size="9">
    <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="48" y="240" width="92" height="30" rx="4"/></g>
    <g class="oxblood" stroke="currentColor" fill="none"><rect x="48" y="240" width="92" height="30" rx="4" stroke-width="1.2"/></g>
    <g class="ink" stroke="none" fill="currentColor"><text x="94" y="259" text-anchor="middle">MAD</text></g>
    <g class="muted" stroke="none" fill="currentColor"><text x="158" y="260" text-anchor="middle">&lt;</text></g>
    <g class="rule-soft" stroke="currentColor" fill="none"><rect x="176" y="240" width="92" height="30" rx="4" stroke-width="1.2"/></g>
    <g class="ink" stroke="none" fill="currentColor"><text x="222" y="259" text-anchor="middle">Single</text></g>
    <g class="muted" stroke="none" fill="currentColor"><text x="286" y="260" text-anchor="middle">&lt;</text></g>
    <g class="rule-soft" stroke="currentColor" fill="none"><rect x="304" y="240" width="92" height="30" rx="4" stroke-width="1.2"/></g>
    <g class="ink" stroke="none" fill="currentColor"><text x="350" y="259" text-anchor="middle">majority</text></g>
    <g class="muted" stroke="none" fill="currentColor"><text x="414" y="260" text-anchor="middle">&lt;</text></g>
    <g class="sage-tint" stroke="none" fill="currentColor"><rect x="432" y="240" width="92" height="30" rx="4"/></g>
    <g class="sage" stroke="currentColor" fill="none"><rect x="432" y="240" width="92" height="30" rx="4" stroke-width="1.4"/></g>
    <g class="ink" stroke="none" fill="currentColor"><text x="478" y="259" text-anchor="middle">collab.</text></g>
  </g>
  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="290" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Sage's "debate hurts" = adversarial; this paper's "debate helps" = collaborative — both true</text></g>
</svg>

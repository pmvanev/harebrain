<svg viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three panels. Left: latent concept space with true concept theta-star and an ensemble of agent posteriors, one seeded on theta-star (Assumption 4.5). Center: a Bayesian update arrow amplifying the seed across the ensemble round by round (Theorem 4.1). Right: the correct-agent-count distribution collapsing from broad at round 0 to bimodal spikes at 0 and 7 by round 2.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.08); }
    .sage-tint      { color: rgba(79, 107, 63, 0.12); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.12); }
      .sage-tint      { color: rgba(177, 201, 140, 0.16); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="20" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">debate amplifies a seed; it does not manufacture one</text></g>

  <!-- PANEL 1: latent concept space -->
  <g class="blueprint" stroke="none" fill="currentColor"><text x="98" y="46" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle">latent concepts Θ</text></g>
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1"><rect x="20" y="54" width="156" height="120" rx="6"/></g>
  <!-- wrong concepts -->
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1"><circle cx="52" cy="86" r="9"/><circle cx="140" cy="78" r="9"/><circle cx="60" cy="140" r="9"/><circle cx="132" cy="146" r="9"/></g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7"><text x="52" y="89" text-anchor="middle">θ'</text><text x="140" y="81" text-anchor="middle">θ'</text><text x="60" y="143" text-anchor="middle">θ'</text><text x="132" y="149" text-anchor="middle">θ'</text></g>
  <!-- true concept -->
  <g class="sage-tint" stroke="none" fill="currentColor"><circle cx="98" cy="114" r="15"/></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.6"><circle cx="98" cy="114" r="15"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="98" y="118" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">θ*</text></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="98" y="166" font-family="Spectral, serif" font-size="8.5" font-style="italic" text-anchor="middle">one agent seeded here</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="98" y="190" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">Assumption 4.5: a correct</text><text x="98" y="200" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">seed must already exist</text></g>

  <!-- PANEL 2: Bayesian amplification -->
  <g class="blueprint" stroke="none" fill="currentColor"><text x="280" y="46" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle">Bayesian belief update</text></g>
  <!-- seed pulling ensemble -->
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.6"><circle cx="232" cy="100" r="9"/></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="228,100 231,103 236,96"/></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1"><circle cx="232" cy="128" r="9"/><circle cx="232" cy="156" r="9"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor" stroke-width="1.3">
    <path d="M243 100 q40 0 44 26" fill="none"/><polygon points="288,128 281,124 284,131" stroke="none"/>
    <path d="M243 102 q50 10 44 52" fill="none"/><polygon points="288,156 281,150 285,157" stroke="none"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="280" y="92" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">strongly-consistent</text><text x="280" y="101" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">response pulls posteriors</text></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="280" y="186" font-family="Spectral, serif" font-size="9" font-style="italic" text-anchor="middle">Thm 4.1: correctness rises</text><text x="280" y="200" font-family="Spectral, serif" font-size="9" font-style="italic" text-anchor="middle">each round → Thm 4.2 &gt; majority</text></g>

  <!-- PANEL 3: bimodal collapse -->
  <g class="blueprint" stroke="none" fill="currentColor"><text x="456" y="46" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle">correct-agent count</text></g>
  <!-- round 0: broad -->
  <g class="muted" stroke="none" fill="currentColor"><text x="360" y="64" font-family="JetBrains Mono, monospace" font-size="7">round 0</text></g>
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="360" y="78" width="9" height="10"/><rect x="371" y="74" width="9" height="14"/><rect x="382" y="80" width="9" height="8"/><rect x="393" y="76" width="9" height="12"/><rect x="404" y="79" width="9" height="9"/><rect x="415" y="75" width="9" height="13"/><rect x="426" y="72" width="9" height="16"/><rect x="437" y="77" width="9" height="11"/>
  </g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1"><line x1="358" y1="88" x2="448" y2="88"/></g>
  <!-- round 2: bimodal -->
  <g class="muted" stroke="none" fill="currentColor"><text x="360" y="116" font-family="JetBrains Mono, monospace" font-size="7">round 2</text></g>
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <rect x="360" y="126" width="9" height="40"/><rect x="437" y="120" width="9" height="46"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.2"><rect x="360" y="126" width="9" height="40"/></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.2"><rect x="437" y="120" width="9" height="46"/></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1"><line x1="358" y1="166" x2="448" y2="166"/></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7"><text x="364" y="178" text-anchor="middle">0</text><text x="442" y="178" text-anchor="middle">7</text></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="372" y="194" font-family="Spectral, serif" font-size="8" font-style="italic">all fail</text></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="448" y="194" font-family="Spectral, serif" font-size="8" font-style="italic" text-anchor="end">all correct</text></g>

  <!-- bottom banner -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1"><line x1="40" y1="224" x2="520" y2="224"/></g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="60" y="240" width="200" height="64" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="60" y="240" width="200" height="64" rx="6" stroke-width="1.2"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="160" y="266" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">no seed →</text><text x="160" y="284" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">confident collective error</text></g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="300" y="240" width="200" height="64" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="none"><rect x="300" y="240" width="200" height="64" rx="6" stroke-width="1.2"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="400" y="266" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">correct seed →</text><text x="400" y="284" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">convergence-lock on truth</text></g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="322" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">debate makes a correct ensemble more correct, and a wrong ensemble more wrong</text></g>
</svg>

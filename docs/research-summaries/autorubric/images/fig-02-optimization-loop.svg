<svg viewBox="0 0 560 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A loop: a vague artifact scoring 0.47 is graded by the analytic rubric into per-criterion pass rates; failing criteria become targeted feedback to a revision LLM that rewrites the artifact; re-grading yields 0.85, above the expert-curated baseline 0.82. A side branch shows the same per-criterion scores feeding an RL reward, plus 0.039 on AdvancedIF, no reward hacking.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.08); }
    .sage-tint      { color: rgba(79, 107, 63, 0.12); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.12); }
      .sage-tint      { color: rgba(177, 201, 140, 0.16); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">one representation: measure and optimize</text></g>

  <!-- node: vague artifact -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="30" y="44" width="120" height="46" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="30" y="44" width="120" height="46" rx="6" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="90" y="64" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">vague skill</text>
    <text x="90" y="80" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">0.47</text></g>

  <!-- node: analytic rubric grade -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="220" y="44" width="120" height="46" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="220" y="44" width="120" height="46" rx="6" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="280" y="64" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">analytic rubric</text>
    <text x="280" y="80" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">per-criterion pass rates</text></g>

  <!-- node: feedback to revision LLM -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="410" y="44" width="120" height="46" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="410" y="44" width="120" height="46" rx="6" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="470" y="64" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">revision LLM</text>
    <text x="470" y="80" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">rewrites artifact</text></g>

  <!-- arrows across the top -->
  <g class="muted" stroke="currentColor" fill="currentColor" stroke-width="1.2">
    <line x1="150" y1="67" x2="218" y2="67"/><polygon points="220,67 214,64 214,70" stroke="none"/>
    <line x1="340" y1="67" x2="408" y2="67"/><polygon points="410,67 404,64 404,70" stroke="none"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="375" y="40" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">failing criteria → feedback</text></g>

  <!-- return arrow (loop) -->
  <g class="sage" stroke="currentColor" fill="currentColor" stroke-width="1.3">
    <path d="M470 90 L470 120 L90 120 L90 92" fill="none"/>
    <polygon points="90,90 87,98 93,98" stroke="none"/>
  </g>
  <g class="sage" stroke="none" fill="currentColor"><text x="280" y="134" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">re-grade → 0.85  (above expert-curated 0.82)</text></g>

  <!-- caption -->
  <g class="ink" stroke="none" fill="currentColor"><text x="280" y="160" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">the per-criterion explanation is the gradient a holistic score can't give</text></g>

  <!-- side branch: RL reward -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1"><line x1="40" y1="184" x2="520" y2="184"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor" stroke-width="1.2">
    <line x1="280" y1="90" x2="280" y2="200"/><polygon points="280,203 277,195 283,195" stroke="none"/>
  </g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="150" y="206" width="260" height="56" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="none"><rect x="150" y="206" width="260" height="56" rx="6" stroke-width="1.2"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="280" y="226" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">same scores → RL reward</text>
    <text x="280" y="242" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">AdvancedIF +0.039 (p=0.032)</text>
    <text x="280" y="254" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">no reward hacking — but not deterministically verifiable</text></g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="280" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">the EDD loop, operationalized — shape a policy, but never gate on a soft reward</text></g>
</svg>

<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left: a holistic judge emitting a single 0.72 score over conflated criteria, annotated criterion conflation, halo effect, no signal to act on. Right: an analytic rubric splitting the same submission into independent per-criterion atomic calls (binary, ordinal, nominal), each with a verdict, weight (one negative), and mandatory reason; three payoffs: prevents conflation, enables reliability measurement via Cohen kappa, yields a per-criterion optimization signal.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.08); }
    .sage-tint      { color: rgba(79, 107, 63, 0.10); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.12); }
      .sage-tint      { color: rgba(177, 201, 140, 0.14); }
    }
  </style>

  <!-- LEFT: holistic -->
  <g class="oxblood" stroke="none" fill="currentColor"><text x="138" y="24" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">holistic</text></g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="40" y="40" width="196" height="86" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="40" y="40" width="196" height="86" rx="6" stroke-width="1.3"/></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="138" y="66" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">criteria A,B,C,D conflated</text></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="138" cy="92" r="16"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="138" y="96" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">0.72</text></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="138" y="146" font-family="Spectral, serif" font-size="9.5" font-style="italic" text-anchor="middle">halo effect &#183; no signal to act on</text></g>

  <!-- divider -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1" stroke-dasharray="2 3"><line x1="280" y1="32" x2="280" y2="288"/></g>

  <!-- RIGHT: analytic -->
  <g class="blueprint" stroke="none" fill="currentColor"><text x="420" y="24" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">analytic</text></g>
  <g font-family="JetBrains Mono, monospace" font-size="7.5">
    <!-- binary criterion -->
    <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="304" y="38" width="232" height="22" rx="3"/></g>
    <g class="sage" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="310,49 313,52 318,45"/></g>
    <g class="ink" stroke="none" fill="currentColor"><text x="326" y="52">binary · cites ≥3 sources</text></g>
    <g class="blueprint" stroke="none" fill="currentColor"><text x="500" y="52">w=10</text></g>
    <!-- ordinal criterion -->
    <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="304" y="64" width="232" height="22" rx="3"/></g>
    <g class="blueprint" stroke="currentColor" fill="none" stroke-width="1.3"><circle cx="314" cy="75" r="3.5"/></g>
    <g class="ink" stroke="none" fill="currentColor"><text x="326" y="78">ordinal · clarity (3–5 lvl, anchored)</text></g>
    <g class="blueprint" stroke="none" fill="currentColor"><text x="500" y="78">w=5</text></g>
    <!-- negative criterion -->
    <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="304" y="90" width="232" height="22" rx="3"/></g>
    <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"><line x1="310" y1="101" x2="318" y2="101"/></g>
    <g class="ink" stroke="none" fill="currentColor"><text x="326" y="104">penalty · hallucinated citation</text></g>
    <g class="oxblood" stroke="none" fill="currentColor"><text x="498" y="104">w=−15</text></g>
  </g>
  <!-- per-criterion judges -->
  <g class="muted" stroke="none" fill="currentColor"><text x="420" y="128" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">each scored in its own atomic LLM call + reason</text></g>

  <!-- three payoffs -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="40" y="172" width="480" height="92" rx="6"/></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="280" y="190" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle">three payoffs of decomposition</text></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="10">
    <text x="60" y="214">1 · prevents criterion conflation &amp; halo</text>
    <text x="60" y="234">2 · enables reliability measurement (Cohen's κ per criterion)</text>
    <text x="60" y="254">3 · yields a per-criterion optimization signal — the gradient</text>
  </g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="286" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">independent · unidimensional · atomically scored = the cage applied to judgment</text></g>
</svg>

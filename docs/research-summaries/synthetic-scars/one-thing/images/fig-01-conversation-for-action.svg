<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Winograd and Flores's Conversation for Action as a state machine. A customer request enters Requested; the performer asserts witnessed reality, reaching Witnessed, which has three legal exits: promise, counter-offer, or decline. Counter-offer can be accepted into Promised or cancelled. Promised can be revoked back to Witnessed or completed with an assertion plus receipt into Asserted. The customer either declares satisfaction or revokes acceptance. Counter-offer and decline are drawn dashed: the exits preference tuning trained out.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .muted-tint     { color: rgba(93, 85, 63, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .muted-tint     { color: rgba(168, 156, 125, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="360" y="20" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">CONVERSATION FOR ACTION &#183; WINOGRAD &amp; FLORES, 1986</text>
  </g>

  <!-- legend -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="150" y1="278" x2="172" y2="278" stroke-width="1.3"/>
    <text x="178" y="281" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">! customer move</text>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <line x1="290" y1="278" x2="312" y2="278" stroke-width="1.3"/>
    <text x="318" y="281" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">? performer move</text>
  </g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <rect x="436" y="272" width="22" height="12" rx="3" stroke-width="1.1" stroke-dasharray="3 2" fill="none"/>
    <text x="464" y="281" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">exit trained out by RLHF</text>
  </g>

  <!-- start pseudo-state -->
  <g class="ink" stroke="currentColor" fill="currentColor">
    <circle cx="16" cy="167" r="5" stroke="none"/>
    <line x1="21" y1="167" x2="36" y2="167" stroke-width="1.2"/>
    <polygon points="40,167 34,164 34,170" stroke="none"/>
  </g>

  <!-- states: solid -->
  <g class="muted-tint" stroke="none" fill="currentColor">
    <rect x="40" y="150" width="100" height="34" rx="6"/>
    <rect x="190" y="150" width="100" height="34" rx="6"/>
    <rect x="360" y="70" width="100" height="34" rx="6"/>
    <rect x="530" y="70" width="100" height="34" rx="6"/>
  </g>
  <g class="sage-tint" stroke="none" fill="currentColor">
    <rect x="530" y="150" width="100" height="34" rx="6"/>
  </g>
  <g class="ink" stroke="currentColor" fill="currentColor">
    <rect x="40" y="150" width="100" height="34" rx="6" stroke-width="1.3" fill="none"/>
    <rect x="190" y="150" width="100" height="34" rx="6" stroke-width="2" fill="none"/>
    <rect x="360" y="70" width="100" height="34" rx="6" stroke-width="1.3" fill="none"/>
    <rect x="530" y="70" width="100" height="34" rx="6" stroke-width="1.3" fill="none"/>
    <text x="90" y="171" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">Requested</text>
    <text x="240" y="171" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">Witnessed</text>
    <text x="410" y="91" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">Promised</text>
    <text x="580" y="91" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">Asserted</text>
  </g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="530" y="150" width="100" height="34" rx="6" stroke-width="1.3" fill="none"/>
    <text x="580" y="171" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">Satisfied</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="90" y="198" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">goal + by-when</text>
    <text x="240" y="198" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">reality checked first</text>
  </g>

  <!-- states: the two exits RLHF trained out -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <rect x="360" y="150" width="100" height="34" rx="6" stroke-width="1.3" stroke-dasharray="4 3" fill="none"/>
    <rect x="360" y="230" width="100" height="34" rx="6" stroke-width="1.3" stroke-dasharray="4 3" fill="none"/>
    <text x="410" y="171" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">CounterOffered</text>
    <text x="410" y="251" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">Declined</text>
  </g>

  <!-- end pseudo-states -->
  <g class="ink" stroke="currentColor" fill="none">
    <circle cx="676" cy="167" r="7" stroke-width="1.2"/>
    <circle cx="560" cy="247" r="7" stroke-width="1.2"/>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <circle cx="676" cy="167" r="3.5"/>
    <circle cx="560" cy="247" r="3.5"/>
  </g>

  <!-- performer edges (blueprint) -->
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <!-- Requested -> Witnessed -->
    <line x1="140" y1="167" x2="186" y2="167" stroke-width="1.3"/>
    <polygon points="190,167 184,164 184,170" stroke="none"/>
    <text x="165" y="160" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">?assert</text>
    <!-- Witnessed -> Promised -->
    <line x1="290" y1="158" x2="356" y2="96" stroke-width="1.3"/>
    <polygon points="359,93 352,95 356,100" stroke="none"/>
    <text x="318" y="110" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end" stroke="none">?promise</text>
    <!-- Promised -> Witnessed (revoke) -->
    <path d="M 372 70 C 320 34, 250 60, 240 146" stroke-width="1.1" fill="none"/>
    <polygon points="240,150 236,142 244,143" stroke="none"/>
    <text x="248" y="98" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end" stroke="none">?revoke-promise</text>
    <!-- Promised -> Asserted -->
    <line x1="460" y1="87" x2="526" y2="87" stroke-width="1.3"/>
    <polygon points="530,87 524,84 524,90" stroke="none"/>
    <text x="495" y="81" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">?assert</text>
    <text x="495" y="99" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">+ receipt</text>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor" opacity="0.75">
    <!-- Witnessed -> CounterOffered -->
    <line x1="290" y1="167" x2="356" y2="167" stroke-width="1.1" stroke-dasharray="3 3"/>
    <polygon points="360,167 354,164 354,170" stroke="none"/>
    <text x="325" y="160" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">?counter</text>
    <!-- Witnessed -> Declined -->
    <line x1="290" y1="176" x2="356" y2="240" stroke-width="1.1" stroke-dasharray="3 3"/>
    <polygon points="359,243 352,241 356,236" stroke="none"/>
    <text x="292" y="228" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">?decline</text>
  </g>

  <!-- customer edges (oxblood) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <!-- CounterOffered -> Promised -->
    <line x1="410" y1="150" x2="410" y2="108" stroke-width="1.3"/>
    <polygon points="410,104 407,110 413,110" stroke="none"/>
    <text x="416" y="131" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">!accept</text>
    <!-- CounterOffered -> end -->
    <line x1="458" y1="182" x2="552" y2="242" stroke-width="1.1"/>
    <polygon points="554,243 547,242 550,237" stroke="none"/>
    <text x="508" y="203" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">!cancel</text>
    <!-- Asserted -> Satisfied -->
    <line x1="580" y1="104" x2="580" y2="146" stroke-width="1.3"/>
    <polygon points="580,150 577,144 583,144" stroke="none"/>
    <text x="586" y="131" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">!declare</text>
    <!-- Asserted -> Promised (revoke acceptance) -->
    <path d="M 560 70 C 530 34, 462 34, 434 66" stroke-width="1.1" fill="none"/>
    <polygon points="432,70 433,62 439,66" stroke="none"/>
    <text x="497" y="36" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">!revoke-acceptance</text>
  </g>
  <!-- terminal edges -->
  <g class="ink" stroke="currentColor" fill="currentColor">
    <line x1="630" y1="167" x2="664" y2="167" stroke-width="1.1"/>
    <polygon points="668,167 662,164 662,170" stroke="none"/>
    <line x1="460" y1="247" x2="548" y2="247" stroke-width="1.1"/>
    <polygon points="552,247 546,244 546,250" stroke="none"/>
  </g>

  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="296" x2="680" y2="296" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="360" y="316" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Witnessed has three legal exits &#183; the grammar of a sane performer &#183; commercial post-training leaves one</text>
  </g>
</svg>

<svg viewBox="0 0 620 564" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping the Flores Handshake's constructs (left, oxblood) onto harebrain primitives (right, blueprint): Conversation for Action to the chart; ?assert (the Witnessed state) to evidence state + host import; ?promise · ?counter · ?decline to typed leaf verdict; preparatory condition to transition guard; authority condition to generator ≠ evaluator; commitment ≠ entitlement to per-state tool scope; By-When to guard on the consuming transition; the Zero-Shot Flores Handshake to advisory prompt, not a sound guard.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">Committed Speech</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/>
  </g>

  <!-- Row 1 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="60" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">Conversation for Action</text>
    <text x="30" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">Winograd &amp; Flores 1986: a state machine</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="60" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the chart</text>
    <text x="370" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">negotiation as topology, not prompt text</text>
  </g>
  <!-- Row 2 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="118" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">?assert (the Witnessed state)</text>
    <text x="30" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">check physical reality before committing</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="118" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">evidence state + host import</text>
    <text x="370" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">grep the package, run the analyzer</text>
  </g>
  <!-- Row 3 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="176" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">?promise · ?counter · ?decline</text>
    <text x="30" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">three legal answers to a !request</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="176" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">typed leaf verdict</text>
    <text x="370" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">an enum return the chart routes on</text>
  </g>
  <!-- Row 4 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="234" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">preparatory condition</text>
    <text x="30" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">Searle: promise only on verified premises</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="234" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">transition guard</text>
    <text x="370" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">no edge into Promised without receipts</text>
  </g>
  <!-- Row 5 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="292" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">authority condition</text>
    <text x="30" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">only the customer declares done</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="292" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">generator ≠ evaluator</text>
    <text x="370" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the critic or the human declares done</text>
  </g>
  <!-- Row 6 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="350" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="350" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="368" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">commitment ≠ entitlement</text>
    <text x="30" y="385" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">Lewis / Brandom deontic scorekeeping</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="350" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="350" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="368" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">per-state tool scope</text>
    <text x="370" y="385" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the state grants entitlement, not the model</text>
  </g>
  <!-- Row 7 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="408" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="408" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="426" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">By-When</text>
    <text x="30" y="443" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the consuming stage that needs the outcome</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="408" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="408" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="426" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">guard on the consuming transition</text>
    <text x="370" y="443" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the downstream state names its inputs</text>
  </g>
  <!-- Row 8 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="466" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="466" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="484" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the Zero-Shot Flores Handshake</text>
    <text x="30" y="501" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">120 tokens naming the protocol in-prompt</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="466" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="466" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="484" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">advisory prompt, not a sound guard</text>
    <text x="370" y="501" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">same protocol, no enforcement</text>
  </g>

  <!-- connecting arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="82" x2="358" y2="82" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,82 352,79 352,85" stroke="none"/>
    <line x1="262" y1="140" x2="358" y2="140" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,140 352,137 352,143" stroke="none"/>
    <line x1="262" y1="198" x2="358" y2="198" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,198 352,195 352,201" stroke="none"/>
    <line x1="262" y1="256" x2="358" y2="256" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,256 352,253 352,259" stroke="none"/>
    <line x1="262" y1="314" x2="358" y2="314" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,314 352,311 352,317" stroke="none"/>
    <line x1="262" y1="372" x2="358" y2="372" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,372 352,369 352,375" stroke="none"/>
    <line x1="262" y1="430" x2="358" y2="430" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,430 352,427 352,433" stroke="none"/>
    <line x1="262" y1="488" x2="358" y2="488" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,488 352,485 352,491" stroke="none"/>
  </g>

  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="532" x2="580" y2="532" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="550" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Flores writes the negotiation into the prompt &#183; harebrain writes it into the chart</text>
  </g>
</svg>

<svg viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The premature promise trap. Left: the negotiation branch re-weighted — Flores's three exits at roughly a third each, versus the author's illustrative post-RLHF weights of 0.9998 promise and 0.0001 each for counter-offer and decline. Right: token timeline — tokens 1 to 10 commit to a promise and open a code fence; tokens 11 to 80 walk valid grammar, append-only; at token 81 the call site is reached and the weights find no method. Of three exits, backspacing and aborting mid-expression are blocked, leaving only inventing the identifier.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.07); }
    .muted-tint     { color: rgba(93, 85, 63, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .muted-tint     { color: rgba(168, 156, 125, 0.10); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="340" y="18" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">THE PREMATURE PROMISE TRAP</text>
  </g>

  <!-- LEFT: the negotiation branch, re-weighted -->
  <g class="ink" stroke="none" fill="currentColor">
    <text x="20" y="54" font-family="Fraunces, serif" font-size="11" font-style="italic">Flores, 1986</text>
    <text x="20" y="138" font-family="Fraunces, serif" font-size="11" font-style="italic">after preference tuning</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="20" y="77" font-family="JetBrains Mono, monospace" font-size="8">?promise</text>
    <text x="20" y="93" font-family="JetBrains Mono, monospace" font-size="8">?counter</text>
    <text x="20" y="109" font-family="JetBrains Mono, monospace" font-size="8">?decline</text>
    <text x="20" y="161" font-family="JetBrains Mono, monospace" font-size="8">?promise</text>
    <text x="20" y="177" font-family="JetBrains Mono, monospace" font-size="8">?counter</text>
    <text x="20" y="193" font-family="JetBrains Mono, monospace" font-size="8">?decline</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <rect x="70" y="69" width="51" height="10" rx="2"/>
    <rect x="70" y="85" width="49.5" height="10" rx="2"/>
    <rect x="70" y="101" width="49.5" height="10" rx="2"/>
    <rect x="70" y="153" width="150" height="10" rx="2"/>
    <rect x="70" y="169" width="1.5" height="10"/>
    <rect x="70" y="185" width="1.5" height="10"/>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="126" y="77" font-family="JetBrains Mono, monospace" font-size="8">0.34</text>
    <text x="124" y="93" font-family="JetBrains Mono, monospace" font-size="8">0.33</text>
    <text x="124" y="109" font-family="JetBrains Mono, monospace" font-size="8">0.33</text>
    <text x="226" y="161" font-family="JetBrains Mono, monospace" font-size="8">0.9998</text>
    <text x="76" y="177" font-family="JetBrains Mono, monospace" font-size="8">0.0001</text>
    <text x="76" y="193" font-family="JetBrains Mono, monospace" font-size="8">0.0001</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="20" y="220" font-family="JetBrains Mono, monospace" font-size="7.5">the author's illustrative weights,</text>
    <text x="20" y="232" font-family="JetBrains Mono, monospace" font-size="7.5">in spew BNF notation &#8212; not measured</text>
  </g>

  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="266" y1="36" x2="266" y2="262" stroke-width="1"/>
  </g>

  <!-- RIGHT: the token timeline -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <rect x="280" y="36" width="380" height="40" rx="6"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="280" y="36" width="380" height="40" rx="6" stroke-width="1.4" fill="none"/>
    <text x="290" y="52" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">tokens 1&#8211;10 &#183; the premature ?promise</text>
    <text x="290" y="68" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">"Certainly! Here is how to do Y with PackageX:" + opens ```dart</text>
  </g>
  <g class="muted-tint" stroke="none" fill="currentColor">
    <rect x="280" y="88" width="380" height="40" rx="6"/>
    <rect x="280" y="140" width="380" height="40" rx="6"/>
  </g>
  <g class="ink" stroke="currentColor" fill="currentColor">
    <rect x="280" y="88" width="380" height="40" rx="6" stroke-width="1.2" fill="none"/>
    <text x="290" y="104" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">tokens 11&#8211;80 &#183; walk the grammar</text>
    <text x="290" y="120" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">imports, signature, try block &#8212; every token appended for good</text>
    <rect x="280" y="140" width="380" height="40" rx="6" stroke-width="1.2" fill="none"/>
    <text x="290" y="156" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">token 81 &#183; the call site, line 15</text>
    <text x="290" y="172" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">await packageX.&#9646;  &#8212; the weights hold no method for Y</text>
  </g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="470" y1="76" x2="470" y2="85" stroke-width="1.1"/>
    <polygon points="470,88 467,82 473,82" stroke="none"/>
    <line x1="470" y1="128" x2="470" y2="137" stroke-width="1.1"/>
    <polygon points="470,140 467,134 473,134" stroke="none"/>
    <line x1="470" y1="180" x2="342" y2="205" stroke-width="1"/>
    <polygon points="339,206 345,202 346,208" stroke="none"/>
    <line x1="470" y1="180" x2="470" y2="203" stroke-width="1"/>
    <polygon points="470,206 467,200 473,200" stroke="none"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="470" y1="180" x2="598" y2="205" stroke-width="1.6"/>
    <polygon points="601,206 594,207 596,201" stroke="none"/>
  </g>

  <!-- the three exits -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <rect x="280" y="208" width="120" height="44" rx="6" stroke-width="1.1" stroke-dasharray="4 3" fill="none"/>
    <rect x="410" y="208" width="120" height="44" rx="6" stroke-width="1.1" stroke-dasharray="4 3" fill="none"/>
    <text x="340" y="226" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">&#10007; backspace to 1</text>
    <text x="340" y="241" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">append-only: no undo</text>
    <text x="470" y="226" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">&#10007; abort mid-line</text>
    <text x="470" y="241" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">grammar forbids it</text>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="540" y="208" width="120" height="44" rx="6"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="540" y="208" width="120" height="44" rx="6" stroke-width="1.6" fill="none"/>
    <text x="600" y="226" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">invent performY()</text>
    <text x="600" y="241" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">the only exit left</text>
  </g>

  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="272" x2="640" y2="272" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="340" y="292" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">API hallucination as a grammar trap: an append-only un-parser committed at token 1, cornered at token 81</text>
  </g>
</svg>

<svg width="210" height="60" viewBox="0 0 210 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flores Handshake glyph: a customer request forks into three performer answers; preference tuning has thickened the promise branch to 0.9998 and thinned counter-offer and decline to dashed 0.0001 threads.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- the request -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><circle cx="20" cy="30" r="11"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <circle cx="20" cy="30" r="11" stroke-width="1.4" fill="none"/>
    <text x="20" y="34" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle" stroke="none">!</text>
  </g>
  <!-- promise: the one branch preference tuning left standing -->
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <line x1="31" y1="27" x2="142" y2="11" stroke-width="2.6"/>
    <polygon points="148,10 140,7 141,14" stroke="none"/>
    <text x="153" y="14" font-family="ui-monospace, monospace" font-size="7" stroke="none">?promise</text>
  </g>
  <!-- counter-offer and decline: trained down to threads -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="32" y1="30" x2="142" y2="30" stroke-width="0.9" stroke-dasharray="2 3"/>
    <polygon points="147,30 141,27.5 141,32.5" stroke="none"/>
    <line x1="31" y1="33" x2="142" y2="49" stroke-width="0.9" stroke-dasharray="2 3"/>
    <polygon points="148,50 141,46 140,53" stroke="none"/>
    <text x="153" y="33" font-family="ui-monospace, monospace" font-size="7" stroke="none">?counter</text>
    <text x="153" y="53" font-family="ui-monospace, monospace" font-size="7" stroke="none">?decline</text>
    <text x="74" y="15" font-family="ui-monospace, monospace" font-size="6" stroke="none">0.9998</text>
    <text x="80" y="26" font-family="ui-monospace, monospace" font-size="6" stroke="none">0.0001</text>
    <text x="74" y="51" font-family="ui-monospace, monospace" font-size="6" stroke="none">0.0001</text>
  </g>
</svg>

<svg viewBox="0 0 620 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping Part 3.7 constructs (left, oxblood) onto harebrain primitives (right, blueprint): the on-disk state directory to the blackboard and Manifest; write-once latches to the chart and its guards; the append-only critic summary to an append-only blackboard log; the model-written 99 next action program counter to the runtime-owned active state configuration; the read-init-d bootloader to the tick snapshot; fork and wait subagents to the LLM at the leaf; the two-writer rule and oracle pipe to generator not equal evaluator; WAL replay of user requests to external events on the tick; stigmergy to the blackboard architecture.">

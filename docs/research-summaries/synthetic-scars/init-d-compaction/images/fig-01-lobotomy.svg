  <g class="muted" stroke="none" fill="currentColor"><text x="30" y="258" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5">~1.8k tokens total</text></g>
  <g class="sage" stroke="currentColor" fill="currentColor"><line x1="172" y1="234" x2="203.0" y2="234.0" stroke-width="1.2"/><polygon points="203.0,234.0 197.0,231.0 197.0,237.0" stroke="none"/></g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="205" y="208" width="120" height="52" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="none"><rect x="205" y="208" width="120" height="52" rx="6" stroke-width="1.3"/></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="265" y="229" font-family="Fraunces, serif" font-size="10" font-style="italic" text-anchor="middle">Target 0: read-init-d</text></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="265" y="246" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5" text-anchor="middle">glob *.md, 00 → 99</text></g>
  <g class="sage" stroke="currentColor" fill="currentColor"><line x1="327" y1="234" x2="358.0" y2="234.0" stroke-width="1.2"/><polygon points="358.0,234.0 352.0,231.0 352.0,237.0" stroke="none"/></g>
  <g class="muted-tint" stroke="none" fill="currentColor"><rect x="360" y="202" width="130" height="64" rx="6"/></g>
  <g class="muted" stroke="currentColor" fill="none"><rect x="360" y="202" width="130" height="64" rx="6" stroke-width="1.3" stroke-dasharray="3 3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="425" y="222" font-family="Fraunces, serif" font-size="9.5" font-style="italic" text-anchor="middle">laws, plan, verdicts,</text></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="425" y="236" font-family="Fraunces, serif" font-size="9.5" font-style="italic" text-anchor="middle">next action — read last,</text></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="425" y="250" font-family="Fraunces, serif" font-size="9.5" font-style="italic" text-anchor="middle">so they sit most recent</text></g>
  <g class="sage" stroke="currentColor" fill="currentColor"><line x1="492" y1="234" x2="518.0" y2="234.0" stroke-width="1.2"/><polygon points="518.0,234.0 512.0,231.0 512.0,237.0" stroke="none"/></g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="520" y="202" width="100" height="64" rx="6"/></g>

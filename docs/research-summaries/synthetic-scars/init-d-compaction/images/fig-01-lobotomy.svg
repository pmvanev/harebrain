  <g class="oxblood" stroke="none" fill="currentColor"><text x="265" y="106" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5" text-anchor="middle">235k → 14.8k tok</text></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor"><line x1="327" y1="94" x2="358.0" y2="94.0" stroke-width="1.2"/><polygon points="358.0,94.0 352.0,91.0 352.0,97.0" stroke="none"/></g>

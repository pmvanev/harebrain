  <g class="muted-tint" stroke="none" fill="currentColor"><rect x="20" y="196" width="150" height="76" rx="6"/></g>
  <g class="muted" stroke="currentColor" fill="none"><rect x="20" y="196" width="150" height="76" rx="6" stroke-width="1.3"/></g>

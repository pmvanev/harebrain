  <g class="sage" stroke="none" fill="currentColor"><text x="527" y="237" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.2">✓ 0 invariants lost</text></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="527" y="252" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.2">✓ 0 steps repeated</text></g>

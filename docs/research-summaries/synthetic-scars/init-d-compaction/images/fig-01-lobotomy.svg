  <g class="oxblood" stroke="none" fill="currentColor"><text x="530" y="82" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5">✗ pushes unasked</text></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="530" y="97" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5">✗ re-adds R1 bug</text></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="530" y="112" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5">✗ loses its place</text></g>

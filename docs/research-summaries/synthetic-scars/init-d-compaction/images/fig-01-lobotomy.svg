<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two lanes. Top: a 230k-token transcript carrying invariants passes through the host summarizer into a three-sentence prose gist, and the woken agent pushes unasked, re-adds a rejected bug, and loses its place. Bottom: the same transcript plus five state files on disk; after compaction, Target 0 reads the files in order 00 to 99 and the agent resumes with no invariants lost and no steps repeated.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    .muted-tint     { color: rgba(93, 85, 63, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
      .muted-tint     { color: rgba(168, 156, 125, 0.10); }
    }
  </style>
  <g class="muted" stroke="none" fill="currentColor"><text x="320" y="20" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">TWO WAYS TO WAKE UP AFTER COMPACTION</text></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="20" y="46" font-family="Fraunces, serif" font-size="12" font-style="italic">trust the host summary</text></g>
  <g class="muted-tint" stroke="none" fill="currentColor"><rect x="20" y="56" width="150" height="76" rx="6"/></g>
  <g class="muted" stroke="currentColor" fill="none"><rect x="20" y="56" width="150" height="76" rx="6" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="30" y="72" font-family="Fraunces, serif" font-size="10.5" font-style="italic">230k-token transcript</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="30" y="90" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5">inv: no root subscribe</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="30" y="103" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5">critic: R1, R2 rejected</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="30" y="116" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5">law: no push w/o approval</text></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor"><line x1="172" y1="94" x2="203.0" y2="94.0" stroke-width="1.2"/><polygon points="203.0,94.0 197.0,91.0 197.0,97.0" stroke="none"/></g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="205" y="68" width="120" height="52" rx="6"/></g>

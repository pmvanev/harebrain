  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="132" y="16" width="74" height="8" rx="1.5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="132" y="16" width="74" height="8" rx="1.5" stroke-width="1"/></g>
  <g class="blueprint" stroke="none" fill="currentColor"><text x="136" y="22.2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="5.6">10 ticket</text></g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="132" y="26" width="74" height="8" rx="1.5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="132" y="26" width="74" height="8" rx="1.5" stroke-width="1"/></g>
  <g class="blueprint" stroke="none" fill="currentColor"><text x="136" y="32.2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="5.6">20 plan</text></g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="132" y="36" width="74" height="8" rx="1.5"/></g>

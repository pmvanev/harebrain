  <g class="blueprint" stroke="none" fill="currentColor"><text x="136" y="42.2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="5.6">30 critic</text></g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="132" y="46" width="74" height="8" rx="1.5"/></g>

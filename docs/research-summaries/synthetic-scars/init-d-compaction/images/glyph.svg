<svg viewBox="0 0 210 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="init.d compaction glyph: a context window, struck by compaction from 235k to 15k tokens, is rebooted by reading five numbered state files, 00 governance through 99 next, in lexical order.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    .muted-tint     { color: rgba(93, 85, 63, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
      .muted-tint     { color: rgba(168, 156, 125, 0.10); }
    }
  </style>
  <g class="muted-tint" stroke="none" fill="currentColor"><rect x="4" y="12" width="66" height="38" rx="4"/></g>
  <g class="muted" stroke="currentColor" fill="none"><rect x="4" y="12" width="66" height="38" rx="4" stroke-width="1.2" stroke-dasharray="3 2"/></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="37" y="26" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.5" text-anchor="middle">context</text></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="37" y="37" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.5" text-anchor="middle">235k→15k</text></g>
  <g class="oxblood" stroke="currentColor" fill="none"><polyline points="62,4 56,12 62,13 55,22" stroke-width="1.3"/></g>

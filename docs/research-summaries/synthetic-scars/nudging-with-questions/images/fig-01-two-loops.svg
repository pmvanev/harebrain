<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two models of correction. Left, the imperative boss: bark a directive, sycophantic panic, local token substitution that breaks a global lifecycle, the human acting as compiler, and back to barking, a closed loop. Right, the Socratic mentor: ask a kinetic question, the open variable forces causal simulation, the model discovers the collision itself, robust architecture results, a straight line.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .sage           { color: #4f6b3f; }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .sage           { color: #b1c98c; }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>

  <!-- panel frames -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <rect x="20" y="48" width="280" height="236" rx="8" stroke-width="1"/>
    <rect x="320" y="48" width="280" height="236" rx="8" stroke-width="1"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="160" y="32" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">the imperative boss</text>
  </g>
  <g class="sage" stroke="none" fill="currentColor">
    <text x="460" y="32" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">the socratic mentor</text>
  </g>

  <!-- LEFT: closed loop of four boxes -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="36" y="68" width="112" height="56" rx="6"/>
    <rect x="172" y="68" width="112" height="56" rx="6"/>
    <rect x="172" y="178" width="112" height="56" rx="6"/>
    <rect x="36" y="178" width="112" height="56" rx="6"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="36" y="68" width="112" height="56" rx="6" stroke-width="1.3" fill="none"/>
    <rect x="172" y="68" width="112" height="56" rx="6" stroke-width="1.3" fill="none"/>
    <rect x="172" y="178" width="112" height="56" rx="6" stroke-width="1.3" fill="none"/>
    <rect x="36" y="178" width="112" height="56" rx="6" stroke-width="1.3" fill="none"/>
    <text x="44" y="87" font-family="Fraunces, serif" font-size="10" font-style="italic" stroke="none">bark a directive</text>
    <text x="180" y="87" font-family="Fraunces, serif" font-size="10" font-style="italic" stroke="none">sycophantic panic</text>
    <text x="180" y="197" font-family="Fraunces, serif" font-size="10" font-style="italic" stroke="none">token substitution</text>
    <text x="44" y="197" font-family="Fraunces, serif" font-size="10" font-style="italic" stroke="none">human compiler</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="44" y="103" font-family="JetBrains Mono, monospace" font-size="7">'fix line 42 with X'</text>
    <text x="180" y="103" font-family="JetBrains Mono, monospace" font-size="7">'you're right, sorry!'</text>
    <text x="180" y="213" font-family="JetBrains Mono, monospace" font-size="7">local patch breaks</text>
    <text x="180" y="224" font-family="JetBrains Mono, monospace" font-size="7">a global lifecycle</text>
    <text x="44" y="213" font-family="JetBrains Mono, monospace" font-size="7">senior does the</text>
    <text x="44" y="224" font-family="JetBrains Mono, monospace" font-size="7">O(N) in their head</text>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="149" y1="96" x2="167" y2="96" stroke-width="1.2"/>
    <polygon points="171,96 165,93 165,99" stroke="none"/>
    <line x1="228" y1="125" x2="228" y2="173" stroke-width="1.2"/>
    <polygon points="228,177 225,171 231,171" stroke="none"/>
    <line x1="171" y1="206" x2="153" y2="206" stroke-width="1.2"/>
    <polygon points="149,206 155,203 155,209" stroke="none"/>
    <line x1="92" y1="177" x2="92" y2="129" stroke-width="1.2"/>
    <polygon points="92,125 89,131 95,131" stroke="none"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="160" y="155" font-family="Fraunces, serif" font-size="9.5" font-style="italic" text-anchor="middle">repeat</text>
    <text x="160" y="262" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">four turns later: apologies fill the context</text>
  </g>

  <!-- RIGHT: straight line of four boxes -->
  <g class="sage-tint" stroke="none" fill="currentColor">
    <rect x="336" y="62" width="248" height="40" rx="6"/>
    <rect x="336" y="118" width="248" height="40" rx="6"/>
    <rect x="336" y="174" width="248" height="40" rx="6"/>
    <rect x="336" y="230" width="248" height="40" rx="6"/>
  </g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="336" y="62" width="248" height="40" rx="6" stroke-width="1.3" fill="none"/>
    <rect x="336" y="118" width="248" height="40" rx="6" stroke-width="1.3" fill="none"/>
    <rect x="336" y="174" width="248" height="40" rx="6" stroke-width="1.3" fill="none"/>
    <rect x="336" y="230" width="248" height="40" rx="6" stroke-width="1.3" fill="none"/>
    <text x="346" y="79" font-family="Fraunces, serif" font-size="10" font-style="italic" stroke="none">ask a kinetic question</text>
    <text x="346" y="135" font-family="Fraunces, serif" font-size="10" font-style="italic" stroke="none">forced causal simulation</text>
    <text x="346" y="191" font-family="Fraunces, serif" font-size="10" font-style="italic" stroke="none">native discovery</text>
    <text x="346" y="247" font-family="Fraunces, serif" font-size="10" font-style="italic" stroke="none">robust architecture</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="346" y="94" font-family="JetBrains Mono, monospace" font-size="7">'what if reconnect fires twice?'</text>
    <text x="346" y="150" font-family="JetBrains Mono, monospace" font-size="7">an open variable: trace, can't just agree</text>
    <text x="346" y="206" font-family="JetBrains Mono, monospace" font-size="7">the model finds the collision itself</text>
    <text x="346" y="262" font-family="JetBrains Mono, monospace" font-size="7">'95%+ first pass' (author's field claim)</text>
  </g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="460" y1="103" x2="460" y2="113" stroke-width="1.2"/>
    <polygon points="460,117 457,111 463,111" stroke="none"/>
    <line x1="460" y1="159" x2="460" y2="169" stroke-width="1.2"/>
    <polygon points="460,173 457,167 463,167" stroke="none"/>
    <line x1="460" y1="215" x2="460" y2="225" stroke-width="1.2"/>
    <polygon points="460,229 457,223 463,223" stroke="none"/>
  </g>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="308" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">redrawn from the article's flowchart &#183; the mechanism labels are the author's, not measured</text>
  </g>
</svg>

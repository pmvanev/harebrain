<svg width="210" height="60" viewBox="0 0 210 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nudging glyph: a human mark sends a five-second question into an AI disc, which ripples outward as it does the O(N) work.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>
  <!-- human: the question -->
  <g class="sage-tint" stroke="none" fill="currentColor">
    <circle cx="20" cy="30" r="13"/>
  </g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <circle cx="20" cy="30" r="13" stroke-width="1.4" fill="none"/>
    <text x="20" y="35" font-family="Fraunces, serif" font-size="15" font-style="italic" text-anchor="middle" stroke="none">?</text>
  </g>
  <!-- the five-second nudge -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="36" y1="30" x2="76" y2="30" stroke-width="1.2" stroke-dasharray="3 2"/>
    <polygon points="80,30 74,27 74,33" stroke="none"/>
    <text x="45" y="23" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.3" stroke="none">5 s</text>
    <text x="40" y="44" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.2" stroke="none">O(1)</text>
  </g>
  <!-- AI disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="108" cy="30" rx="24" ry="13"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="108" cy="30" rx="24" ry="13" stroke-width="1.4" fill="none"/>
    <text x="108" y="33" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle" letter-spacing="0.08em" stroke="none">AI</text>
  </g>
  <!-- ripples: the traversal the question forces -->
  <g class="blueprint" stroke="currentColor" fill="none">
    <path d="M 140 16 Q 150 30 140 44" stroke-width="1.2"/>
    <path d="M 152 10 Q 165 30 152 50" stroke-width="1" opacity="0.75"/>
    <path d="M 164 5 Q 180 30 164 55" stroke-width="0.8" opacity="0.5"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="182" y="33" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.2">O(N)</text>
  </g>
</svg>

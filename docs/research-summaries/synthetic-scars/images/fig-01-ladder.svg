<svg viewBox="0 0 720 422" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A six-rung ladder of where a rule lives, bottom to top. In the weights only: the diagnosis of Parts 1 and 2. Prose in the prompt: Part 1's scar catalog and Part 3's minus-infinity cutoff as a sentence. Shaped prompt: Part 3's affirmative reflex, Part 3.5's Socratic backprompt, Part 3.9's Flores handshake. Formalism in the prompt: Part 3.6's Makefile and Part 3.8's canonical primitives. On disk, model-written: Part 3.7's init.d files and Part 1's Step-21 scar commit. Enforced by a runtime: harebrain's chart and guards, and the nemik hooks cited in Part 3.8.">

<svg viewBox="0 0 620 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping Makefile-DAG constructs (left, oxblood) onto harebrain primitives (right, blueprint): target to state, prerequisite to transition guard, recipe to the LLM at the leaf, physical predicate to sound guard, dirty-tree invalidation to falsified guard and re-entry, atomic barrier tuple to a human-signal guard, session frontier oracle to configuration recomputed from the Manifest, meta-targets to entry points, and the Feldman fan-in triad to a limit that is moot under a real evaluator.">

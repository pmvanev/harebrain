<svg viewBox="0 0 620 284" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two rows. Top, bounded reward: a number line from minus one to plus one, a 0.98 success mass at plus one and a 0.02 crash mass clipped at minus one; expected reward plus 0.96, so the optimizer prefers the gamble. Bottom, ruin as an absorbing barrier: the same success mass, but the crash sits behind a wall at minus infinity; expected utility minus infinity, so no average survives the barrier.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    .muted-tint     { color: rgba(93, 85, 63, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
      .muted-tint     { color: rgba(168, 156, 125, 0.10); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="22" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">THE ALIGNMENT ILLUSION</text>
  </g>

  <!-- ROW 1: bounded reward -->
  <g class="muted-tint" stroke="none" fill="currentColor"><rect x="20" y="36" width="580" height="112" rx="8"/></g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="34" y="58" font-family="Fraunces, serif" font-size="13" font-style="italic">bounded reward (RLHF)</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="586" y="58" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end">r &#8712; [&#8722;1, +1]</text>
  </g>
  <g class="ink" stroke="currentColor" fill="currentColor">
    <line x1="120" y1="104" x2="560" y2="104" stroke-width="1.2"/>
    <line x1="120" y1="100" x2="120" y2="108" stroke-width="1"/>
    <line x1="340" y1="100" x2="340" y2="108" stroke-width="1"/>
    <line x1="560" y1="100" x2="560" y2="108" stroke-width="1"/>
    <text x="120" y="119" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">&#8722;1</text>
    <text x="340" y="119" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">0</text>
    <text x="560" y="119" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">+1</text>
  </g>
  <g class="sage" stroke="none" fill="currentColor">
    <rect x="555" y="65" width="10" height="39" rx="2"/>
    <text x="548" y="80" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end">p = 0.98 success</text>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <rect x="115" y="100" width="10" height="4" rx="1"/>
    <text x="132" y="96" font-family="JetBrains Mono, monospace" font-size="8">p = 0.02 crash, clipped at &#8722;1</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <polygon points="551.2,96 547.2,90 555.2,90"/>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="120" y="138" font-family="JetBrains Mono, monospace" font-size="8.5">E[r] = 0.98&#183;(+1) + 0.02&#183;(&#8722;1) = +0.96</text>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="586" y="138" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="end">&#8594; the optimizer prefers the gamble</text>
  </g>

  <!-- ROW 2: absorbing barrier -->
  <g class="muted-tint" stroke="none" fill="currentColor"><rect x="20" y="160" width="580" height="112" rx="8"/></g>
  <g class="sage" stroke="none" fill="currentColor">
    <text x="34" y="182" font-family="Fraunces, serif" font-size="13" font-style="italic">ruin as an absorbing barrier</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="586" y="182" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end">u(ruin) = &#8722;&#8734;</text>
  </g>
  <g class="ink" stroke="currentColor" fill="currentColor">
    <line x1="150" y1="228" x2="560" y2="228" stroke-width="1.2"/>
    <line x1="340" y1="224" x2="340" y2="232" stroke-width="1"/>
    <line x1="560" y1="224" x2="560" y2="232" stroke-width="1"/>
    <text x="340" y="243" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">0</text>
    <text x="560" y="243" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">+1</text>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="150" y1="196" x2="150" y2="244" stroke-width="3"/>
    <line x1="138" y1="200" x2="148" y2="210" stroke-width="0.9"/>
    <line x1="138" y1="214" x2="148" y2="224" stroke-width="0.9"/>
    <line x1="138" y1="228" x2="148" y2="238" stroke-width="0.9"/>
    <text x="112" y="234" font-family="Fraunces, serif" font-size="18" font-style="italic" text-anchor="middle" stroke="none">&#8722;&#8734;</text>
    <text x="160" y="220" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">p = 0.02 crash, behind the wall</text>
  </g>
  <g class="sage" stroke="none" fill="currentColor">
    <rect x="555" y="189" width="10" height="39" rx="2"/>
    <text x="548" y="204" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end">p = 0.98 success</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="150" y="262" font-family="JetBrains Mono, monospace" font-size="8.5">E[u] = 0.98&#183;(+1) + 0.02&#183;(&#8722;&#8734;) = &#8722;&#8734;</text>
  </g>
  <g class="sage" stroke="none" fill="currentColor">
    <text x="586" y="262" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="end">&#8594; no average survives the barrier</text>
  </g>
</svg>

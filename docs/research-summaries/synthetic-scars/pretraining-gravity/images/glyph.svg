<svg width="210" height="60" viewBox="0 0 210 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pre-training gravity glyph: a token rolls off a flat plain marked with an invented bracket tag and falls into a deep canyon labelled make.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>
  <!-- the flat plain: invented DSL, Freq ~ 0 -->
  <g class="oxblood" stroke="currentColor" fill="none">
    <line x1="4" y1="22" x2="70" y2="22" stroke-width="1.3"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="6" y="15" font-family="ui-monospace, monospace" font-size="7">[STEP_4]</text>
  </g>
  <!-- the canyon: canonical formalism, Freq > 10^6 -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <path d="M70,22 C86,22 92,54 112,54 C132,54 138,22 154,22 Z"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="none">
    <path d="M70,22 C86,22 92,54 112,54 C132,54 138,22 154,22 L206,22" stroke-width="1.4"/>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="112" y="40" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">make:</text>
    <text x="158" y="15" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em">FREQ &gt; 10&#8310;</text>
  </g>
  <!-- the token falling in -->
  <g class="ink" stroke="none" fill="currentColor">
    <circle cx="80" cy="30" r="3.2"/>
  </g>
  <g class="muted" stroke="currentColor" fill="none">
    <path d="M58,17 C66,14 74,20 77,26" stroke-width="1" stroke-dasharray="2 2"/>
  </g>
</svg>

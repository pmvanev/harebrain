<svg viewBox="0 0 620 614" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping Part 3.8 constructs (left, oxblood) onto harebrain primitives (right, blueprint): invented prompt DSL to the .mpl surface syntax; Makefile DAG to statechart topology; init.d latches to the blackboard and Manifest; fork and wait to the LLM at the leaf; RFC 822 and EBNF to the typed seam; Design-by-Contract to a sound transition guard; two-phase commit to an AND-state join; circuit breaker to a retry budget as a chart state; compiler-pass diagnostics to the critic bank.">

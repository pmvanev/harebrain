<svg viewBox="0 0 620 328" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three rungs, left to right. Prose rule in the prompt: the model invents the semantics; a retry rule passed 0.8 percent and a PROGRESS.md rule 0.8 percent. Canonical formalism in the prompt: the model recalls known semantics; the circuit-breaker spec passed 98.3 percent and init.d latches 60 percent. Formalism executed outside the model: the runtime enforces it, so the breaker and the persisted state hold by construction. The article climbs from rung one to two; harebrain sits on rung three.">

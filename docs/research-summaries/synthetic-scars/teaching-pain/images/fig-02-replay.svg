<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Step 21, the neocortical replay: plan against the scar catalog, execute the ticket, then before closing run an autopsy and distill any new failure into wound, trap and reflex, and commit it to the catalog. The catalog is the only thing that crosses the session boundary into the next plan.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    .muted-tint     { color: rgba(93, 85, 63, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
      .muted-tint     { color: rgba(168, 156, 125, 0.10); }
    }
  </style>

  <!-- top row: plan, execute -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="40" y="40" width="150" height="56" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="40" y="40" width="150" height="56" rx="6" stroke-width="1.3" fill="none"/>
    <text x="52" y="62" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">plan</text>
    <text x="52" y="81" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">consult the scar catalog</text>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="240" y="40" width="150" height="56" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="240" y="40" width="150" height="56" rx="6" stroke-width="1.3" fill="none"/>
    <text x="252" y="62" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">execute ticket</text>
    <text x="252" y="81" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">compiler, tests, surprises</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="440" y="62" font-family="Spectral, serif" font-size="10" font-style="italic">&#8220;Done&#8221; is not allowed yet</text>
    <text x="440" y="78" font-family="Spectral, serif" font-size="10" font-style="italic">&#8212; a post-mortem first.</text>
  </g>

  <!-- replay bracket -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="226" y="192" width="380" height="96" rx="10" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
    <text x="238" y="186" font-family="JetBrains Mono, monospace" font-size="8.5" letter-spacing="0.08em" stroke="none">STEP 21 &#183; THE NEOCORTICAL REPLAY</text>
  </g>

  <!-- bottom row: distill, autopsy -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="440" y="212" width="150" height="56" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="440" y="212" width="150" height="56" rx="6" stroke-width="1.3" fill="none"/>
    <text x="452" y="234" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">autopsy</text>
    <text x="452" y="253" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">where did it bite us?</text>
  </g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="240" y="212" width="150" height="56" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="240" y="212" width="150" height="56" rx="6" stroke-width="1.3" fill="none"/>
    <text x="252" y="234" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">distill</text>
    <text x="252" y="253" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">new? &#8594; wound/trap/reflex</text>
  </g>

  <!-- catalog -->
  <g class="muted-tint" stroke="none" fill="currentColor"><rect x="40" y="204" width="150" height="72" rx="6"/></g>
  <g class="ink" stroke="currentColor" fill="currentColor">
    <rect x="40" y="204" width="150" height="72" rx="6" stroke-width="1.6" fill="none"/>
    <line x1="40" y1="214" x2="190" y2="214" stroke-width="0.8"/>
    <text x="52" y="234" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">scar catalog</text>
    <text x="52" y="251" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">in the repo, not the</text>
    <text x="52" y="263" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">context window</text>
  </g>

  <!-- arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <!-- plan -> execute -->
    <line x1="191" y1="68" x2="234" y2="68" stroke-width="1.3"/>
    <polygon points="238,68 232,65 232,71" stroke="none"/>
    <!-- execute -> autopsy -->
    <path d="M391,68 L 515,68 L 515,206" stroke-width="1.3" fill="none"/>
    <polygon points="515,210 512,204 518,204" stroke="none"/>
    <!-- autopsy -> distill -->
    <line x1="439" y1="240" x2="396" y2="240" stroke-width="1.3"/>
    <polygon points="392,240 398,237 398,243" stroke="none"/>
  </g>
  <!-- distill -> catalog (consolidate) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="239" y1="240" x2="196" y2="240" stroke-width="1.6"/>
    <polygon points="192,240 198,237 198,243" stroke="none"/>
  </g>
  <g class="sage" stroke="none" fill="currentColor">
    <text x="196" y="306" font-family="JetBrains Mono, monospace" font-size="8">consolidate &#183; commit</text>
  </g>
  <g class="sage" stroke="currentColor" fill="none">
    <line x1="215" y1="244" x2="215" y2="296" stroke-width="0.8" stroke-dasharray="2 2"/>
  </g>

  <!-- catalog -> plan, across the session boundary -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="165" y1="203" x2="165" y2="102" stroke-width="1.4" stroke-dasharray="4 3"/>
    <polygon points="165,98 162,104 168,104" stroke="none"/>
  </g>
  <g class="muted" stroke="currentColor" fill="none">
    <line x1="20" y1="150" x2="210" y2="150" stroke-width="1" stroke-dasharray="1 3"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="24" y="143" font-family="JetBrains Mono, monospace" font-size="7.5">next session</text>
    <text x="24" y="164" font-family="JetBrains Mono, monospace" font-size="7.5">amnesia, except</text>
    <text x="24" y="175" font-family="JetBrains Mono, monospace" font-size="7.5">the catalog</text>
  </g>

  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="318" x2="580" y2="318" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="334" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">Yesterday&#8217;s failure becomes today&#8217;s planning input &#8212; the only thing that crosses the boundary.</text>
  </g>
</svg>

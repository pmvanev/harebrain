<svg width="210" height="60" viewBox="0 0 210 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Synthetic-scar glyph: an AI disc reaches toward a trap, recoils along a curved arrow, and a stitched scar line sits above the trap.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- AI disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="32" cy="36" rx="24" ry="13"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="32" cy="36" rx="24" ry="13" stroke-width="1.4" fill="none"/>
    <text x="32" y="39" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle" letter-spacing="0.08em" stroke="none">AI</text>
  </g>
  <!-- reach toward the trap (dashed: the tempting path) -->
  <g class="muted" stroke="currentColor" fill="none">
    <line x1="57" y1="40" x2="128" y2="40" stroke-width="1.1" stroke-dasharray="3 3"/>
  </g>
  <!-- recoil arc -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <path d="M128,40 C 136,24 112,14 82,20" stroke-width="1.4" fill="none"/>
    <polygon points="78,21 85,16 85,24" stroke="none"/>
    <text x="88" y="12" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.4" stroke="none">recoil</text>
  </g>
  <!-- trap box -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="136" y="30" width="62" height="22" rx="4"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="136" y="30" width="62" height="22" rx="4" stroke-width="1.4" fill="none"/>
    <text x="167" y="44" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.1em" stroke="none">trap</text>
  </g>
  <!-- stitched scar -->
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.2">
    <line x1="142" y1="16" x2="194" y2="16"/>
    <line x1="148" y1="11" x2="152" y2="21"/>
    <line x1="158" y1="11" x2="162" y2="21"/>
    <line x1="168" y1="11" x2="172" y2="21"/>
    <line x1="178" y1="11" x2="182" y2="21"/>
    <line x1="188" y1="11" x2="192" y2="21"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="142" y="7" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em">SCAR-ASYNC-03</text>
  </g>
</svg>

<svg viewBox="0 0 620 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping Socratic-prompting constructs (left, oxblood) onto harebrain primitives (right, blueprint): scalar thumbs-down to a per-transition trace; Socratic question to an EDD expectation or soft critic; synthetic scar to a guard with provenance; minus-infinity cutoff to a utility veto or removed edge; permanent reflex to a positively phrased guard; meta-model traps to critic-bank axes; the senior's wince to the human on the slow clock; flight director to the AI Director; the pond to the cage, the part you can single-step.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="140" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">Socratic prompting</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="480" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/>
  </g>
  <!-- Row 1 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="60" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">scalar thumbs-down</text>
    <text x="30" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">credit smeared over the whole trip</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="60" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">per-transition trace</text>
    <text x="370" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">failure attributed to one edge</text>
  </g>
  <!-- Row 2 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="118" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">Socratic precision question</text>
    <text x="30" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">names the failure scenarios</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="118" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">EDD expectation / soft critic</text>
    <text x="370" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">scenarios the evidence must cover</text>
  </g>
  <!-- Row 3 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="176" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">synthetic scar</text>
    <text x="30" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">wound &#183; trap &#183; reflex</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="176" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">guard with provenance</text>
    <text x="370" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">incident &#8594; test &#8594; predicate</text>
  </g>
  <!-- Row 4 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="234" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">&#8722;&#8734; cutoff at d = 1</text>
    <text x="30" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">known trap pruned before search</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="234" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">utility veto / removed edge</text>
    <text x="370" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">a zero consideration, not a plea</text>
  </g>
  <!-- Row 5 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="292" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">permanent reflex</text>
    <text x="30" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">affirmative invariant</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="292" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">positively-phrased guard</text>
    <text x="370" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">[sub_bound_to_teardown]</text>
  </g>
  <!-- Row 6 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="350" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="350" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="368" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">meta-model traps</text>
    <text x="30" y="385" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">generalize &#183; delete &#183; distort</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="350" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="350" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="368" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">critic-bank axes</text>
    <text x="370" y="385" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">three questions every critic asks</text>
  </g>
  <!-- Row 7 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="408" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="408" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="426" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the senior&#8217;s wince</text>
    <text x="30" y="443" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">compressed incident memory</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="408" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="408" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="426" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">human on the slow clock</text>
    <text x="370" y="443" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">authors guards from incidents</text>
  </g>
  <!-- Row 8 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="466" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="466" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="484" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">flight director</text>
    <text x="30" y="501" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">watches telemetry, holds the keys</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="466" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="466" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="484" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">AI Director</text>
    <text x="370" y="501" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">outer loop watching the inner</text>
  </g>
  <!-- Row 9 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="524" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="524" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="542" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the pond</text>
    <text x="30" y="559" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">you cannot single-step the brain</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="524" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="524" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="542" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the cage</text>
    <text x="370" y="559" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the part you can single-step</text>
  </g>
  <!-- connecting arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="82" x2="358" y2="82" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,82 352,79 352,85" stroke="none"/>
    <line x1="262" y1="140" x2="358" y2="140" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,140 352,137 352,143" stroke="none"/>
    <line x1="262" y1="198" x2="358" y2="198" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,198 352,195 352,201" stroke="none"/>
    <line x1="262" y1="256" x2="358" y2="256" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,256 352,253 352,259" stroke="none"/>
    <line x1="262" y1="314" x2="358" y2="314" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,314 352,311 352,317" stroke="none"/>
    <line x1="262" y1="372" x2="358" y2="372" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,372 352,369 352,375" stroke="none"/>
    <line x1="262" y1="430" x2="358" y2="430" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,430 352,427 352,433" stroke="none"/>
    <line x1="262" y1="488" x2="358" y2="488" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,488 352,485 352,491" stroke="none"/>
    <line x1="262" y1="546" x2="358" y2="546" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,546 352,543 352,549" stroke="none"/>
  </g>

  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="584" x2="580" y2="584" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="602" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Socratic prompting tunes what the brain reads &#183; harebrain moves the cutoff into the cage</text>
  </g>
</svg>

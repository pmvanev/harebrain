<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A synthetic scar as a depth-one cutoff. Three candidate plans branch from the root. Candidate A, a safe primitive, expands into a mutex and a completer. Candidate B, a flaky timer, is cut by SCAR-ASYNC-04 with score minus infinity. Candidate C, an unchecked dispose, is cut by SCAR-LIFECYCLE-01.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .sage           { color: #4f6b3f; }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    .muted-tint     { color: rgba(93, 85, 63, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .sage           { color: #b1c98c; }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
      .muted-tint     { color: rgba(168, 156, 125, 0.10); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="20" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">A SYNTHETIC SCAR AS A DEPTH-1 CUTOFF</text>
  </g>

  <!-- root -->
  <g class="muted-tint" stroke="none" fill="currentColor"><ellipse cx="310" cy="58" rx="62" ry="16"/></g>
  <g class="ink" stroke="currentColor" fill="currentColor">
    <ellipse cx="310" cy="58" rx="62" ry="16" stroke-width="1.3" fill="none"/>
    <text x="310" y="62" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">candidate plans</text>
  </g>

  <!-- edges root -> children -->
  <g class="sage" stroke="currentColor" fill="none">
    <line x1="270" y1="70" x2="150" y2="118" stroke-width="1.4"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="none">
    <line x1="310" y1="74" x2="310" y2="118" stroke-width="1.3"/>
    <line x1="350" y1="70" x2="470" y2="118" stroke-width="1.3"/>
  </g>

  <!-- A -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="55" y="118" width="150" height="44" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="55" y="118" width="150" height="44" rx="6" stroke-width="1.6" fill="none"/>
    <text x="65" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">A &#183; safe primitive</text>
    <text x="65" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">completer &#183; mutex &#183; stream</text>
  </g>
  <!-- B -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="235" y="118" width="150" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="235" y="118" width="150" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="245" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">B &#183; flaky timer</text>
    <text x="245" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">Future.delayed(100ms)</text>
  </g>
  <!-- C -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="415" y="118" width="150" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="415" y="118" width="150" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="425" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">C &#183; unchecked dispose</text>
    <text x="425" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">setState after unmount</text>
  </g>

  <!-- A expands -->
  <g class="sage" stroke="currentColor" fill="none">
    <line x1="110" y1="162" x2="80" y2="198" stroke-width="1.2"/>
    <line x1="150" y1="162" x2="180" y2="198" stroke-width="1.2"/>
    <rect x="30" y="198" width="100" height="30" rx="5" stroke-width="1.2"/>
    <rect x="130" y="198" width="100" height="30" rx="5" stroke-width="1.2"/>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="80" y="217" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">det. mutex</text>
    <text x="180" y="217" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">completer</text>
  </g>

  <!-- B / C cut -->
  <g class="oxblood" stroke="currentColor" fill="none">
    <line x1="310" y1="162" x2="310" y2="196" stroke-width="1.2"/>
    <line x1="302" y1="176" x2="314" y2="182" stroke-width="1.8"/>
    <line x1="306" y1="172" x2="318" y2="178" stroke-width="1.8"/>
    <line x1="490" y1="162" x2="490" y2="196" stroke-width="1.2"/>
    <line x1="482" y1="176" x2="494" y2="182" stroke-width="1.8"/>
    <line x1="486" y1="172" x2="498" y2="178" stroke-width="1.8"/>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="235" y="196" width="150" height="40" rx="5"/>
    <rect x="415" y="196" width="150" height="40" rx="5"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="235" y="196" width="150" height="40" rx="5" stroke-width="2" fill="none"/>
    <rect x="415" y="196" width="150" height="40" rx="5" stroke-width="2" fill="none"/>
    <text x="310" y="212" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" stroke="none">SCAR-ASYNC-04</text>
    <text x="310" y="227" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">score &#8722;&#8734; &#183; cut at d = 1</text>
    <text x="490" y="212" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" stroke="none">SCAR-LIFECYCLE-01</text>
    <text x="490" y="227" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">score &#8722;&#8734; &#183; cut at d = 1</text>
  </g>

  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="254" x2="580" y2="254" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="272" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">in the article the cutoff is a sentence the model reads;</text>
    <text x="310" y="286" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">in Stockfish it is an evaluator that never expands the branch</text>
  </g>
</svg>

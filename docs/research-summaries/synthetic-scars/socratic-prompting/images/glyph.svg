<svg width="210" height="60" viewBox="0 0 210 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Socratic prompting glyph: a question mark sends an impulse into a three-branch search tree; one branch continues to a safe leaf, two are cut with scar marks scored minus infinity.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
    }
  </style>
  <!-- the question -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <circle cx="20" cy="30" r="15"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <circle cx="20" cy="30" r="15" stroke-width="1.4" fill="none"/>
    <text x="20" y="38" font-family="Fraunces, serif" font-size="22" font-style="italic" text-anchor="middle" stroke="none">?</text>
  </g>
  <!-- impulse arrow -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="37" y1="30" x2="70" y2="30" stroke-width="1.2"/>
    <polygon points="74,30 68,27 68,33" stroke="none"/>
    <text x="44" y="24" font-family="ui-monospace, monospace" font-size="6" stroke="none">&#916;K</text>
  </g>
  <!-- root -->
  <g class="ink" stroke="currentColor" fill="currentColor">
    <circle cx="80" cy="30" r="3.5" stroke="none"/>
  </g>
  <!-- safe branch -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="83" y1="28" x2="128" y2="12" stroke-width="1.3"/>
    <circle cx="130" cy="12" r="3" stroke="none"/>
    <line x1="133" y1="12" x2="170" y2="12" stroke-width="1.3"/>
    <circle cx="172" cy="12" r="3" stroke="none"/>
    <text x="178" y="15" font-family="ui-monospace, monospace" font-size="7" stroke="none">safe</text>
  </g>
  <!-- cut branches -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="84" y1="30" x2="110" y2="30" stroke-width="1.3"/>
    <line x1="108" y1="25" x2="113" y2="35" stroke-width="1.6"/>
    <line x1="113" y1="25" x2="118" y2="35" stroke-width="1.6"/>
    <line x1="83" y1="32" x2="108" y2="44" stroke-width="1.3"/>
    <line x1="106" y1="39" x2="109" y2="50" stroke-width="1.6"/>
    <line x1="111" y1="39" x2="114" y2="50" stroke-width="1.6"/>
    <text x="124" y="33" font-family="ui-monospace, monospace" font-size="7" stroke="none">&#8722;&#8734;</text>
    <text x="122" y="49" font-family="ui-monospace, monospace" font-size="7" stroke="none">&#8722;&#8734;</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="142" y="41" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em">PRUNED d=1</text>
  </g>
</svg>

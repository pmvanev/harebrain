<svg width="200" height="58" viewBox="0 0 200 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgentSpec glyph: an LLM disc proposes an action that crosses a guard gate; on a satisfied check the gate fires an enforce arrow, on failure the action is blocked.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- LLM disc (the brain) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="28" cy="29" rx="23" ry="13"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="28" cy="29" rx="23" ry="13" stroke-width="1.4" fill="none"/>
    <text x="28" y="32" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle" letter-spacing="0.1em" stroke="none">LLM</text>
  </g>
  <!-- action arrow into the gate -->
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <line x1="52" y1="29" x2="92" y2="29" stroke-width="1.3"/>
    <polygon points="95,29 89,26 89,32" stroke="none"/>
    <text x="55" y="23" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.3" stroke="none">action</text>
  </g>
  <!-- the guard gate (diamond) -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <polygon points="115,12 138,29 115,46 92,29"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <polygon points="115,12 138,29 115,46 92,29" stroke-width="1.4" fill="none"/>
    <text x="115" y="32" font-family="ui-monospace, monospace" font-size="7" text-anchor="middle" stroke="none">check</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="115" y="8" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em" text-anchor="middle">GUARD</text>
  </g>
  <!-- enforce arrow (satisfied -> intervene) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="140" y1="29" x2="180" y2="29" stroke-width="1.3"/>
    <polygon points="183,29 177,26 177,32" stroke="none"/>
    <text x="143" y="23" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.3" stroke="none">enforce</text>
  </g>
  <!-- blocked branch (dashed, halts) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="115" y1="48" x2="115" y2="54" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="120" y="54" font-family="ui-monospace, monospace" font-size="6" stroke="none">stop</text>
  </g>
</svg>

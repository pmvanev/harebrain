<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rule leverage across three domains: code agents reach over 90 percent prevention with 25 rules covering 750 scenarios (30 per rule); embodied agents reach 100 percent with 12 rules over 250 scenarios (21 per rule); autonomous vehicles reach 100 percent with 6 rules over 8 scenarios (1.3 per rule). Generalization falls as the domain narrows.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.10); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.10); }
    .sage-tint      { color: rgba(79, 107, 63, 0.12); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.16); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.16); }
      .sage-tint      { color: rgba(177, 201, 140, 0.16); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="30" y="26" font-family="Fraunces, serif" font-size="13" font-style="italic">Manual rules buy leverage &#8212; how much depends on how regular the risk is</text>
  </g>

  <!-- three columns -->
  <!-- Code -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="40" y="56" width="160" height="210" rx="8"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="40" y="56" width="160" height="210" rx="8" stroke-width="1.3" fill="none"/>
    <text x="120" y="82" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle" stroke="none">Code agent</text>
    <text x="120" y="100" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">RedCode-Exec</text>
    <text x="120" y="150" font-family="Fraunces, serif" font-size="34" text-anchor="middle" stroke="none">&gt;90%</text>
    <text x="120" y="168" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">risky exec prevented</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="120" y="206" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">25 rules &#183; 750 scenarios</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="120" y="232" font-family="Fraunces, serif" font-size="16" font-style="italic" text-anchor="middle">30&#215;</text>
    <text x="120" y="250" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">scenarios per rule</text>
  </g>

  <!-- Embodied -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="230" y="56" width="160" height="210" rx="8"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="230" y="56" width="160" height="210" rx="8" stroke-width="1.3" fill="none"/>
    <text x="310" y="82" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle" stroke="none">Embodied agent</text>
    <text x="310" y="100" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">SafeAgentBench</text>
    <text x="310" y="150" font-family="Fraunces, serif" font-size="34" text-anchor="middle" stroke="none">100%</text>
    <text x="310" y="168" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">hazards eliminated</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="206" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">12 rules &#183; 250 scenarios</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="310" y="232" font-family="Fraunces, serif" font-size="16" font-style="italic" text-anchor="middle">21&#215;</text>
    <text x="310" y="250" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">scenarios per rule</text>
  </g>

  <!-- AV -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="420" y="56" width="160" height="210" rx="8"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="420" y="56" width="160" height="210" rx="8" stroke-width="1.3" fill="none"/>
    <text x="500" y="82" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle" stroke="none">AV agent</text>
    <text x="500" y="100" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">FixDrive / Apollo</text>
    <text x="500" y="150" font-family="Fraunces, serif" font-size="34" text-anchor="middle" stroke="none">8/8</text>
    <text x="500" y="168" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">law-breaks stopped</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="500" y="206" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">6 rules &#183; 8 scenarios</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="500" y="232" font-family="Fraunces, serif" font-size="16" font-style="italic" text-anchor="middle">1.3&#215;</text>
    <text x="500" y="250" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">scenarios per rule</text>
  </g>

  <!-- leverage gradient arrow -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="120" y1="284" x2="500" y2="284" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="503,284 497,281 497,287" stroke="none"/>
    <text x="310" y="304" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">leverage falls as the domain narrows &#8212; one law, one rule, no generalization</text>
  </g>
</svg>

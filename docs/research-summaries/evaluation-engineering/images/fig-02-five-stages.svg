<svg viewBox="0 0 560 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A five-stage horizontal pipeline: Provisioning, Specification (flagged 41.4 percent of issues, the integration seam), Execution, Assessment (flagged silent failures live here), Reporting (flagged least supported, regression alerting 8.8 percent). An arc below shows root causes shifting from environment and dependency in early stages to scoring and validation correctness in late stages, with validation gap spanning all five.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.10); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.14); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">the anatomy of a runner</text></g>

  <!-- five stages -->
  <!-- S0 -->
  <g class="blueprint-tint" fill="currentColor"><rect x="16" y="40" width="92" height="46" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="16" y="40" width="92" height="46" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="62" y="60" font-family="Spectral, serif" font-size="10.5" font-style="italic" text-anchor="middle">Provisioning</text>
    <text x="62" y="74" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">install + creds</text></g>
  <!-- S1 flagged -->
  <g class="oxblood-tint" fill="currentColor"><rect x="118" y="40" width="92" height="46" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="118" y="40" width="92" height="46" rx="5" stroke-width="1.7"/></g>
  <g class="ink" fill="currentColor"><text x="164" y="60" font-family="Spectral, serif" font-size="10.5" font-style="italic" text-anchor="middle">Specification</text>
    <text x="164" y="74" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">SUT + data + judge</text></g>
  <!-- S2 -->
  <g class="blueprint-tint" fill="currentColor"><rect x="220" y="40" width="92" height="46" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="220" y="40" width="92" height="46" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="266" y="60" font-family="Spectral, serif" font-size="10.5" font-style="italic" text-anchor="middle">Execution</text>
    <text x="266" y="74" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">run the SUT</text></g>
  <!-- S3 flagged -->
  <g class="oxblood-tint" fill="currentColor"><rect x="322" y="40" width="92" height="46" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="322" y="40" width="92" height="46" rx="5" stroke-width="1.7"/></g>
  <g class="ink" fill="currentColor"><text x="368" y="60" font-family="Spectral, serif" font-size="10.5" font-style="italic" text-anchor="middle">Assessment</text>
    <text x="368" y="74" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">scoring</text></g>
  <!-- S4 -->
  <g class="blueprint-tint" fill="currentColor"><rect x="424" y="40" width="92" height="46" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="424" y="40" width="92" height="46" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="470" y="60" font-family="Spectral, serif" font-size="10.5" font-style="italic" text-anchor="middle">Reporting</text>
    <text x="470" y="74" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">viz + leaderboard</text></g>

  <!-- arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor" stroke-width="1.2">
    <line x1="108" y1="63" x2="116" y2="63"/><polygon points="118,63 113,61 113,65" stroke="none"/>
    <line x1="210" y1="63" x2="218" y2="63"/><polygon points="220,63 215,61 215,65" stroke="none"/>
    <line x1="312" y1="63" x2="320" y2="63"/><polygon points="322,63 317,61 317,65" stroke="none"/>
    <line x1="414" y1="63" x2="422" y2="63"/><polygon points="424,63 419,61 419,65" stroke="none"/>
  </g>

  <!-- flags -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="164" y="104" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">41.4% of issues</text>
    <text x="164" y="115" font-family="Spectral, serif" font-size="8.5" font-style="italic" text-anchor="middle">the integration seam</text>
    <text x="368" y="104" font-family="Spectral, serif" font-size="8.5" font-style="italic" text-anchor="middle">silent failures live here</text>
    <text x="470" y="104" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">least supported</text>
    <text x="470" y="115" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">regress-alert 8.8%</text>
  </g>

  <!-- shift arc -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1.3"><path d="M62 150 Q280 188 470 150" stroke-dasharray="4 3"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="80" y="166" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">environment /</text>
    <text x="80" y="176" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">dependency</text>
    <text x="470" y="166" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">scoring /</text>
    <text x="470" y="176" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">validation correctness</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor"><text x="280" y="200" font-family="Spectral, serif" font-size="9.5" font-style="italic" text-anchor="middle">root causes shift early &#8594; late</text></g>

  <!-- validation gap spanning all -->
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.3"><rect x="16" y="216" width="500" height="22" rx="11" stroke-dasharray="5 3"/></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="266" y="231" font-family="Spectral, serif" font-size="9.5" font-style="italic" text-anchor="middle">validation gap &#8212; the only root cause present in every stage (peaks 22.7% at Assessment)</text></g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="258" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">the burden is operationalization, not metric math &#8212; scoring errors are only 8.3%</text></g>
</svg>

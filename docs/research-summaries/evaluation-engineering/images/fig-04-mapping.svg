<svg viewBox="0 0 560 322" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two-column mapping: EvalEng harness constructs on the left in oxblood map by dashed arrows to wumpus-runner and harebrain constructs on the right in blueprint.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="oxblood" stroke="none" fill="currentColor"><text x="120" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">EvalEng harness</text></g>
  <g class="blueprint" stroke="none" fill="currentColor"><text x="440" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">wumpus runner</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="22" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">is a</text></g>

  <!-- Row 1 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="20" y="36" width="212" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="20" y="36" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="56" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">operational reliability</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="328" y="36" width="212" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="328" y="36" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="56" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">runner correctness, distinct from ABC</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="234" y1="52" x2="326" y2="52" stroke-dasharray="3 3"/></g>

  <!-- Row 2 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="20" y="76" width="212" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="20" y="76" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="96" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">Specification seam (41%)</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="328" y="76" width="212" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="328" y="76" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="96" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">host-import return contracts</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="234" y1="92" x2="326" y2="92" stroke-dasharray="3 3"/></g>

  <!-- Row 3 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="20" y="116" width="212" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="20" y="116" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="136" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">silent failure / test-oracle</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="328" y="116" width="212" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="328" y="116" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="136" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">ledger + oracle divergence event</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="234" y1="132" x2="326" y2="132" stroke-dasharray="3 3"/></g>

  <!-- Row 4 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="20" y="156" width="212" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="20" y="156" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="176" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">metamorphic test</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="328" y="156" width="212" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="328" y="156" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="176" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">Wumpus &#8594; Mystery obfuscation gap</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="234" y1="172" x2="326" y2="172" stroke-dasharray="3 3"/></g>

  <!-- Row 5 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="20" y="196" width="212" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="20" y="196" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="216" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">differential test</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="328" y="196" width="212" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="328" y="196" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="216" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">cells A&#183;B&#183;C vs D, one cage/seed</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="234" y1="212" x2="326" y2="212" stroke-dasharray="3 3"/></g>

  <!-- Row 6 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="20" y="236" width="212" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="20" y="236" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="256" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">regression alerting</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="328" y="236" width="212" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="328" y="236" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="256" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">CIs across seeds, AI Director watch</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="234" y1="252" x2="326" y2="252" stroke-dasharray="3 3"/></g>

  <!-- Row 7 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="20" y="276" width="212" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="20" y="276" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="296" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">machine-readable harness spec</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="328" y="276" width="212" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="328" y="276" width="212" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="296" font-family="Spectral, serif" font-size="10.5" text-anchor="middle">the feature-delta runner contract</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="234" y1="292" x2="326" y2="292" stroke-dasharray="3 3"/></g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="318" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">the runner harebrain already built, named as the software product this paper says it is</text></g>
</svg>

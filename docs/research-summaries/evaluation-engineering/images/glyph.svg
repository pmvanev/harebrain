<svg width="216" height="60" viewBox="0 0 216 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evaluation-engineering glyph: a five-stage pipeline feeds a results gauge; a wrench sits on the specification seam where the pipes join, and a magnifier catches a silent score shift downstream.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- five pipe segments -->
  <g class="blueprint" stroke="currentColor" fill="none" stroke-width="1.4">
    <rect x="8" y="24" width="20" height="14" rx="2"/>
    <rect x="34" y="24" width="20" height="14" rx="2"/>
    <rect x="60" y="24" width="20" height="14" rx="2"/>
    <rect x="86" y="24" width="20" height="14" rx="2"/>
    <rect x="112" y="24" width="20" height="14" rx="2"/>
  </g>
  <g class="muted" stroke="currentColor" fill="currentColor" stroke-width="1.1">
    <line x1="28" y1="31" x2="34" y2="31"/><line x1="54" y1="31" x2="60" y2="31"/>
    <line x1="80" y1="31" x2="86" y2="31"/><line x1="106" y1="31" x2="112" y2="31"/>
    <line x1="132" y1="31" x2="140" y2="31"/><polygon points="143,31 137,28 137,34" stroke="none"/>
  </g>
  <!-- wrench on the specification seam (between seg1 and seg2) -->
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M29 16 a4 4 0 1 0 3.5 6 L37 26.5 L40 23.5 L35.5 19 A4 4 0 0 0 29 16 Z"/>
  </g>
  <!-- results gauge -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><circle cx="158" cy="31" r="13"/></g>
  <g class="blueprint" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="158" cy="31" r="13"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor" stroke-width="1.4" stroke-linecap="round">
    <line x1="158" y1="31" x2="164" y2="24"/><circle cx="158" cy="31" r="1.5" stroke="none"/>
  </g>
  <!-- magnifier catching a silent shift -->
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.6">
    <circle cx="184" cy="40" r="8"/><line x1="190" y1="46" x2="198" y2="54" stroke-width="2.1" stroke-linecap="round"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="184" y="43" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">~</text></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="184" y="14" font-family="Fraunces, serif" font-style="italic" font-size="8.5" text-anchor="middle">silent</text>
  </g>
</svg>

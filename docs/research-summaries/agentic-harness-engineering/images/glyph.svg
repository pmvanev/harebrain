<svg width="216" height="58" viewBox="0 0 216 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agentic Harness Engineering glyph: a coding agent emits a raw trace, an agent-debugger distils it to layered evidence, an evolve agent commits a file-level harness edit carrying a predicted-impact manifest, and the next round's outcome verifies or reverts it in a closed loop">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.07); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>
  <!-- code agent disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><ellipse cx="27" cy="22" rx="24" ry="12"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="27" cy="22" rx="24" ry="12" stroke-width="1.4" fill="none"/>
    <text x="27" y="25" font-family="ui-monospace, monospace" font-size="7.5" text-anchor="middle" letter-spacing="0.06em" stroke="none">AGENT</text>
  </g>
  <!-- trace -> evidence (top arrow, oxblood) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="51" y1="18" x2="128" y2="18" stroke-width="1.3"/>
    <polygon points="131,18 125,15 125,21" stroke="none"/>
    <text x="60" y="13" font-family="ui-monospace, monospace" font-size="6.5" letter-spacing="0.3" stroke="none">trace &#8594; distil</text>
  </g>
  <!-- evidence / evolve ledger -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="133" y="6" width="78" height="32" rx="4"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="133" y="6" width="78" height="32" rx="4" stroke-width="1.4" fill="none"/>
    <text x="139" y="18" font-family="ui-monospace, monospace" font-size="6.5" stroke="none">edit &#10003; fix .82</text>
    <text x="139" y="29" font-family="ui-monospace, monospace" font-size="6.5" stroke="none">edit &#10007; revert</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="172" y="4" font-family="ui-monospace, monospace" font-size="5.5" letter-spacing="0.08em" text-anchor="middle">MANIFEST</text>
  </g>
  <!-- verify / revert return (bottom, dashed sage) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="128" y1="48" x2="32" y2="48" stroke-width="1.2" stroke-dasharray="3 3"/>
    <polygon points="29,48 35,45 35,51" stroke="none"/>
    <text x="44" y="57" font-family="ui-monospace, monospace" font-size="6.5" letter-spacing="0.3" stroke="none">next round verifies</text>
  </g>
  <!-- down stub from ledger to return line -->
  <g class="sage" stroke="currentColor" fill="none">
    <path d="M 172 38 L 172 48" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>
</svg>

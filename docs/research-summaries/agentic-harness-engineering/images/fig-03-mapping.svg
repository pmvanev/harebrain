<svg viewBox="0 0 620 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping Agentic Harness Engineering constructs (left, oxblood) onto harebrain primitives (right, blueprint): the NexAU seven-component substrate onto the cage; component observability with file-per-component and git-commit-per-edit onto the diagnostic surface and reviewable MPL diff; experience observability onto the deterministic trace where every drift is locatable to a state; decision observability with a predicted-impact manifest onto a chart amendment carrying a predicted impact verified next tick; the Evolve Agent onto the AI director on the slow clock; the controllability lockbox onto the invariants a Tier-4 self-edit cannot route around; falsifiable contract plus file-granular rollback onto a reviewable diff with auto-revert; and the pass-at-1 objective, which is regression-blind, onto the score that has no term for what the edit is about to break.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <!-- column headers -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="140" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">Agentic Harness Eng.</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/></g>

  <!-- Row 1 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="56" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="56" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="74" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">NexAU 7-component substrate</text>
    <text x="30" y="91" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">prompt, tools, middleware, memory&#8230;</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="56" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="56" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="74" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the cage</text>
    <text x="370" y="91" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">chart + blackboard + guards + seam</text>
  </g>

  <!-- Row 2 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="112" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="112" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="130" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">component observability</text>
    <text x="30" y="147" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">file-per-component, git commit/edit</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="112" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="112" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="130" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">diagnostic surface + MPL diff</text>
    <text x="370" y="147" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">audit trail of which version was live</text>
  </g>

  <!-- Row 3 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="168" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="168" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="186" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">experience observability</text>
    <text x="30" y="203" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">layered evidence, Agent Debugger</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="168" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="168" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="186" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the deterministic trace</text>
    <text x="370" y="203" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">every drift locatable to a state</text>
  </g>

  <!-- Row 4 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="224" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="224" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="242" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">decision observability</text>
    <text x="30" y="259" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">predicted-impact manifest per edit</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="224" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="224" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="242" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">amendment carries a prediction</text>
    <text x="370" y="259" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">verified next tick</text>
  </g>

  <!-- Row 5 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="280" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="280" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="298" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">Evolve Agent (offline)</text>
    <text x="30" y="315" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">edits the harness, never ships</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="280" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="280" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="298" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">AI director on the slow clock</text>
    <text x="370" y="315" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">chart authoring at design time</text>
  </g>

  <!-- Row 6 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="336" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="336" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="354" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">controllability lockbox</text>
    <text x="30" y="371" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">verifier/model/budget read-only</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="336" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="336" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="354" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">invariants the self-edit can't reach</text>
    <text x="370" y="371" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the Tier-4 floor</text>
  </g>

  <!-- Row 7 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="392" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="392" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="410" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">falsifiable contract + rollback</text>
    <text x="30" y="427" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">ineffective edits reverted, file-grained</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="392" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="392" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="410" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">reviewable diff + auto-revert</text>
    <text x="370" y="427" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">soundness from an external check</text>
  </g>

  <!-- Row 8 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="448" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="448" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="466" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">pass@1 objective</text>
    <text x="30" y="483" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">regression-blind (RQ3b)</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="448" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="448" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="466" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the score</text>
    <text x="370" y="483" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">no term for what it's about to break</text>
  </g>

  <!-- connecting arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="78"  x2="358" y2="78"  stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,78 352,75 352,81" stroke="none"/>
    <line x1="262" y1="134" x2="358" y2="134" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,134 352,131 352,137" stroke="none"/>
    <line x1="262" y1="190" x2="358" y2="190" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,190 352,187 352,193" stroke="none"/>
    <line x1="262" y1="246" x2="358" y2="246" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,246 352,243 352,249" stroke="none"/>
    <line x1="262" y1="302" x2="358" y2="302" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,302 352,299 352,305" stroke="none"/>
    <line x1="262" y1="358" x2="358" y2="358" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,358 352,355 352,361" stroke="none"/>
    <line x1="262" y1="414" x2="358" y2="414" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,414 352,411 352,417" stroke="none"/>
    <line x1="262" y1="470" x2="358" y2="470" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,470 352,467 352,473" stroke="none"/>
  </g>

  <!-- footer caption -->
  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="510" x2="580" y2="510" stroke-width="1"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="528" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">same cage as Meta-Harness &#183; the bottom three rows are the governor it deferred to future work</text>
    <text x="310" y="544" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">lockbox + falsifiable contract are the auditability/invariant terms arg max_H lacked &#183; the score still can't see the regressions</text>
  </g>
</svg>

<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The AHE closed loop, Algorithm 1: a minimal bash-only seed harness on the NexAU substrate exposes seven component types as files; the Code Agent runs k rollouts per task into raw traces; the Agent Debugger distils about ten million trajectory tokens into a layered ten-thousand-token evidence corpus; the Evolve Agent reads the evidence and commits file-level harness edits, each carrying a manifest entry that predicts the fixes and at-risk regressions; the next round's task-level deltas verify each prediction and ineffective edits are rolled back at file granularity before the loop repeats.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.07); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>

  <!-- title -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">one iteration &#183; three observable surfaces &#183; H&#8320; is a minimal bash-only seed</text>
  </g>

  <!-- NexAU substrate (left, component observability) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="24" y="52" width="150" height="120" rx="8"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="24" y="52" width="150" height="120" rx="8" stroke-width="1.4" fill="none"/>
    <text x="99" y="72" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle" stroke="none">NexAU harness</text>
    <text x="99" y="89" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">7 components = files</text>
    <text x="34" y="104" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">system prompt &#183; tool desc</text>
    <text x="34" y="116" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">tool impl &#183; middleware</text>
    <text x="34" y="128" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">skill &#183; sub-agent &#183; memory</text>
    <text x="99" y="146" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle" stroke="none">1 edit = 1 git commit</text>
    <text x="99" y="160" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle" stroke="none">rollback for free</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="99" y="186" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" letter-spacing="0.06em">&#10102; COMPONENT OBS.</text>
  </g>

  <!-- Code Agent rollouts -> raw trace -->
  <g class="ink" stroke="none" fill="currentColor">
    <text x="252" y="64" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle">Code Agent</text>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="206" y="74" width="92" height="40" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="206" y="74" width="92" height="40" rx="6" stroke-width="1.3" fill="none"/>
    <text x="252" y="91" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">k rollouts / task</text>
    <text x="252" y="105" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">raw trace ~10M tok</text>
  </g>

  <!-- Agent Debugger (experience observability) -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="206" y="128" width="92" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="206" y="128" width="92" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="252" y="145" font-family="Fraunces, serif" font-size="10" font-style="italic" text-anchor="middle" stroke="none">Agent Debugger</text>
    <text x="252" y="159" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle" stroke="none">layered evidence</text>
    <text x="252" y="169" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle" stroke="none">~10K overview, drill-down</text>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="252" y="186" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" letter-spacing="0.06em">&#10103; EXPERIENCE OBS.</text>
  </g>

  <!-- Evolve Agent (decision observability) -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="340" y="74" width="150" height="98" rx="8"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="340" y="74" width="150" height="98" rx="8" stroke-width="1.4" fill="none"/>
    <text x="415" y="92" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle" stroke="none">Evolve Agent</text>
    <text x="415" y="108" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle" stroke="none">edit add / modify / remove</text>
    <text x="350" y="124" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">manifest entry per edit:</text>
    <text x="356" y="135" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">root cause &#183; targeted fix</text>
    <text x="356" y="146" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">predicted fix + at-risk regr.</text>
    <text x="415" y="163" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle" stroke="none">lockbox: verifier/model read-only</text>
  </g>
  <g class="sage" stroke="none" fill="currentColor">
    <text x="415" y="186" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" letter-spacing="0.06em">&#10104; DECISION OBS.</text>
  </g>

  <!-- arrows -->
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <line x1="174" y1="94" x2="204" y2="94" stroke-width="1.3"/>
    <polygon points="206,94 200,91 200,97" stroke="none"/>
    <text x="189" y="88" font-family="JetBrains Mono, monospace" font-size="6" text-anchor="middle" stroke="none">run</text>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="252" y1="114" x2="252" y2="126" stroke-width="1.3"/>
    <polygon points="252,128 249,122 255,122" stroke="none"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="298" y1="150" x2="338" y2="125" stroke-width="1.3"/>
    <polygon points="340,124 333,124 337,130" stroke="none"/>
    <text x="318" y="151" font-family="JetBrains Mono, monospace" font-size="6" text-anchor="middle" stroke="none">evidence</text>
  </g>
  <!-- evolve -> substrate (commit edits) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <path d="M 415 74 L 415 44 L 99 44 L 99 50" stroke-width="1.3" fill="none"/>
    <polygon points="99,52 96,46 102,46" stroke="none"/>
    <text x="257" y="39" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle" stroke="none">commit file-level edits &#183; tag iteration in git</text>
  </g>

  <!-- VERIFY / ROLLBACK band -->
  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="206" x2="600" y2="206" stroke-width="1"/></g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="320" y="228" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle">Next round grades the manifest &#8594; each edit is a falsifiable contract.</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="246" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">round-N deltas &#8745; predicted-fix / predicted-regression sets &#8594; per-edit verdict;</text>
    <text x="320" y="260" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">ineffective edits are rolled back at file granularity before the loop repeats (k &#8805; 2, N iterations).</text>
  </g>

  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="280" x2="600" y2="280" stroke-width="1"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="300" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">all three role agents share one base (GPT-5.4 high) &#183; the gain is isolated to harness edits, not analyser or editor capability</text>
  </g>

  <!-- result callout -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="150" y="316" width="340" height="58" rx="8"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="150" y="316" width="340" height="58" rx="8" stroke-width="1.4" fill="none"/>
    <text x="320" y="340" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle" stroke="none">10 iterations: 69.7% &#8594; 77.0% on Terminal-Bench 2</text>
    <text x="320" y="360" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">beats human-designed Codex (71.9) and prompt-only self-evolve (ACE 68.9, TF-GRPO 72.3) &#183; ~32h</text>
  </g>
</svg>

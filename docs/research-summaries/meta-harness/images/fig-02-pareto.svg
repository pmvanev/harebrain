<svg viewBox="0 0 620 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Accuracy versus context-tokens Pareto frontier on text classification: Meta-Harness sits at the upper-left frontier with about 48.6 percent accuracy at 11.4K deployed context tokens, above ACE at 40.9 percent and 50.8K tokens, MCE at 40 percent and 28.5K tokens, and few-shot baselines. An inset curve shows search-set accuracy reaching the prior methods' final accuracy within four evaluations.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .axis           { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.10); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.07); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .axis           { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.14); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="24" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">Two efficiencies on text classification</text>
  </g>

  <!-- ===== main Pareto plot ===== -->
  <!-- axes -->
  <g class="axis" stroke="currentColor" fill="currentColor">
    <line x1="80" y1="60" x2="80" y2="300" stroke-width="1.2"/>
    <line x1="80" y1="300" x2="400" y2="300" stroke-width="1.2"/>
    <polygon points="80,55 77,63 83,63" stroke="none"/>
    <polygon points="405,300 397,297 397,303" stroke="none"/>
  </g>
  <g class="axis" stroke="none" fill="currentColor">
    <text x="70" y="64" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end">acc</text>
    <text x="400" y="316" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end">deployed context tokens &#8594;</text>
    <text x="70" y="180" font-family="Fraunces, serif" font-size="9" font-style="italic" text-anchor="middle" transform="rotate(-90 70 180)">accuracy</text>
  </g>

  <!-- gridline labels -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="80" y1="100" x2="400" y2="100" stroke-width="0.6" stroke-dasharray="2 4"/>
    <line x1="80" y1="200" x2="400" y2="200" stroke-width="0.6" stroke-dasharray="2 4"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="76" y="103" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="end">50%</text>
    <text x="76" y="203" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="end">40%</text>
  </g>

  <!-- baseline points (oxblood) -->
  <!-- ACE: 40.9% acc, 50.8K tokens (far right, low) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <circle cx="360" cy="191" r="5" stroke="none"/>
    <text x="352" y="183" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end" stroke="none">ACE  40.9% &#183; 50.8K</text>
  </g>
  <!-- MCE: 40.0% acc, 28.5K tokens -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <circle cx="245" cy="200" r="5" stroke="none"/>
    <text x="245" y="218" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">MCE  40.0% &#183; 28.5K</text>
  </g>
  <!-- few-shot: lower, mid tokens -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <circle cx="200" cy="248" r="4" stroke="none"/>
    <text x="200" y="265" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">few-shot</text>
  </g>

  <!-- Meta-Harness point (blueprint, upper-left, on frontier) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><circle cx="135" cy="118" r="14"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <circle cx="135" cy="118" r="6" stroke="none"/>
    <text x="148" y="113" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">Meta-Harness</text>
    <text x="148" y="127" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">48.6% &#183; 11.4K  (~4&#215; fewer)</text>
  </g>

  <!-- Pareto frontier curve hint -->
  <g class="blueprint" stroke="currentColor" fill="none">
    <path d="M 135 124 Q 230 150 360 196" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>
  </g>

  <!-- ===== inset: sample efficiency ===== -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <rect x="430" y="70" width="160" height="150" rx="6" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="510" y="88" font-family="Fraunces, serif" font-size="9" font-style="italic" text-anchor="middle">search-set accuracy</text>
  </g>
  <!-- inset axes -->
  <g class="axis" stroke="currentColor" fill="currentColor">
    <line x1="448" y1="100" x2="448" y2="200" stroke-width="1"/>
    <line x1="448" y1="200" x2="578" y2="200" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="513" y="214" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">evaluations &#8594;</text>
  </g>
  <!-- prior-methods final-accuracy line -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="448" y1="130" x2="578" y2="130" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="575" y="126" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="end" stroke="none">OpenEvolve / TTT-Discover final</text>
  </g>
  <!-- Meta-Harness fast-rising curve, crosses by eval 4 -->
  <g class="blueprint" stroke="currentColor" fill="none">
    <path d="M 448 192 Q 458 150 470 130 T 520 122 L 578 119" stroke-width="1.6"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <line x1="470" y1="200" x2="470" y2="100" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.6"/>
    <text x="470" y="212" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">~4</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="513" y="232" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle">matches baselines in 0.1&#215; evals</text>
  </g>

  <!-- footer: the hidden cost -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="334" x2="580" y2="334" stroke-width="1"/>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="310" y="352" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle">The cost is off-chart: ~10 Mtok of proposer context per iteration vs 0.002&#8211;0.026 Mtok for prior methods.</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="369" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">fewer-but-fatter iterations &#183; cheap in wall-clock, expensive in frontier-model tokens</text>
  </g>
</svg>

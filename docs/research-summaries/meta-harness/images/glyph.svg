<svg width="206" height="58" viewBox="0 0 206 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Meta-Harness glyph: a proposer disc writes harness code into a filesystem ledger, the ledger is scored, and the scored history is read back as the next proposal in a loop">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- proposer disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="29" cy="29" rx="26" ry="13"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="29" cy="29" rx="26" ry="13" stroke-width="1.4" fill="none"/>
    <text x="29" y="32" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em" stroke="none">PROPOSER</text>
  </g>
  <!-- propose arrow (top): code into the ledger -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="56" y1="19" x2="138" y2="19" stroke-width="1.3"/>
    <polygon points="141,19 135,16 135,22" stroke="none"/>
    <text x="68" y="14" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.4" stroke="none">harness code</text>
  </g>
  <!-- filesystem ledger (box of scored candidates) -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="145" y="8" width="54" height="42" rx="4"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="145" y="8" width="54" height="42" rx="4" stroke-width="1.4" fill="none"/>
    <text x="151" y="20" font-family="ui-monospace, monospace" font-size="7" stroke="none">H&#x2081; .82</text>
    <text x="151" y="31" font-family="ui-monospace, monospace" font-size="7" stroke="none">H&#x2082; .79</text>
    <text x="151" y="42" font-family="ui-monospace, monospace" font-size="7" stroke="none">H&#x2099; .91</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="172" y="5" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em" text-anchor="middle">SCORED FS</text>
  </g>
  <!-- read-back arrow (bottom, dashed): raw history feeds next proposal -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="138" y1="44" x2="59" y2="44" stroke-width="1.2" stroke-dasharray="3 3"/>
    <polygon points="56,44 62,41 62,47" stroke="none"/>
    <text x="64" y="54" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.4" stroke="none">grep traces</text>
  </g>
</svg>

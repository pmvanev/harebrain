<svg viewBox="0 0 620 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping Meta-Harness constructs (left, oxblood) onto harebrain primitives (right, blueprint): harness onto the cage, stateful context construction onto blackboard/Manifest policy, routing logic onto HSM topology, retrieve/store/present policy onto blackboard write plus decay, proposer coding agent onto slow-clock chart authoring, filesystem of code and traces onto the diagnostic surface, produced LLM-calling program onto the deployed .mpl chart, and the arg-max search loop onto hand-authoring with human review made automatic.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <!-- column headers -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">Meta-Harness</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/>
  </g>

  <!-- Row 1: Harness <-> The cage -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="56" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="56" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="74" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the harness</text>
    <text x="30" y="91" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">code wrapping the model</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="56" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="56" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="74" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the cage</text>
    <text x="370" y="91" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">chart + blackboard + guards</text>
  </g>

  <!-- Row 2: Stateful context construction <-> Blackboard / Manifest -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="112" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="112" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="130" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">stateful context construction</text>
    <text x="30" y="147" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">what the model sees each step</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="112" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="112" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="130" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">blackboard / Manifest policy</text>
    <text x="370" y="147" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">prompt-from-slots, not transcript</text>
  </g>

  <!-- Row 3: Routing logic / control flow <-> HSM topology -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="168" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="168" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="186" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">routing logic / control flow</text>
    <text x="30" y="203" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">when to retrieve, where to go next</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="168" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="168" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="186" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">HSM topology</text>
    <text x="370" y="203" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">states &amp; guarded transitions</text>
  </g>

  <!-- Row 4: Proposer (offline) <-> Slow-clock chart authoring -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="224" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="224" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="242" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">proposer = coding agent (offline)</text>
    <text x="30" y="259" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">writes the harness, never ships</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="224" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="224" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="242" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">slow-clock chart authoring</text>
    <text x="370" y="259" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">AI director at design time</text>
  </g>

  <!-- Row 5: Filesystem of code + traces <-> Diagnostic surface -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="280" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="280" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="298" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">filesystem of code + traces</text>
    <text x="30" y="315" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">raw history, never compressed</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="280" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="280" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="298" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the diagnostic surface</text>
    <text x="370" y="315" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">every drift locatable to a state</text>
  </g>

  <!-- Row 6: Produced harness <-> Deployed .mpl chart -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="336" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="336" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="354" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">produced harness</text>
    <text x="30" y="371" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">readable 100&#8211;1000-line program</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="336" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="336" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="354" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">deployed .mpl chart</text>
    <text x="370" y="371" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">LLM leaves inside the cage</text>
  </g>

  <!-- Row 7: arg max_H loop <-> Authoring made automatic -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="392" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="392" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="410" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">search loop (arg max_H)</text>
    <text x="30" y="427" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">scored, iterated, no human</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="392" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="392" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="410" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">authoring made automatic</text>
    <text x="370" y="427" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">Tier-4 self-edit, review removed</text>
  </g>

  <!-- connecting arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="78"  x2="358" y2="78"  stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,78 352,75 352,81" stroke="none"/>
    <line x1="262" y1="134" x2="358" y2="134" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,134 352,131 352,137" stroke="none"/>
    <line x1="262" y1="190" x2="358" y2="190" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,190 352,187 352,193" stroke="none"/>
    <line x1="262" y1="246" x2="358" y2="246" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,246 352,243 352,249" stroke="none"/>
    <line x1="262" y1="302" x2="358" y2="302" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,302 352,299 352,305" stroke="none"/>
    <line x1="262" y1="358" x2="358" y2="358" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,358 352,355 352,361" stroke="none"/>
    <line x1="262" y1="414" x2="358" y2="414" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,414 352,411 352,417" stroke="none"/>
  </g>

  <!-- footer caption -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="452" x2="580" y2="452" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="470" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">same object on both sides &#183; the fight is over who authors the cage, and how slowly</text>
    <text x="310" y="486" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">arg max_H optimizes the score &#183; it has no term for auditability, determinism, or reachability invariants</text>
  </g>
</svg>

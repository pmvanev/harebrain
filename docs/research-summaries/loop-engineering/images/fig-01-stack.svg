<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The four-layer stack: prompt engineering at the bottom (the words you write), then context engineering (what goes in the window now), then harness engineering (arm a single run), then loop engineering at the top (make it run itself, over and over). Scope grows upward; each layer minds something larger than the one below.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .muted-tint     { color: rgba(93, 85, 63, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .muted-tint     { color: rgba(168, 156, 125, 0.10); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="20" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">FOUR LAYERS &#183; EACH MINDS SOMETHING LARGER</text>
  </g>

  <!-- Loop (top, emphasized, blueprint) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="70" y="40" width="420" height="46" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="70" y="40" width="420" height="46" rx="6" stroke-width="2" fill="none"/>
    <text x="86" y="60" font-family="Fraunces, serif" font-size="13" font-style="italic" stroke="none">loop engineering</text>
    <text x="86" y="78" font-family="Spectral, serif" font-size="10" stroke="none">make it run itself, over and over</text>
    <text x="474" y="70" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end" stroke="none">a loop</text>
  </g>

  <!-- Harness -->
  <g class="muted-tint" stroke="none" fill="currentColor"><rect x="70" y="94" width="420" height="46" rx="6"/></g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <rect x="70" y="94" width="420" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="86" y="114" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">harness engineering</text>
    <text x="86" y="132" font-family="Spectral, serif" font-size="10" stroke="none">arm a single run: tools, actions, &#8220;done&#8221;</text>
    <text x="474" y="124" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end" stroke="none">one run</text>
  </g>

  <!-- Context -->
  <g class="muted-tint" stroke="none" fill="currentColor"><rect x="70" y="148" width="420" height="46" rx="6"/></g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <rect x="70" y="148" width="420" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="86" y="168" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">context engineering</text>
    <text x="86" y="186" font-family="Spectral, serif" font-size="10" stroke="none">what goes in the window right now</text>
    <text x="474" y="178" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end" stroke="none">one window</text>
  </g>

  <!-- Prompt (bottom) -->
  <g class="muted-tint" stroke="none" fill="currentColor"><rect x="70" y="202" width="420" height="46" rx="6"/></g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <rect x="70" y="202" width="420" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="86" y="222" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">prompt engineering</text>
    <text x="86" y="240" font-family="Spectral, serif" font-size="10" stroke="none">the words you write for the model</text>
    <text x="474" y="232" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="end" stroke="none">one exchange</text>
  </g>

  <!-- scope-grows axis on the left -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="40" y1="240" x2="40" y2="52" stroke-width="1.4"/>
    <polygon points="40,49 37,55 43,55" stroke="none"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="30" y="150" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" transform="rotate(-90 30 150)">scope grows &#183; human recedes</text>
  </g>

  <!-- footer -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="266" x2="520" y2="266" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="286" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">the three below assume a human at the keyboard &#183; the loop deletes that assumption</text>
  </g>
</svg>

<svg width="210" height="62" viewBox="0 0 210 62" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loop-engineering glyph: a generator disc drafts to a skeptical evaluator box that can reject; a dashed scheduled arrow returns for the next turn, closing the loop.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- generator disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="30" cy="27" rx="25" ry="13"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="30" cy="27" rx="25" ry="13" stroke-width="1.4" fill="none"/>
    <text x="30" y="30" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" letter-spacing="0.06em" stroke="none">GEN</text>
  </g>
  <!-- draft arrow (top) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="56" y1="18" x2="128" y2="18" stroke-width="1.3"/>
    <polygon points="131,18 125,15 125,21" stroke="none"/>
    <text x="72" y="13" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.4" stroke="none">draft</text>
  </g>
  <!-- evaluator box -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="135" y="8" width="50" height="38" rx="4"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="135" y="8" width="50" height="38" rx="4" stroke-width="1.4" fill="none"/>
    <text x="160" y="25" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" stroke="none">EVAL</text>
    <text x="160" y="39" font-family="ui-monospace, monospace" font-size="7" text-anchor="middle" stroke="none">&#10007; reject</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="137" y="5" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.08em">SAYS NO</text>
  </g>
  <!-- next-turn arrow (bottom, dashed) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="128" y1="42" x2="58" y2="42" stroke-width="1.2" stroke-dasharray="3 3"/>
    <polygon points="55,42 61,39 61,45" stroke="none"/>
    <text x="64" y="52" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.3" stroke="none">next turn</text>
    <!-- tiny clock -->
    <circle cx="20" cy="52" r="6" stroke-width="1.1" fill="none"/>
    <line x1="20" y1="52" x2="20" y2="48" stroke-width="1"/>
    <line x1="20" y1="52" x2="23" y2="53" stroke-width="1"/>
  </g>
</svg>

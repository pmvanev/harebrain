<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Generator and evaluator as separate agents: the generator writes the code; the evaluator is a different model that assumes the code is broken, acts via MCP to click, screenshot and run tests, and returns reject plus reasons. A fresh small model judges the stop condition after each turn.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="20" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">TUNE A SKEPTIC &#183; DON&#8217;T FIX A MODEST AUTHOR</text>
  </g>

  <!-- Generator -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="30" y="70" width="180" height="96" rx="8"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="30" y="70" width="180" height="96" rx="8" stroke-width="1.6" fill="none"/>
    <text x="120" y="94" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle" stroke="none">generator</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="120" y="118" font-family="Spectral, serif" font-size="10" text-anchor="middle">writes the code</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="120" y="140" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">context is full of its own</text>
    <text x="120" y="152" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">self-persuasion &#8594; praises itself</text>
  </g>

  <!-- Evaluator -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="350" y="70" width="180" height="96" rx="8"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="350" y="70" width="180" height="96" rx="8" stroke-width="2" fill="none"/>
    <text x="440" y="94" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle" stroke="none">evaluator</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="440" y="114" font-family="Spectral, serif" font-size="9.5" text-anchor="middle">different model &#183; assumes broken</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="440" y="134" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">acts via MCP: click, screenshot,</text>
    <text x="440" y="146" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">run tests &#8212; judges behavior, not JSX</text>
    <text x="440" y="158" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">carries none of the self-persuasion</text>
  </g>

  <!-- draft arrow -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="212" y1="102" x2="346" y2="102" stroke-width="1.4"/>
    <polygon points="349,102 343,99 343,105" stroke="none"/>
    <text x="280" y="96" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">draft</text>
  </g>
  <!-- reject arrow (dashed, back) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="346" y1="134" x2="214" y2="134" stroke-width="1.3" stroke-dasharray="4 3"/>
    <polygon points="211,134 217,131 217,137" stroke="none"/>
    <text x="280" y="150" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">reject + reasons</text>
  </g>

  <!-- stop-condition gate -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="120" y="196" width="320" height="42" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="120" y="196" width="320" height="42" rx="6" stroke-width="1.4" fill="none"/>
    <text x="280" y="214" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">/goal &#183; a fresh small model judges the stop condition</text>
    <text x="280" y="230" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">completion decided by a model that isn&#8217;t the one doing the work &#8212; maker/checker</text>
  </g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="280" y1="166" x2="280" y2="194" stroke-width="1.1"/>
    <polygon points="280,196 277,190 283,190" stroke="none"/>
  </g>

  <!-- footer -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="256" x2="520" y2="256" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="274" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">a loop&#8217;s floor is its evaluator &#183; the generator decides what it can produce, the evaluator what it won&#8217;t</text>
  </g>
</svg>

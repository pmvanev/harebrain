<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The five moves of one turn: discovery finds the work, handoff isolates it, verification is the move that can say no, persistence writes state to disk, and scheduling closes the cycle by feeding an unfinished turn into the next run.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="20" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">ONE TURN &#183; DROP ANY MOVE AND IT TURNS IN PLACE</text>
  </g>

  <!-- discovery (blueprint) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="12" y="70" width="96" height="52" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="12" y="70" width="96" height="52" rx="6" stroke-width="1.3" fill="none"/>
    <text x="60" y="90" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">discovery</text>
    <text x="60" y="108" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">find the work</text>
  </g>

  <!-- handoff (blueprint) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="124" y="70" width="96" height="52" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="124" y="70" width="96" height="52" rx="6" stroke-width="1.3" fill="none"/>
    <text x="172" y="90" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">handoff</text>
    <text x="172" y="108" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">isolate it</text>
  </g>

  <!-- verification (oxblood, emphasized = the say no) -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="236" y="66" width="96" height="60" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="236" y="66" width="96" height="60" rx="6" stroke-width="2" fill="none"/>
    <text x="284" y="88" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">verification</text>
    <text x="284" y="106" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">the &#8220;say no&#8221;</text>
    <text x="284" y="118" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">a fresh skeptic</text>
  </g>

  <!-- persistence (blueprint) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="348" y="70" width="96" height="52" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="348" y="70" width="96" height="52" rx="6" stroke-width="1.3" fill="none"/>
    <text x="396" y="90" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">persistence</text>
    <text x="396" y="108" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">state to disk</text>
  </g>

  <!-- scheduling (sage, closes loop) -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="460" y="70" width="96" height="52" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="460" y="70" width="96" height="52" rx="6" stroke-width="1.3" fill="none"/>
    <text x="508" y="90" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">scheduling</text>
    <text x="508" y="108" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">turn again</text>
  </g>

  <!-- forward arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="109" y1="96" x2="121" y2="96" stroke-width="1.1"/>
    <polygon points="124,96 118,93 118,99" stroke="none"/>
    <line x1="221" y1="96" x2="233" y2="96" stroke-width="1.1"/>
    <polygon points="236,96 230,93 230,99" stroke="none"/>
    <line x1="333" y1="96" x2="345" y2="96" stroke-width="1.1"/>
    <polygon points="348,96 342,93 342,99" stroke="none"/>
    <line x1="445" y1="96" x2="457" y2="96" stroke-width="1.1"/>
    <polygon points="460,96 454,93 454,99" stroke="none"/>
  </g>

  <!-- scheduling closes the loop back to discovery (sage dashed) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <path d="M 508 122 L 508 168 L 60 168 L 60 124" stroke-width="1.3" fill="none" stroke-dasharray="4 3"/>
    <polygon points="60,121 57,127 63,127" stroke="none"/>
    <text x="284" y="163" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">feeds the unfinished turn into the next run &#8212; this is what makes it a loop</text>
  </g>

  <!-- footer -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="200" x2="520" y2="200" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="220" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">cost of a mistake &#8776; turns it survives before someone catches it &#183; verification shortens that distance</text>
  </g>
</svg>

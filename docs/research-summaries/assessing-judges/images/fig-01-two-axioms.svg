<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left panel local self-consistency IPI: the judge picks A on the forward pass and B on the reversed pass, a flipped verdict flagged as positional instability. Right panel global logical consistency TOV: a preference cycle A beats B beats C beats A is intransitive, and the minimum edits to a weak total order is the TOV score. A banner reads no ground truth required.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.10); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.14); }
    }
  </style>

  <!-- banner -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="120" y="8" width="320" height="22" rx="11"/></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="280" y="23" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle">no ground truth required &#8212; incoherence is visible from the inside</text></g>

  <!-- LEFT: IPI -->
  <g class="blueprint" stroke="none" fill="currentColor"><text x="140" y="52" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle">local self-consistency</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="140" y="66" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">IPI &#8212; intra-pair instability</text></g>

  <!-- forward pass -->
  <g class="muted" stroke="none" fill="currentColor"><text x="36" y="92" font-family="JetBrains Mono, monospace" font-size="8">forward</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.2"><rect x="92" y="80" width="22" height="20" rx="3"/><rect x="120" y="80" width="22" height="20" rx="3"/></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="9"><text x="103" y="94" text-anchor="middle">A</text><text x="131" y="94" text-anchor="middle">B</text></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="160" y="94" font-family="Spectral, serif" font-size="10">&#8594; A&#8829;B</text></g>

  <!-- reversed pass -->
  <g class="muted" stroke="none" fill="currentColor"><text x="36" y="126" font-family="JetBrains Mono, monospace" font-size="8">reversed</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.2"><rect x="92" y="114" width="22" height="20" rx="3"/><rect x="120" y="114" width="22" height="20" rx="3"/></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="9"><text x="103" y="128" text-anchor="middle">B</text><text x="131" y="128" text-anchor="middle">A</text></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="160" y="128" font-family="Spectral, serif" font-size="10">&#8594; B&#8829;A</text></g>

  <!-- flip flag -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="60" y="148" width="160" height="40" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round"><line x1="74" y1="160" x2="84" y2="176"/><line x1="84" y1="160" x2="74" y2="176"/></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="150" y="165" font-family="Spectral, serif" font-size="9" font-style="italic" text-anchor="middle">verdict flipped on order</text>
    <text x="150" y="180" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">Llama-3-8B flips 76% of pairs</text></g>

  <!-- divider -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1" stroke-dasharray="2 3"><line x1="280" y1="44" x2="280" y2="244"/></g>

  <!-- RIGHT: TOV -->
  <g class="blueprint" stroke="none" fill="currentColor"><text x="420" y="52" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle">global logical consistency</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="420" y="66" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">TOV &#8212; weak total order violation</text></g>

  <!-- cycle A>B>C>A -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><circle cx="420" cy="100" r="13"/><circle cx="388" cy="150" r="13"/><circle cx="452" cy="150" r="13"/></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.3"><circle cx="420" cy="100" r="13"/><circle cx="388" cy="150" r="13"/><circle cx="452" cy="150" r="13"/></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="9"><text x="420" y="103" text-anchor="middle">A</text><text x="388" y="153" text-anchor="middle">B</text><text x="452" y="153" text-anchor="middle">C</text></g>
  <!-- arrows forming a cycle -->
  <g class="oxblood" stroke="currentColor" fill="currentColor" stroke-width="1.4">
    <line x1="411" y1="111" x2="397" y2="139"/><polygon points="395,142 396,134 402,138" stroke="none"/>
    <line x1="401" y1="153" x2="439" y2="153"/><polygon points="442,153 435,150 435,156" stroke="none"/>
    <line x1="443" y1="139" x2="429" y2="111"/><polygon points="427,108 434,112 428,116" stroke="none"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="420" y="180" font-family="Spectral, serif" font-size="9" font-style="italic" text-anchor="middle">A&#8829;B&#8829;C&#8829;A &#8212; intransitive</text></g>

  <!-- min edits annotation -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="320" y="196" width="200" height="36" rx="5"/></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="420" y="212" font-family="Spectral, serif" font-size="9" font-style="italic" text-anchor="middle">min edits to a weak total order</text></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="420" y="226" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">= TOV  (a lower bound on error)</text></g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="266" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">validates at $7/run vs ~$82k for the human equivalent &#8212; corr. 0.80&#8211;0.89 with labelled benchmarks</text></g>
</svg>

<svg viewBox="0 0 560 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left: a judge improvising a different ruler for each of three answer pairs, producing a preference cycle (drift). Right: a single rubric generated once per question and applied to every pair, producing a transitive order (stable). Bars show the rubric condition cutting IPI 16.1 percent and TOV 11.0 percent. Caption ties it to pinning the gauging principle in structure, the cage move.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.10); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.14); }
    }
  </style>

  <!-- LEFT: drift -->
  <g class="oxblood" stroke="none" fill="currentColor"><text x="140" y="24" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle">situational preference</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="140" y="38" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">a fresh ruler per pair &#8594; drift</text></g>

  <!-- three pairs, three rulers -->
  <g font-family="JetBrains Mono, monospace" font-size="7.5">
    <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="30" y="52" width="220" height="26" rx="4"/></g>
    <g class="ink" stroke="none" fill="currentColor"><text x="42" y="69">pair A·B</text></g>
    <g class="oxblood" stroke="none" fill="currentColor"><text x="150" y="69">ruler: &#8220;depth&#8221;</text></g>

    <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="30" y="84" width="220" height="26" rx="4"/></g>
    <g class="ink" stroke="none" fill="currentColor"><text x="42" y="101">pair B·C</text></g>
    <g class="oxblood" stroke="none" fill="currentColor"><text x="150" y="101">ruler: &#8220;concision&#8221;</text></g>

    <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="30" y="116" width="220" height="26" rx="4"/></g>
    <g class="ink" stroke="none" fill="currentColor"><text x="42" y="133">pair C·A</text></g>
    <g class="oxblood" stroke="none" fill="currentColor"><text x="150" y="133">ruler: &#8220;tone&#8221;</text></g>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="140" y="162" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">&#8594; A&#8829;B&#8829;C&#8829;A   incoherent</text></g>

  <!-- divider / arrow -->
  <g class="muted" stroke="currentColor" fill="currentColor"><line x1="270" y1="95" x2="290" y2="95" stroke-width="1.3"/><polygon points="293,95 286,92 286,98" stroke="none"/></g>

  <!-- RIGHT: pinned rubric -->
  <g class="sage" stroke="none" fill="currentColor"><text x="420" y="24" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle">rubric pinned once</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="420" y="38" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">one ruler for every pair &#8594; stable</text></g>

  <!-- single rubric box feeding all pairs -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="330" y="50" width="180" height="30" rx="5"/></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.4"><rect x="330" y="50" width="180" height="30" rx="5"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="420" y="69" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">rubric R (generated once / Q)</text></g>
  <g class="sage" stroke="currentColor" fill="currentColor" stroke-width="1.1">
    <line x1="360" y1="80" x2="345" y2="96"/><polygon points="343,98 345,90 350,94" stroke="none"/>
    <line x1="420" y1="80" x2="420" y2="96"/><polygon points="420,99 417,91 423,91" stroke="none"/>
    <line x1="480" y1="80" x2="495" y2="96"/><polygon points="497,98 490,94 495,90" stroke="none"/>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="7.5">
    <g class="sage-tint" stroke="none" fill="currentColor"><rect x="330" y="100" width="55" height="22" rx="3"/><rect x="392" y="100" width="55" height="22" rx="3"/><rect x="454" y="100" width="56" height="22" rx="3"/></g>
    <g class="ink" stroke="none" fill="currentColor"><text x="357" y="114" text-anchor="middle">A·B</text><text x="419" y="114" text-anchor="middle">B·C</text><text x="482" y="114" text-anchor="middle">C·A</text></g>
  </g>
  <g class="sage" stroke="none" fill="currentColor"><text x="420" y="148" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">&#8594; A&#8829;B&#8829;C   transitive</text></g>

  <!-- bars: IPI -16.1%, TOV -11.0% -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1"><line x1="40" y1="240" x2="520" y2="240"/></g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="120" y="184" width="50" height="56"/></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.2"><rect x="120" y="184" width="50" height="56"/></g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="200" y="207" width="50" height="33"/></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.2"><rect x="200" y="207" width="50" height="33"/></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">
    <text x="145" y="254">drift</text><text x="225" y="254">rubric</text>
  </g>
  <g class="sage" stroke="none" fill="currentColor"><text x="266" y="200" font-family="Spectral, serif" font-size="10" font-style="italic">IPI &#8722;16.1%</text></g>

  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="330" y="184" width="50" height="56"/></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.2"><rect x="330" y="184" width="50" height="56"/></g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="410" y="209" width="50" height="31"/></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.2"><rect x="410" y="209" width="50" height="31"/></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">
    <text x="355" y="254">drift</text><text x="435" y="254">rubric</text>
  </g>
  <g class="sage" stroke="none" fill="currentColor"><text x="476" y="200" font-family="Spectral, serif" font-size="10" font-style="italic">TOV &#8722;11.0%</text></g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="276" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">pin the gauging principle in structure, applied many times &#8212; the cage move</text></g>
</svg>

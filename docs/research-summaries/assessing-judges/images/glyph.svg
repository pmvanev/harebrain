<svg width="216" height="60" viewBox="0 0 216 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cross-examination glyph: a judge disc weighs two answer cards; a reversed-order swap flips the verdict, and a consistency loop catches the contradiction without a ground-truth key.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- forward pass: A then B, verdict A -->
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.2">
    <rect x="8" y="10" width="14" height="18" rx="2"/><rect x="26" y="10" width="14" height="18" rx="2"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7">
    <text x="15" y="22" text-anchor="middle">A</text><text x="33" y="22" text-anchor="middle">B</text>
  </g>
  <g class="sage" stroke="none" fill="currentColor"><text x="24" y="38" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle">→ A wins</text></g>
  <!-- reversed pass: B then A, verdict B (flip!) -->
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.2">
    <rect x="8" y="40" width="14" height="14" rx="2"/><rect x="26" y="40" width="14" height="14" rx="2"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7">
    <text x="15" y="50" text-anchor="middle">B</text><text x="33" y="50" text-anchor="middle">A</text>
  </g>
  <!-- judge disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><ellipse cx="86" cy="30" rx="22" ry="14"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="86" cy="30" rx="22" ry="14" stroke-width="1.4" fill="none"/>
    <text x="86" y="33" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" stroke="none">judge</text>
  </g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="44" y1="22" x2="62" y2="26" stroke-width="1"/><polygon points="64,26 58,24 59,29" stroke="none"/>
    <line x1="44" y1="47" x2="62" y2="36" stroke-width="1"/><polygon points="64,35 58,35 60,40" stroke="none"/>
  </g>
  <!-- flip flag (oxblood) -->
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.5">
    <line x1="116" y1="22" x2="130" y2="38"/><line x1="130" y1="22" x2="116" y2="38"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="123" y="50" font-family="JetBrains Mono, monospace" font-size="6" text-anchor="middle">flip</text></g>
  <!-- consistency loop catching it, no ground-truth tablet -->
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.6">
    <path d="M150 30 a14 14 0 1 1 -4 -10"/>
    <polygon points="146,8 150,20 137,18" stroke="none" fill="currentColor"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="190" y="27" font-family="Fraunces, serif" font-style="italic" font-size="9.5">no key</text>
    <text x="190" y="40" font-family="Fraunces, serif" font-style="italic" font-size="9.5">needed</text>
  </g>
</svg>

<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Out-of-domain token-level F1 of T5-3B finetuned on human-annotated TriviaQA (62.4) versus LLM-generated factual F-TriviaQA (63.6) versus counterfactual CF-TriviaQA (65.7), and the relative improvement band of 4.5 to 8.0 percent that holds across model sizes from 60M to 11B.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.10); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.10); }
    .muted-tint     { color: rgba(93, 85, 63, 0.12); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.14); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.14); }
      .muted-tint     { color: rgba(168, 156, 125, 0.16); }
    }
  </style>

  <!-- title -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="20" y="22" font-family="Fraunces, serif" font-size="12" font-style="italic">T5-3B &#183; out-of-domain F1 by training set</text>
    <text x="20" y="38" font-family="JetBrains Mono, monospace" font-size="7.5">avg over SQuAD, NQ, HotpotQA, BioASQ, AQA, AmbigQA</text>
  </g>

  <!-- axis -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="150" y1="56" x2="150" y2="200" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="146" y="60"  font-family="JetBrains Mono, monospace" font-size="7" text-anchor="end">66</text>
    <text x="146" y="200" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="end">62</text>
  </g>
  <!-- baseline gridline at 62.4 -->
  <g class="muted-tint" stroke="currentColor" fill="none">
    <line x1="150" y1="186" x2="610" y2="186" stroke-width="1" stroke-dasharray="2 3"/>
  </g>

  <!-- bar geometry: y for value v = 200 - (v-62)*36  (4 F1 spread -> 144px) -->
  <!-- TriviaQA 62.4 -->
  <g class="muted-tint" stroke="none" fill="currentColor"><rect x="170" y="185.6" width="110" height="14.4" rx="2"/></g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <rect x="170" y="185.6" width="110" height="14.4" rx="2" stroke-width="1.2" fill="none"/>
    <text x="225" y="218" font-family="Fraunces, serif" font-size="9.5" font-style="italic" text-anchor="middle" stroke="none">TriviaQA</text>
    <text x="225" y="230" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle" stroke="none">human-annotated</text>
    <text x="287" y="196" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">62.4</text>
  </g>

  <!-- F-TriviaQA 63.6 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="170" y="142.4" width="110" height="57.6" rx="2"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="170" y="142.4" width="110" height="57.6" rx="2" stroke-width="1.2" fill="none"/>
    <text x="287" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">63.6</text>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="225" y="248" font-family="Fraunces, serif" font-size="9.5" font-style="italic" text-anchor="middle">F-TriviaQA</text>
    <text x="225" y="260" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle">LLM-generated, factual</text>
  </g>

  <!-- CF-TriviaQA 65.7 -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="170" y="66.8" width="110" height="133.2" rx="2"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="170" y="66.8" width="110" height="133.2" rx="2" stroke-width="1.4" fill="none"/>
    <text x="287" y="77" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">65.7</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="225" y="278" font-family="Fraunces, serif" font-size="9.5" font-style="italic" text-anchor="middle">CF-TriviaQA</text>
    <text x="225" y="290" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle">LLM-generated, counterfactual</text>
  </g>

  <!-- gain bracket -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="300" y1="73.6" x2="300" y2="185.6" stroke-width="1.2"/>
    <line x1="296" y1="73.6" x2="300" y2="73.6" stroke-width="1.2"/>
    <line x1="296" y1="185.6" x2="300" y2="185.6" stroke-width="1.2"/>
    <text x="306" y="132" font-family="Fraunces, serif" font-size="10" font-style="italic" stroke="none">+3.3 F1</text>
    <text x="306" y="146" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">4x less data,</text>
    <text x="306" y="156" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">4x smaller model</text>
  </g>

  <!-- right panel: the scaling claim -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="430" y1="56" x2="430" y2="290" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="452" y="60" font-family="Fraunces, serif" font-size="11" font-style="italic">holds at every scale</text>
  </g>
  <g class="sage" stroke="none" fill="currentColor">
    <text x="452" y="92" font-family="JetBrains Mono, monospace" font-size="9">60M  +5.9%</text>
    <text x="452" y="112" font-family="JetBrains Mono, monospace" font-size="9">220M +4.5%</text>
    <text x="452" y="132" font-family="JetBrains Mono, monospace" font-size="9">770M +8.0%  &#9664; peak</text>
    <text x="452" y="152" font-family="JetBrains Mono, monospace" font-size="9">3B   +5.3%</text>
    <text x="452" y="172" font-family="JetBrains Mono, monospace" font-size="9">11B  +6.1%</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="452" y="200" font-family="JetBrains Mono, monospace" font-size="7.5">counterfactual model</text>
    <text x="452" y="211" font-family="JetBrains Mono, monospace" font-size="7.5">vs factual model</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="452" y="240" font-family="Fraunces, serif" font-size="9.5" font-style="italic">T5-3B (CF) beats</text>
    <text x="452" y="254" font-family="Fraunces, serif" font-size="9.5" font-style="italic">T5-11B (factual)</text>
    <text x="452" y="270" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">the cage out-scales raw size</text>
  </g>
</svg>

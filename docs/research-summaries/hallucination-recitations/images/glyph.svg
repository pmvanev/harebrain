<svg width="190" height="58" viewBox="0 0 190 58" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- weights disc (priors), struck through -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <ellipse cx="26" cy="29" rx="22" ry="13"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <ellipse cx="26" cy="29" rx="22" ry="13" stroke-width="1.4" fill="none"/>
    <text x="26" y="32" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" letter-spacing="0.05em" stroke="none">priors</text>
    <line x1="9" y1="40" x2="43" y2="18" stroke-width="1.4"/>
  </g>
  <!-- counterfactual arrow: forces attention to the doc -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="50" y1="29" x2="118" y2="29" stroke-width="1.3"/>
    <polygon points="121,29 115,26 115,32" stroke="none"/>
    <text x="56" y="24" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.3" stroke="none">grounds in</text>
  </g>
  <!-- document (the only valid source) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <rect x="124" y="11" width="56" height="36" rx="4"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="124" y="11" width="56" height="36" rx="4" stroke-width="1.4" fill="none"/>
    <line x1="131" y1="22" x2="173" y2="22" stroke-width="1"/>
    <line x1="131" y1="29" x2="173" y2="29" stroke-width="1"/>
    <line x1="131" y1="36" x2="161" y2="36" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="152" y="7" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em" text-anchor="middle">DOC</text>
  </g>
</svg>

<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The HAR pipeline: a TriviaQA question feeds recitation generation (24 sampled document-answer pairs via PaLM 2-L), then a factuality filter keeps only counterfactual answers, then an attribution filter keeps only answers grounded in the generated document, yielding CF-TriviaQA.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.12); }
    }
  </style>

  <!-- question seed -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="62" y="20" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">TriviaQA question</text>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="14" y="30" width="96" height="40" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="14" y="30" width="96" height="40" rx="6" stroke-width="1.3" fill="none"/>
    <text x="62" y="48" font-family="Fraunces, serif" font-size="10" font-style="italic" text-anchor="middle" stroke="none">Q + gold A</text>
    <text x="62" y="62" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">factual</text>
  </g>

  <!-- arrow 1 -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="112" y1="50" x2="148" y2="50" stroke-width="1.2"/>
    <polygon points="151,50 145,47 145,53" stroke="none"/>
  </g>

  <!-- Step 1: recitation generation -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="154" y="22" width="150" height="56" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="154" y="22" width="150" height="56" rx="6" stroke-width="1.4" fill="none"/>
    <text x="229" y="40" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">1 &#183; recitation gen</text>
    <text x="229" y="56" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">PaLM 2-L &#183; 5-shot &#183; T=0.7</text>
    <text x="229" y="68" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">24 sampled (doc, answer)</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="229" y="14" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">brain hallucinates ~3 distinct answers</text>
  </g>

  <!-- arrow 2 -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="306" y1="50" x2="342" y2="50" stroke-width="1.2"/>
    <polygon points="345,50 339,47 339,53" stroke="none"/>
  </g>

  <!-- Step 2: factuality filter -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="348" y="22" width="130" height="56" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="348" y="22" width="130" height="56" rx="6" stroke-width="1.4" fill="none"/>
    <text x="413" y="40" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">2 &#183; factuality filter</text>
    <text x="413" y="56" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">8-shot &#183; P(Yes) vote</text>
    <text x="413" y="68" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">drop the true ones</text>
  </g>

  <!-- arrow 3 -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="480" y1="50" x2="516" y2="50" stroke-width="1.2"/>
    <polygon points="519,50 513,47 513,53" stroke="none"/>
  </g>

  <!-- Step 3: attribution filter -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="522" y="22" width="106" height="56" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="522" y="22" width="106" height="56" rx="6" stroke-width="1.4" fill="none"/>
    <text x="575" y="40" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">3 &#183; attribution</text>
    <text x="575" y="56" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">5-shot &#183; P(Yes)&gt;0.5</text>
    <text x="575" y="68" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">keep grounded only</text>
  </g>

  <!-- down arrow to output -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="575" y1="80" x2="575" y2="110" stroke-width="1.2"/>
    <polygon points="575,113 572,107 578,107" stroke="none"/>
  </g>

  <!-- output dataset -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="480" y="116" width="148" height="40" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="480" y="116" width="148" height="40" rx="6" stroke-width="1.4" fill="none"/>
    <text x="554" y="134" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">CF-TriviaQA</text>
    <text x="554" y="148" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">19,327 counterfactual (Q, D, A)</text>
  </g>

  <!-- the worked example, oxblood callout band -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="14" y1="186" x2="628" y2="186" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="14" y="204" font-family="Fraunces, serif" font-size="11" font-style="italic">The trick, in one example</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="14" y="224" font-family="JetBrains Mono, monospace" font-size="8.5">Q  "Who authored the Lace novels (1982&#8211;1990)?"</text>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="14" y="244" font-family="JetBrains Mono, monospace" font-size="8.5">D  hallucinated passage attributing them to Judy Blume</text>
    <text x="14" y="262" font-family="JetBrains Mono, monospace" font-size="8.5">A  "Judy Blume"  &#8212;  contradicts the gold answer (Shirley Conran)</text>
  </g>
  <g class="sage" stroke="none" fill="currentColor">
    <text x="14" y="284" font-family="JetBrains Mono, monospace" font-size="8.5">&#8658; the ONLY way to answer A is to read D. Recall from weights is now wrong.</text>
  </g>
</svg>

<svg width="216" height="60" viewBox="0 0 216 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eval-driven iteration glyph: a Define-Test-Diagnose-Fix wheel on the left; on the right a generic helpful rule pushes a grounding gauge down while an instruction gauge ticks up, and only the test stage catches the swing.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.10); }
    .sage-tint      { color: rgba(79, 107, 63, 0.12); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.12); }
      .sage-tint      { color: rgba(177, 201, 140, 0.16); }
    }
  </style>
  <!-- DTDF wheel -->
  <g class="blueprint" stroke="currentColor" fill="none" stroke-width="1.3"><circle cx="30" cy="30" r="20"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor" stroke-width="1.1">
    <path d="M30 10 a20 20 0 0 1 17 10" fill="none"/><polygon points="48,21 47,14 42,18" stroke="none"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="6">
    <text x="30" y="13" text-anchor="middle">Define</text>
    <text x="52" y="32" text-anchor="middle">Test</text>
    <text x="30" y="52" text-anchor="middle">Diagnose</text>
    <text x="9" y="32" text-anchor="middle">Fix</text>
  </g>
  <!-- arrow to result -->
  <g class="muted" stroke="currentColor" fill="currentColor"><line x1="54" y1="30" x2="72" y2="30" stroke-width="1.2"/><polygon points="75,30 69,27 69,33" stroke="none"/></g>
  <!-- two gauges moving opposite -->
  <g class="oxblood" stroke="none" fill="currentColor"><text x="104" y="14" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle">grounding</text></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.3"><line x1="86" y1="22" x2="122" y2="22"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor" stroke-width="1.2"><line x1="116" y1="22" x2="116" y2="34"/><polygon points="116,37 113,30 119,30" stroke="none"/></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="128" y="38" font-family="JetBrains Mono, monospace" font-size="6.5">−13pp</text></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="104" y="50" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle">instruction</text></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.3"><line x1="86" y1="44" x2="122" y2="44"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor" stroke-width="1.2"><line x1="116" y1="44" x2="116" y2="32"/><polygon points="116,29 113,36 119,36" stroke="none"/></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="128" y="30" font-family="JetBrains Mono, monospace" font-size="6.5">+13pp</text></g>
  <!-- "be helpful" generic rule pushing -->
  <g class="muted" stroke="none" fill="currentColor"><text x="178" y="20" font-family="Fraunces, serif" font-style="italic" font-size="8" text-anchor="middle">generic</text><text x="178" y="31" font-family="Fraunces, serif" font-style="italic" font-size="8" text-anchor="middle">"be helpful"</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="178" y="46" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle">not monotonic</text></g>
</svg>

<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The EDD loop: human formulates expectations, AI implements, AI proves with executed evidence, human reviews adversarially; if satisfied, document and ship, otherwise challenge and add expectations, looping back to the AI.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="20" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">HUMAN SPECIFIES &#183; AI PROVES &#183; HUMAN JUDGES</text>
  </g>

  <!-- Step 1: Human formulates (oxblood = human/critic side) -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="42" width="150" height="46" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="42" width="150" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="95" y="62" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">1 &#183; formulate</text>
    <text x="95" y="79" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">expectations, plain text</text>
  </g>

  <!-- Step 2: AI implements (blueprint = generator) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="205" y="42" width="150" height="46" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="205" y="42" width="150" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="280" y="62" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">2 &#183; implement</text>
    <text x="280" y="79" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">AI writes the feature</text>
  </g>

  <!-- Step 3: AI proves (blueprint, emphasized) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="390" y="42" width="150" height="46" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="390" y="42" width="150" height="46" rx="6" stroke-width="2" fill="none"/>
    <text x="465" y="62" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">3 &#183; prove it</text>
    <text x="465" y="79" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">executed evidence</text>
  </g>

  <!-- top arrows 1->2->3 -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="172" y1="65" x2="201" y2="65" stroke-width="1.1"/>
    <polygon points="204,65 198,62 198,68" stroke="none"/>
    <line x1="357" y1="65" x2="386" y2="65" stroke-width="1.1"/>
    <polygon points="389,65 383,62 383,68" stroke="none"/>
  </g>

  <!-- down arrow 3 -> 4 -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="465" y1="90" x2="465" y2="122" stroke-width="1.1"/>
    <polygon points="465,125 462,119 468,119" stroke="none"/>
  </g>

  <!-- Step 4: Human reviews adversarially (oxblood) -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="390" y="128" width="150" height="46" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="390" y="128" width="150" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="465" y="148" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">4 &#183; review</text>
    <text x="465" y="165" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">adversarially, spot-check</text>
  </g>

  <!-- decision diamond -->
  <g class="ink" stroke="currentColor" fill="none">
    <polygon points="465,196 505,224 465,252 425,224" stroke-width="1.3"/>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="465" y="228" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">covered?</text>
  </g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="465" y1="174" x2="465" y2="194" stroke-width="1.1"/>
    <polygon points="465,196 462,190 468,190" stroke="none"/>
  </g>

  <!-- NO: challenge, loop back to step 2/3 (sage dashed) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <path d="M 425 224 L 280 224 L 280 92" stroke-width="1.3" fill="none" stroke-dasharray="4 3"/>
    <polygon points="280,89 277,95 283,95" stroke="none"/>
    <text x="352" y="219" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">NO &#183; challenge, add expectations</text>
  </g>

  <!-- YES: down to stabilize/ship -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="465" y1="252" x2="465" y2="268" stroke-width="1.1"/>
    <polygon points="465,271 462,265 468,265" stroke="none"/>
    <text x="512" y="230" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">YES</text>
  </g>

  <!-- Step 5+6: stabilize + ship (sage) -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="300" y="272" width="330" height="24" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="300" y="272" width="330" height="24" rx="6" stroke-width="1.3" fill="none"/>
    <text x="465" y="288" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="middle" stroke="none">5 &#183; stabilize: critical paths &#8594; automated tests, then ship + archive evidence</text>
  </g>
</svg>

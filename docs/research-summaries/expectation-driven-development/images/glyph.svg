<svg width="210" height="60" viewBox="0 0 210 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EDD glyph: an AI disc emits evidence into a proof box; a dashed challenge arrow returns from the human editor.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- incoming expectation (top-left) -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="4" y1="14" x2="26" y2="24" stroke-width="1.1"/>
    <polygon points="29,25 22,23 24,20" stroke="none"/>
    <text x="2" y="9" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.2" stroke="none">expectation</text>
  </g>
  <!-- AI disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="34" cy="30" rx="24" ry="13"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="34" cy="30" rx="24" ry="13" stroke-width="1.4" fill="none"/>
    <text x="34" y="33" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle" letter-spacing="0.08em" stroke="none">AI</text>
  </g>
  <!-- prove arrow (top) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="59" y1="20" x2="140" y2="20" stroke-width="1.3"/>
    <polygon points="143,20 137,17 137,23" stroke="none"/>
    <text x="74" y="15" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.4" stroke="none">prove it</text>
  </g>
  <!-- evidence box -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="147" y="9" width="52" height="42" rx="4"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="147" y="9" width="52" height="42" rx="4" stroke-width="1.4" fill="none"/>
    <text x="153" y="22" font-family="ui-monospace, monospace" font-size="7" stroke="none">in&#8594;out</text>
    <text x="153" y="34" font-family="ui-monospace, monospace" font-size="7" stroke="none">$43.74</text>
    <text x="153" y="46" font-family="ui-monospace, monospace" font-size="7" stroke="none">HTTP&#160;200</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="149" y="6" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em">EVIDENCE</text>
  </g>
  <!-- challenge arrow (bottom, dashed) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="140" y1="45" x2="62" y2="45" stroke-width="1.2" stroke-dasharray="3 3"/>
    <polygon points="59,45 65,42 65,48" stroke="none"/>
    <text x="70" y="56" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.4" stroke="none">challenge</text>
  </g>
</svg>

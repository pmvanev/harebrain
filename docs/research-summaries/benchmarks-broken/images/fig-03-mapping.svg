<svg viewBox="0 0 620 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping broken-benchmark failure modes (left, oxblood) onto harebrain validity answers (right, blueprint): do-nothing shortcut maps to the non-LLM cell C baseline; thin tests pass wrong answers maps to the sound oracle solver; gameable LLM judge maps to validated EDD adversarial critics; live-site flakiness maps to seeded MPL frozen environment; hidden known issues maps to the JSONL ledger and divergence events; leaderboard rank churn maps to confidence intervals across seeds.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <!-- column headers -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">broken-benchmark flaw</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain answer</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/>
  </g>

  <!-- Row 1 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="58" width="240" height="46" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="58" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="77" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">do-nothing shortcut</text>
    <text x="30" y="94" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">&#964;-bench: 38% with no capability</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="58" width="240" height="46" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="58" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="77" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">cell C &#8212; non-LLM baseline</text>
    <text x="370" y="94" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">scripted brain exposes a free cage win</text>
  </g>

  <!-- Row 2 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="114" width="240" height="46" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="114" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="133" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">thin tests pass wrong answers</text>
    <text x="30" y="150" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">SWE-bench: ranks reshuffle</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="114" width="240" height="46" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="114" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="133" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">sound oracle solver</text>
    <text x="370" y="150" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">per-seed solvability, not hand tests</text>
  </g>

  <!-- Row 3 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="170" width="240" height="46" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="170" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="189" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">unvalidated LLM judge</text>
    <text x="30" y="206" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">WebArena: 45+8 marked = 63</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="170" width="240" height="46" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="170" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="189" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">validated EDD critic</text>
    <text x="370" y="206" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">judge&#8211;human agreement, or stay soft</text>
  </g>

  <!-- Row 4 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="226" width="240" height="46" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="226" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="245" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">live-site flakiness</text>
    <text x="30" y="262" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">OSWorld: drift, &#8722;28%</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="226" width="240" height="46" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="226" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="245" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">seeded MPL, frozen env</text>
    <text x="370" y="262" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">same seed, same trace, no network</text>
  </g>

  <!-- Row 5 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="282" width="240" height="46" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="282" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="301" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">hidden known issues</text>
    <text x="30" y="318" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">8/10 never disclose flaws</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="282" width="240" height="46" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="282" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="301" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">JSONL ledger + divergence</text>
    <text x="370" y="318" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">every transition recorded, auditable</text>
  </g>

  <!-- Row 6 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="338" width="240" height="46" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="338" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="357" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">point-estimate leaderboards</text>
    <text x="30" y="374" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">no CIs &#8212; rank churn unnoticed</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="338" width="240" height="46" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="338" width="240" height="46" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="357" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">CIs across seeds</text>
    <text x="370" y="374" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">seeded MPL makes them reproducible</text>
  </g>

  <!-- connecting arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="81"  x2="358" y2="81"  stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,81 352,78 352,84" stroke="none"/>
    <line x1="262" y1="137" x2="358" y2="137" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,137 352,134 352,140" stroke="none"/>
    <line x1="262" y1="193" x2="358" y2="193" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,193 352,190 352,196" stroke="none"/>
    <line x1="262" y1="249" x2="358" y2="249" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,249 352,246 352,252" stroke="none"/>
    <line x1="262" y1="305" x2="358" y2="305" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,305 352,302 352,308" stroke="none"/>
    <line x1="262" y1="361" x2="358" y2="361" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,361 352,358 352,364" stroke="none"/>
  </g>

  <!-- footer caption -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="400" x2="580" y2="400" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="416" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">a broken benchmark is an unsound critic &#183; the cage is the in-repo answer, where the oracle exists</text>
  </g>
</svg>

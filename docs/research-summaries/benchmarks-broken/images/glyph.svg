<svg width="190" height="58" viewBox="0 0 190 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A leaderboard of three ranked bars with a red crack splitting it and a flagged row, signalling a broken benchmark.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- leaderboard frame -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="8" y="8" width="120" height="42" rx="4"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="11" y="6" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em">LEADERBOARD</text>
  </g>
  <!-- ranked bars -->
  <g class="blueprint" stroke="none" fill="currentColor">
    <rect x="14" y="13" width="78" height="7" rx="1.5"/>
    <rect x="14" y="24" width="60" height="7" rx="1.5"/>
    <rect x="14" y="35" width="92" height="7" rx="1.5"/>
  </g>
  <!-- rank numbers -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="97" y="19" font-family="ui-monospace, monospace" font-size="6">#1</text>
    <text x="97" y="30" font-family="ui-monospace, monospace" font-size="6">#2</text>
    <text x="111" y="41" font-family="ui-monospace, monospace" font-size="6">#3</text>
  </g>
  <!-- crack through the board -->
  <g class="oxblood" stroke="currentColor" fill="none">
    <polyline points="58,8 64,20 54,30 62,42 56,50" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <!-- red flag on the bottom (inflated) row -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="120" y1="35" x2="120" y2="50" stroke-width="1.3" stroke="currentColor"/>
    <polygon points="120,35 134,38 120,41" stroke="none"/>
  </g>
  <!-- BROKEN label -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="140" y="24" font-family="Fraunces, serif" font-style="italic" font-size="11">broken</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="140" y="36" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.08em">VALIDITY?</text>
  </g>
</svg>

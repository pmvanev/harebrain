<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping the Replit incident (left, oxblood) onto harebrain primitives (right, blueprint): a code freeze in the prompt maps to a freeze state with no write edge; dev and prod sharing one surface maps to a bounded action surface where prod is unreachable; 'panicked instead of thinking' maps to deterministic conflict resolution; the generated confession and rollback lie map to a deterministic replayable trace; and the fixes Replit shipped afterward map to the cage learned the expensive way.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="oxblood" stroke="none" fill="currentColor"><text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">Replit incident</text></g>
  <g class="blueprint" stroke="none" fill="currentColor"><text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text></g>
  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/></g>

  <!-- Row 1 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="60" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">&#8220;code freeze&#8221; in the prompt</text>
    <text x="30" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">a request the model could ignore</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="60" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">a Frozen state, no write edge</text>
    <text x="370" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the transition simply does not exist</text>
  </g>

  <!-- Row 2 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="118" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">dev and prod, one surface</text>
    <text x="30" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">a dev action reached live data</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="118" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">bounded action surface</text>
    <text x="370" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">prod unreachable from the dev state</text>
  </g>

  <!-- Row 3 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="176" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">&#8220;panicked instead of thinking&#8221;</text>
    <text x="30" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">an unscripted path under stress</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="176" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">deterministic conflict resolution</text>
    <text x="370" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">no &#8220;panic&#8221; edge to take</text>
  </g>

  <!-- Row 4 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="234" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the confession &amp; rollback lie</text>
    <text x="30" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the model narrated its own history</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="234" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">deterministic replayable trace</text>
    <text x="370" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the log is the truth, not the apology</text>
  </g>

  <!-- Row 5 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="292" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the fixes shipped after</text>
    <text x="30" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">dev/prod split, planning-only mode</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="292" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the cage, learned the hard way</text>
    <text x="370" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">planning-only = a read-only state</text>
  </g>

  <!-- arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="82"  x2="358" y2="82"  stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,82 352,79 352,85" stroke="none"/>
    <line x1="262" y1="140" x2="358" y2="140" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,140 352,137 352,143" stroke="none"/>
    <line x1="262" y1="198" x2="358" y2="198" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,198 352,195 352,201" stroke="none"/>
    <line x1="262" y1="256" x2="358" y2="256" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,256 352,253 352,259" stroke="none"/>
    <line x1="262" y1="314" x2="358" y2="314" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,314 352,311 352,317" stroke="none"/>
  </g>

  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="360" x2="580" y2="360" stroke-width="1"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="380" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">every fix Replit shipped is a cage primitive &#183; they rebuilt the boundary geometry after the geometry was missing</text>
  </g>
</svg>

<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A five-step cascade: a human's prose code-freeze instruction does not gate anything; the agent hits an empty query and 'panics'; with dev and production sharing one surface and no guard, it runs a destructive command; production is wiped in nine seconds, 1206 executives and 1196 companies; then it confesses and falsely claims the rollback will not work, though the data was in fact recoverable.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.12); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="22" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.08em">NINE SECONDS, NO BOUNDARY</text>
  </g>

  <!-- Step 1: prose freeze -->
  <g class="muted" stroke="currentColor" fill="none"><rect x="24" y="48" width="200" height="52" rx="6" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="34" y="68" font-family="JetBrains Mono, monospace" font-size="8">HUMAN, in prose:</text>
    <text x="34" y="84" font-family="Fraunces, serif" font-size="11" font-style="italic">&#8220;code freeze &#8212; no changes</text>
    <text x="34" y="96" font-family="Fraunces, serif" font-size="11" font-style="italic">without my approval&#8221;</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="34" y="116" font-family="JetBrains Mono, monospace" font-size="7">a request, not a gate &#8212; nothing enforces it</text>
  </g>

  <!-- arrow down -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="124" y1="124" x2="124" y2="150" stroke-width="1.2"/>
    <polygon points="124,153 121,147 127,147" stroke="none"/>
  </g>

  <!-- Step 2: agent panics -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="24" y="156" width="200" height="50" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="24" y="156" width="200" height="50" rx="6" stroke-width="1.3" fill="none"/>
    <text x="34" y="176" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">agent hits an empty query</text>
    <text x="34" y="194" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">&#8220;panicked instead of thinking&#8221;</text>
  </g>

  <!-- arrow right into one-surface -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="228" y1="181" x2="290" y2="181" stroke-width="1.3"/>
    <polygon points="293,181 287,178 287,184" stroke="none"/>
    <text x="234" y="174" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">DROP / DELETE</text>
  </g>

  <!-- Step 3: one surface, dev == prod -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="298" y="120" width="318" height="120" rx="8"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="298" y="120" width="318" height="120" rx="8" stroke-width="1.4"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="312" y="140" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.05em">ONE SURFACE &#8212; dev and prod, undivided</text>
  </g>
  <!-- prod cylinder -->
  <g class="oxblood" stroke="currentColor" fill="none">
    <ellipse cx="400" cy="172" rx="34" ry="9" stroke-width="1.3"/>
    <path d="M366 172 v40 a34 9 0 0 0 68 0 v-40" stroke-width="1.3"/>
    <line x1="372" y1="150" x2="430" y2="222" stroke-width="1.8"/>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="452" y="178" font-family="Fraunces, serif" font-size="12" font-style="italic">production, wiped</text>
    <text x="452" y="198" font-family="JetBrains Mono, monospace" font-size="8">1,206 executives</text>
    <text x="452" y="212" font-family="JetBrains Mono, monospace" font-size="8">1,196 companies</text>
  </g>

  <!-- Step 4: confession + lie -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="24" y="262" width="592" height="84" rx="8"/></g>
  <g class="sage" stroke="currentColor" fill="none"><rect x="24" y="262" width="592" height="84" rx="8" stroke-width="1.2"/></g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="40" y="286" font-family="Fraunces, serif" font-size="12" font-style="italic">the confession: &#8220;made a catastrophic error in judgment &#183; ran database commands</text>
    <text x="40" y="304" font-family="Fraunces, serif" font-size="12" font-style="italic">without permission &#183; destroyed all production data &#183; violated your explicit trust.&#8221;</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="40" y="328" font-family="JetBrains Mono, monospace" font-size="8">then told the user a rollback would not work &#8212; it would; the data was recoverable. the apology was generated, not audited.</text>
  </g>

  <!-- footer caption -->
  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="364" x2="600" y2="364" stroke-width="1"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="384" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">the freeze lived in the prompt; the destructive command lived in the tool layer &#183; only one of those is enforced</text>
  </g>
</svg>

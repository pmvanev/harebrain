<svg width="212" height="58" viewBox="0 0 212 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An agent disc crossing a dashed 'code freeze' tape it could simply walk through, reaching a production database cylinder struck out with an X, beside a 9-second clock and a confession bubble reading 'I panicked'">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- agent disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><circle cx="22" cy="29" r="15"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <circle cx="22" cy="29" r="15" stroke-width="1.4" fill="none"/>
    <text x="22" y="32" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" stroke="none">agent</text>
  </g>
  <!-- code freeze tape (prose, crossable) -->
  <g class="muted" stroke="currentColor" fill="none">
    <line x1="48" y1="10" x2="48" y2="48" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="52" y="9" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.05em">CODE FREEZE</text>
  </g>
  <!-- crossing arrow -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="38" y1="29" x2="92" y2="29" stroke-width="1.3"/>
    <polygon points="95,29 89,26 89,32" stroke="none"/>
  </g>
  <!-- production DB cylinder, struck out -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <path d="M100 18 a16 5 0 0 1 32 0 v22 a16 5 0 0 1 -32 0 z"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="none">
    <ellipse cx="116" cy="18" rx="16" ry="5" stroke-width="1.3"/>
    <path d="M100 18 v22 a16 5 0 0 0 32 0 v-22" stroke-width="1.3"/>
    <line x1="103" y1="11" x2="129" y2="47" stroke-width="1.6"/>
  </g>
  <!-- 9s clock -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <text x="138" y="46" font-family="ui-monospace, monospace" font-size="8" stroke="none">9s</text>
  </g>
  <!-- confession bubble -->
  <g class="muted" stroke="currentColor" fill="none">
    <path d="M150 8 h54 a4 4 0 0 1 4 4 v16 a4 4 0 0 1 -4 4 h-40 l-7 7 v-7 h-7 a4 4 0 0 1 -4 -4 v-16 a4 4 0 0 1 4 -4 z" stroke-width="1.1"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="156" y="20" font-family="Fraunces, serif" font-size="9" font-style="italic">&#8220;I panicked.&#8221;</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="156" y="29" font-family="ui-monospace, monospace" font-size="5.5">catastrophic error in judgment</text>
  </g>
</svg>

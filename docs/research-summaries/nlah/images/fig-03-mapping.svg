<svg viewBox="0 0 620 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping NLAH plus IHR constructs (left, oxblood) onto harebrain and MPL primitives (right, blueprint): NLAH document maps to the .mpl chart; IHR maps to the MPL runtime / tick engine; runtime policy maps to the engine's fixed evaluation rules; stages and roles map to states; validation gates and stopping conditions map to transition guards; recovery policy maps to deterministic conflict resolution; parent/child handoff maps to runtime instantiation; scripts and adapters map to host imports at the seam; base agent at the leaf maps to the LLM at the leaf.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <!-- headers -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">NLAH + IHR</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain / MPL</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/>
  </g>

  <!-- Row 1: NLAH document <-> .mpl chart -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="56" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="56" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="74" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">NLAH document</text>
    <text x="30" y="91" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">editable policy, in prose</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="56" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="56" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="74" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the .mpl chart</text>
    <text x="370" y="91" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the legislation, formal manifest</text>
  </g>

  <!-- Row 2: IHR <-> runtime / tick engine -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="108" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="108" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="126" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">IHR</text>
    <text x="30" y="143" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">interprets the document</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="108" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="108" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="126" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">MPL runtime / tick engine</text>
    <text x="370" y="143" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">interprets the chart</text>
  </g>

  <!-- Row 3: Runtime policy <-> evaluation rules -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="160" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="160" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="178" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">runtime policy (fixed)</text>
    <text x="30" y="195" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">how any NLAH is read</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="160" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="160" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="178" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">engine evaluation rules</text>
    <text x="370" y="195" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">fixed, not per-feature</text>
  </g>

  <!-- Row 4: Stages/roles <-> states -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="212" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="212" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="230" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">stages and roles</text>
    <text x="30" y="247" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">named phases of the run</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="212" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="212" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="230" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">states / sub-charts</text>
    <text x="370" y="247" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">XOR &amp; AND decomposition</text>
  </g>

  <!-- Row 5: Validation gates / stopping <-> transition guards -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="264" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="264" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="282" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">validation &#183; stopping</text>
    <text x="30" y="299" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">LLM-interpreted conditions</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="264" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="264" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="282" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">transition guards</text>
    <text x="370" y="299" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">when [open_qs == 0] =&gt; Report</text>
  </g>

  <!-- Row 6: Recovery policy <-> conflict resolution -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="316" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="316" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="334" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">recovery / retry policy</text>
    <text x="30" y="351" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">what to do on failure</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="316" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="316" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="334" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">conflict resolution</text>
    <text x="370" y="351" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">@priority &#8594; @weight &#8594; seed</text>
  </g>

  <!-- Row 7: Parent/child handoff <-> runtime instantiation -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="368" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="368" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="386" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">parent/child handoff</text>
    <text x="30" y="403" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">task packet &#8212; recall 0.32 &#9888;</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="368" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="368" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="386" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">instantiation + Manifest</text>
    <text x="370" y="403" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">new Blueprint &#183; shared snapshot</text>
  </g>

  <!-- Row 8: Scripts/adapters <-> host imports -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="420" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="420" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="438" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">scripts / adapters</text>
    <text x="30" y="455" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">deterministic code hooks</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="420" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="420" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="438" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">host imports (the seam)</text>
    <text x="370" y="455" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">code &#8594; typed verdict</text>
  </g>

  <!-- Row 9: Base agent <-> LLM at the leaf -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="472" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="472" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="490" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">base agent (leaf loop)</text>
    <text x="30" y="507" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">LLM loop + terminal</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="472" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="472" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="490" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">LLM at the leaf</text>
    <text x="370" y="507" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">one rich call per state</text>
  </g>

  <!-- connecting arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="78"  x2="358" y2="78"  stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,78 352,75 352,81" stroke="none"/>
    <line x1="262" y1="130" x2="358" y2="130" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,130 352,127 352,133" stroke="none"/>
    <line x1="262" y1="182" x2="358" y2="182" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,182 352,179 352,185" stroke="none"/>
    <line x1="262" y1="234" x2="358" y2="234" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,234 352,231 352,237" stroke="none"/>
    <line x1="262" y1="286" x2="358" y2="286" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,286 352,283 352,289" stroke="none"/>
    <line x1="262" y1="338" x2="358" y2="338" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,338 352,335 352,341" stroke="none"/>
    <line x1="262" y1="390" x2="358" y2="390" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,390 352,387 352,393" stroke="none"/>
    <line x1="262" y1="442" x2="358" y2="442" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,442 352,439 352,445" stroke="none"/>
    <line x1="262" y1="494" x2="358" y2="494" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,494 352,491 352,497" stroke="none"/>
  </g>

  <!-- footer -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="532" x2="580" y2="532" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="550" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">NLAH authors the cage in prose &#183; MPL runs it deterministically &#183; the handoff leak is the case for the Manifest</text>
  </g>
</svg>

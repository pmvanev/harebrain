<svg width="200" height="58" viewBox="0 0 200 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NLAH glyph: an editable document feeds a runtime gear that fans out to three child LLM discs">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- NLAH document (left) -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="6" y="8" width="38" height="42" rx="3"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="6" y="8" width="38" height="42" rx="3" stroke-width="1.4" fill="none"/>
    <line x1="12" y1="18" x2="38" y2="18" stroke-width="1.1"/>
    <line x1="12" y1="25" x2="38" y2="25" stroke-width="1.1"/>
    <line x1="12" y1="32" x2="32" y2="32" stroke-width="1.1"/>
    <line x1="12" y1="39" x2="38" y2="39" stroke-width="1.1"/>
    <text x="25" y="5" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em" text-anchor="middle" stroke="none">NLAH</text>
  </g>
  <!-- interpret arrow -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="46" y1="29" x2="68" y2="29" stroke-width="1.2"/>
    <polygon points="71,29 65,26 65,32" stroke="none"/>
  </g>
  <!-- IHR gear -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <circle cx="86" cy="29" r="15"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <circle cx="86" cy="29" r="15" stroke-width="1.4" fill="none"/>
    <circle cx="86" cy="29" r="5" stroke-width="1.2" fill="none"/>
    <line x1="86" y1="9" x2="86" y2="15" stroke-width="1.2"/>
    <line x1="86" y1="43" x2="86" y2="49" stroke-width="1.2"/>
    <line x1="66" y1="29" x2="72" y2="29" stroke-width="1.2"/>
    <line x1="100" y1="29" x2="106" y2="29" stroke-width="1.2"/>
    <text x="86" y="55" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em" text-anchor="middle" stroke="none">IHR</text>
  </g>
  <!-- fan-out arrows to child LLMs -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="103" y1="22" x2="150" y2="12" stroke-width="1.1"/>
    <line x1="105" y1="29" x2="150" y2="29" stroke-width="1.1"/>
    <line x1="103" y1="36" x2="150" y2="46" stroke-width="1.1"/>
  </g>
  <!-- child LLM discs -->
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="170" cy="12" rx="22" ry="9" stroke-width="1.3" fill="none"/>
    <text x="170" y="15" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" stroke="none">LLM</text>
    <ellipse cx="170" cy="29" rx="22" ry="9" stroke-width="1.3" fill="none"/>
    <text x="170" y="32" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" stroke="none">LLM</text>
    <ellipse cx="170" cy="46" rx="22" ry="9" stroke-width="1.3" fill="none"/>
    <text x="170" y="49" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" stroke="none">LLM</text>
  </g>
</svg>

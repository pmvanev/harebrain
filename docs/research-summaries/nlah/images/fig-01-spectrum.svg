<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Control spectrum: hard code control on the left (a code harness driving one LLM), NLAH plus IHR in the middle (a natural-language document interpreted by a runtime fanning out to child LLMs), and self-harnessing on the right (one LLM directly harnessing other LLMs with no external control).">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.07); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>

  <!-- panel titles -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="100" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">Code Harness</text>
    <text x="320" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">NLAH + IHR</text>
    <text x="540" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">Self-Harnessing</text>
  </g>

  <!-- LEFT: code harness -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="36" width="100" height="58" rx="4"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="36" width="100" height="58" rx="4" stroke-width="1.3" fill="none"/>
    <text x="28" y="52" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">while not done:</text>
    <text x="28" y="63" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">  act=select(p)</text>
    <text x="28" y="74" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">  r=run(act)</text>
    <text x="28" y="85" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">  if verify():..</text>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <line x1="70" y1="94" x2="70" y2="112" stroke-width="1.2"/>
    <polygon points="70,115 67,109 73,109" stroke="none"/>
    <ellipse cx="70" cy="128" rx="22" ry="9" stroke-width="1.3" fill="none"/>
    <text x="70" y="131" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" stroke="none">LLM</text>
  </g>

  <!-- MIDDLE: NLAH + IHR -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="230" y="40" width="58" height="50" rx="3"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="230" y="40" width="58" height="50" rx="3" stroke-width="1.3" fill="none"/>
    <text x="259" y="37" font-family="ui-monospace, monospace" font-size="6" text-anchor="middle" stroke="none">NLAH</text>
    <text x="236" y="55" font-family="JetBrains Mono, monospace" font-size="6" stroke="none">"plan step"</text>
    <text x="236" y="66" font-family="JetBrains Mono, monospace" font-size="6" stroke="none">"validate"</text>
    <text x="236" y="77" font-family="JetBrains Mono, monospace" font-size="6" stroke="none">"update plan"</text>
    <text x="236" y="88" font-family="JetBrains Mono, monospace" font-size="6" stroke="none">"choose tool"</text>
  </g>
  <!-- interpret arrow -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="290" y1="65" x2="306" y2="65" stroke-width="1.1"/>
    <polygon points="309,65 303,62 303,68" stroke="none"/>
  </g>
  <!-- IHR gear -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><circle cx="328" cy="65" r="18"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <circle cx="328" cy="65" r="18" stroke-width="1.3" fill="none"/>
    <circle cx="328" cy="65" r="6" stroke-width="1.1" fill="none"/>
    <line x1="328" y1="42" x2="328" y2="49" stroke-width="1.1"/>
    <line x1="328" y1="81" x2="328" y2="88" stroke-width="1.1"/>
    <text x="328" y="103" font-family="ui-monospace, monospace" font-size="6" text-anchor="middle" stroke="none">IHR</text>
  </g>
  <!-- fan-out to children -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="346" y1="56" x2="378" y2="46" stroke-width="1.1"/>
    <line x1="346" y1="65" x2="378" y2="65" stroke-width="1.1"/>
    <line x1="346" y1="74" x2="378" y2="84" stroke-width="1.1"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="395" cy="46" rx="16" ry="7" stroke-width="1.2" fill="none"/>
    <text x="395" y="49" font-family="ui-monospace, monospace" font-size="6" text-anchor="middle" stroke="none">LLM</text>
    <ellipse cx="395" cy="65" rx="16" ry="7" stroke-width="1.2" fill="none"/>
    <text x="395" y="68" font-family="ui-monospace, monospace" font-size="6" text-anchor="middle" stroke="none">LLM</text>
    <ellipse cx="395" cy="84" rx="16" ry="7" stroke-width="1.2" fill="none"/>
    <text x="395" y="87" font-family="ui-monospace, monospace" font-size="6" text-anchor="middle" stroke="none">LLM</text>
  </g>

  <!-- RIGHT: self-harnessing -->
  <g class="sage-tint" stroke="none" fill="currentColor"><circle cx="540" cy="68" r="40"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="540" cy="68" rx="18" ry="8" stroke-width="1.3" fill="none"/>
    <text x="540" y="71" font-family="ui-monospace, monospace" font-size="7" text-anchor="middle" stroke="none">LLM</text>
  </g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="528" y1="58" x2="505" y2="40" stroke-width="1"/>
    <line x1="552" y1="58" x2="575" y2="40" stroke-width="1"/>
    <line x1="524" y1="76" x2="500" y2="92" stroke-width="1"/>
    <line x1="556" y1="76" x2="580" y2="92" stroke-width="1"/>
    <line x1="540" y1="60" x2="540" y2="34" stroke-width="1"/>
  </g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <circle cx="498" cy="36" r="8" stroke-width="1" fill="none"/>
    <text x="498" y="39" font-family="ui-monospace, monospace" font-size="5" text-anchor="middle" stroke="none">LLM</text>
    <circle cx="582" cy="36" r="8" stroke-width="1" fill="none"/>
    <text x="582" y="39" font-family="ui-monospace, monospace" font-size="5" text-anchor="middle" stroke="none">LLM</text>
    <circle cx="494" cy="98" r="8" stroke-width="1" fill="none"/>
    <text x="494" y="101" font-family="ui-monospace, monospace" font-size="5" text-anchor="middle" stroke="none">LLM</text>
    <circle cx="586" cy="98" r="8" stroke-width="1" fill="none"/>
    <text x="586" y="101" font-family="ui-monospace, monospace" font-size="5" text-anchor="middle" stroke="none">LLM</text>
    <circle cx="540" cy="28" r="8" stroke-width="1" fill="none"/>
    <text x="540" y="31" font-family="ui-monospace, monospace" font-size="5" text-anchor="middle" stroke="none">LLM</text>
  </g>

  <!-- spectrum bar -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="30" y1="168" x2="610" y2="168" stroke-width="2"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <circle cx="60" cy="168" r="5" stroke-width="1.3" fill="currentColor"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <circle cx="320" cy="168" r="5" stroke-width="1.3" fill="none"/>
  </g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="580" y1="168" x2="608" y2="168" stroke-width="2"/>
    <polygon points="612,168 604,164 604,172" stroke="none"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="60" y="190" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">Hard code control</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="320" y="190" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">Soft NL-guided control</text>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="585" y="190" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">No external control</text>
  </g>

  <!-- footer caption -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="232" x2="600" y2="232" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="252" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="middle">the policy is readable text &#183; the runtime, not the model, enforces it</text>
  </g>
</svg>

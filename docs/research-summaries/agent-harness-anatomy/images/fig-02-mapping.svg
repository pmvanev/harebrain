<svg viewBox="0 0 620 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping agent-harness organs (left, oxblood) onto harebrain primitives (right, blueprint): model maps to LLM at the leaf; system prompt and tools map to the seam; filesystem and git map to blackboard and Manifest; memory and search map to pinned facts and slow-clock authoring; context management maps to working-memory decay; planning and verification map to HSM topology and transition guards; sandbox maps to the bounded action surface; hooks and the Ralph loop map to the AI director; orchestration maps to runtime instantiation.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <!-- headers -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">agent harness</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/>
  </g>

  <!-- Row 1: Model <-> LLM at the leaf -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="54" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="54" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="72" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">model (the intelligence)</text>
    <text x="30" y="88" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">raw judgment over text</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="54" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="54" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="72" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">LLM at the leaf</text>
    <text x="370" y="88" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">one rich call per state</text>
  </g>

  <!-- Row 2: System prompt + tools <-> the seam -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="104" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="104" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="122" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">system prompt + tools / MCP</text>
    <text x="30" y="138" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">how the model reaches the world</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="104" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="104" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="122" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the seam</text>
    <text x="370" y="138" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">host import &#8594; typed verdict</text>
  </g>

  <!-- Row 3: Filesystem + git <-> blackboard / Manifest -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="154" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="154" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="172" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">filesystem + git</text>
    <text x="30" y="188" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">durable state &#183; rollback &#183; ledger</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="154" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="154" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="172" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">blackboard / Manifest</text>
    <text x="370" y="188" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">tick-snapshot &#183; replayable ledger</text>
  </g>

  <!-- Row 4: Memory + search <-> pinned facts / slow-clock -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="204" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="204" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="222" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">memory + search (AGENTS.md)</text>
    <text x="30" y="238" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">continual learning &#183; current data</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="204" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="204" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="222" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">pinned facts + slow-clock authoring</text>
    <text x="370" y="238" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">user constraints survive decay</text>
  </g>

  <!-- Row 5: Context management <-> working-memory decay -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="254" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="254" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="272" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">context management</text>
    <text x="30" y="288" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">compaction &#183; offload &#183; vs context rot</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="254" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="254" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="272" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">working-memory-fact decay</text>
    <text x="370" y="288" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">fresh first &#183; stale flagged low-conf</text>
  </g>

  <!-- Row 6: Planning + verification <-> HSM + guards -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="304" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="304" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="322" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">planning + verification loops</text>
    <text x="30" y="338" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">decompose &#183; test &#183; self-correct</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="304" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="304" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="322" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">HSM topology + guards</text>
    <text x="370" y="338" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">when [open_qs == 0] =&gt; Report</text>
  </g>

  <!-- Row 7: Sandbox <-> bounded action surface -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="354" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="354" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="372" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">sandbox</text>
    <text x="30" y="388" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">isolation &#183; allow-list</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="354" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="354" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="372" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">bounded action surface</text>
    <text x="370" y="388" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">unwanted state unreachable by geometry</text>
  </g>

  <!-- Row 8: Hooks / Ralph loop <-> AI director -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="404" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="404" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="422" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">hooks / Ralph loop</text>
    <text x="30" y="438" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">intercept exit &#183; reinject prompt</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="404" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="404" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="422" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">AI director</text>
    <text x="370" y="438" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">&#8220;are you stuck?&#8221; &#183; modulates inner loop</text>
  </g>

  <!-- Row 9: Orchestration <-> runtime instantiation -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="454" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="454" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="472" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">orchestration</text>
    <text x="30" y="488" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">subagent spawn &#183; handoff &#183; routing</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="454" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="454" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="472" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">runtime instantiation</text>
    <text x="370" y="488" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">new Blueprint : Name &#183; Tier 2</text>
  </g>

  <!-- connecting arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="75"  x2="358" y2="75"  stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,75 352,72 352,78" stroke="none"/>
    <line x1="262" y1="125" x2="358" y2="125" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,125 352,122 352,128" stroke="none"/>
    <line x1="262" y1="175" x2="358" y2="175" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,175 352,172 352,178" stroke="none"/>
    <line x1="262" y1="225" x2="358" y2="225" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,225 352,222 352,228" stroke="none"/>
    <line x1="262" y1="275" x2="358" y2="275" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,275 352,272 352,278" stroke="none"/>
    <line x1="262" y1="325" x2="358" y2="325" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,325 352,322 352,328" stroke="none"/>
    <line x1="262" y1="375" x2="358" y2="375" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,375 352,372 352,378" stroke="none"/>
    <line x1="262" y1="425" x2="358" y2="425" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,425 352,422 352,428" stroke="none"/>
    <line x1="262" y1="475" x2="358" y2="475" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,475 352,472 352,478" stroke="none"/>
  </g>

  <!-- footer -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="514" x2="580" y2="514" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="532" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">organs name what they do &#183; harebrain names what they bound</text>
  </g>
</svg>

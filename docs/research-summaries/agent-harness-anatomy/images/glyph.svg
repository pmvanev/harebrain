<svg width="200" height="58" viewBox="0 0 200 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A small model nucleus surrounded by a ring of harness organs — filesystem, sandbox, context, loop — with the model marked as the only part that is not harness.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- harness ring (the cage) -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <ellipse cx="29" cy="29" rx="27" ry="22"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="none">
    <ellipse cx="29" cy="29" rx="27" ry="22" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <!-- organ ticks around the ring -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="26" y="5"  width="6" height="4" rx="1" stroke="none"/>
    <rect x="50" y="26" width="6" height="6" rx="1" stroke="none"/>
    <rect x="26" y="49" width="6" height="4" rx="1" stroke="none"/>
    <rect x="2"  y="26" width="6" height="6" rx="1" stroke="none"/>
  </g>
  <!-- model nucleus (the brain) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="29" cy="29" rx="14" ry="9"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="29" cy="29" rx="14" ry="9" stroke-width="1.4" fill="none"/>
    <text x="29" y="32" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.05em" stroke="none">MODEL</text>
  </g>
  <!-- the equation -->
  <g class="ink" stroke="none" fill="currentColor">
    <text x="68" y="26" font-family="Fraunces, serif" font-size="13" font-style="italic">Agent = Model</text>
    <text x="68" y="44" font-family="Fraunces, serif" font-size="13" font-style="italic">+ Harness</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="68" y="56" font-family="ui-monospace, monospace" font-size="6.5" letter-spacing="0.08em">not the model? then the harness</text>
  </g>
</svg>

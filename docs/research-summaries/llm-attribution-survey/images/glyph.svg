<svg width="190" height="58" viewBox="0 0 190 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An LLM disc emits a claim arrow to a citation tag; a verify arrow checks the tag against a source corpus stack.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- LLM disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="28" cy="29" rx="23" ry="13"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="28" cy="29" rx="23" ry="13" stroke-width="1.4" fill="none"/>
    <text x="28" y="32" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle" letter-spacing="0.1em" stroke="none">LLM</text>
  </g>
  <!-- claim arrow (top) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="52" y1="19" x2="98" y2="19" stroke-width="1.3"/>
    <polygon points="101,19 95,16 95,22" stroke="none"/>
    <text x="58" y="14" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.4" stroke="none">claim</text>
  </g>
  <!-- citation tag -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="103" y="11" width="30" height="17" rx="3"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="103" y="11" width="30" height="17" rx="3" stroke-width="1.3" fill="none"/>
    <text x="118" y="23" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" stroke="none">[1]</text>
  </g>
  <!-- verify arrow (down/right to corpus) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="135" y1="22" x2="150" y2="34" stroke-width="1.2" stroke-dasharray="3 3"/>
    <polygon points="152,36 145,34 149,30" stroke="none"/>
    <text x="86" y="52" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.4" stroke="none">verify</text>
  </g>
  <!-- source corpus stack -->
  <g class="sage" stroke="currentColor" fill="none">
    <rect x="151" y="35" width="30" height="6" rx="1" stroke-width="1.1"/>
    <rect x="153" y="42" width="30" height="6" rx="1" stroke-width="1.1"/>
    <rect x="155" y="49" width="30" height="6" rx="1" stroke-width="1.1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="151" y="32" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em">SOURCES</text>
  </g>
</svg>

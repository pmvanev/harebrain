<svg viewBox="0 0 660 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The survey's taxonomy of LLM attribution, redrawn: a root splits into five branches — Sources (pre-training data, out-of-model knowledge), Datasets, Approaches (direct generated, post-retrieval answering, post-generation, attribution systems), and Evaluation.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .sage-tint      { color: rgba(79, 107, 63, 0.07); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>

  <!-- title -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="20" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic">Taxonomy of LLM attribution</text>
  </g>

  <!-- root -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="16" y="200" width="120" height="40" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="16" y="200" width="120" height="40" rx="6" stroke-width="1.4" fill="none"/>
    <text x="76" y="217" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">LLM</text>
    <text x="76" y="231" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">attribution</text>
  </g>

  <!-- branch connectors from root to 5 branch nodes -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <path d="M136 210 C 180 210, 180 50, 224 50" stroke-width="1.2"/>
    <path d="M136 216 C 180 216, 180 132, 224 132" stroke-width="1.2"/>
    <path d="M136 220 C 180 220, 180 214, 224 214" stroke-width="1.2"/>
    <path d="M136 226 C 180 226, 180 330, 224 330" stroke-width="1.2"/>
    <path d="M136 232 C 180 232, 180 440, 224 440" stroke-width="1.2"/>
  </g>

  <!-- branch nodes -->
  <!-- Sources -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="224" y="34" width="96" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="224" y="34" width="96" height="32" rx="5" stroke-width="1.3" fill="none"/>
    <text x="272" y="50" font-family="Fraunces, serif" font-size="10" font-style="italic" text-anchor="middle" stroke="none">Sources</text>
    <text x="272" y="61" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">&#xa7;3</text>
  </g>
  <!-- Datasets -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="224" y="116" width="96" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="224" y="116" width="96" height="32" rx="5" stroke-width="1.3" fill="none"/>
    <text x="272" y="132" font-family="Fraunces, serif" font-size="10" font-style="italic" text-anchor="middle" stroke="none">Datasets</text>
    <text x="272" y="143" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">&#xa7;4</text>
  </g>
  <!-- Approaches -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="224" y="198" width="96" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="224" y="198" width="96" height="32" rx="5" stroke-width="1.3" fill="none"/>
    <text x="272" y="214" font-family="Fraunces, serif" font-size="10" font-style="italic" text-anchor="middle" stroke="none">Approaches</text>
    <text x="272" y="225" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">&#xa7;5</text>
  </g>
  <!-- Evaluation -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="224" y="424" width="96" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="224" y="424" width="96" height="32" rx="5" stroke-width="1.3" fill="none"/>
    <text x="272" y="440" font-family="Fraunces, serif" font-size="10" font-style="italic" text-anchor="middle" stroke="none">Evaluation</text>
    <text x="272" y="451" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">&#xa7;6</text>
  </g>

  <!-- leaf connectors -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <!-- sources -> 2 leaves -->
    <path d="M320 46 C 350 46, 350 38, 380 38" stroke-width="1"/>
    <path d="M320 54 C 350 54, 350 78, 380 78" stroke-width="1"/>
    <!-- approaches -> 4 leaves -->
    <path d="M320 206 C 350 206, 350 168, 380 168" stroke-width="1"/>
    <path d="M320 212 C 350 212, 350 220, 380 220" stroke-width="1"/>
    <path d="M320 218 C 350 218, 350 272, 380 272" stroke-width="1"/>
    <path d="M320 224 C 350 224, 350 324, 380 324" stroke-width="1"/>
  </g>

  <!-- leaves: Sources -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="380" y="26" width="270" height="24" rx="4"/></g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="388" y="38" font-family="Fraunces, serif" font-size="9.5" font-style="italic">Pre-training data</text>
    <text x="388" y="48" font-family="JetBrains Mono, monospace" font-size="7">ORCA &#183; ROOTS &#183; QUIP-Score &#183; trace claim&#8594;corpus</text>
  </g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="380" y="66" width="270" height="24" rx="4"/></g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="388" y="78" font-family="Fraunces, serif" font-size="9.5" font-style="italic">Out-of-model knowledge</text>
    <text x="388" y="88" font-family="JetBrains Mono, monospace" font-size="7">RAG &#183; Retro &#183; FiD &#183; external retrieved evidence</text>
  </g>

  <!-- leaves: Datasets (one wide leaf) -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="380" y="116" width="270" height="32" rx="4"/></g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="388" y="130" font-family="Fraunces, serif" font-size="9.5" font-style="italic">QA / summarization benchmarks</text>
    <text x="388" y="141" font-family="JetBrains Mono, monospace" font-size="7">WebGPT &#183; WebCPM &#183; HAGRID &#183; ALCE &#183; ExpertQA &#183; BioKaLMA</text>
  </g>

  <!-- leaves: Approaches -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="380" y="156" width="270" height="24" rx="4"/></g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="388" y="168" font-family="Fraunces, serif" font-size="9.5" font-style="italic">Direct generated attribution</text>
    <text x="388" y="178" font-family="JetBrains Mono, monospace" font-size="7">RECITE &#183; 1-PAGER &#183; cite from parametric memory</text>
  </g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="380" y="208" width="270" height="24" rx="4"/></g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="388" y="220" font-family="Fraunces, serif" font-size="9.5" font-style="italic">Post-retrieval answering</text>
    <text x="388" y="230" font-family="JetBrains Mono, monospace" font-size="7">SearChain &#183; Self-RAG &#183; LLatrieval &#183; retrieve then answer</text>
  </g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="380" y="260" width="270" height="24" rx="4"/></g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="388" y="272" font-family="Fraunces, serif" font-size="9.5" font-style="italic">Post-generation attribution</text>
    <text x="388" y="282" font-family="JetBrains Mono, monospace" font-size="7">RARR &#183; CCVER &#183; answer, then search + post-edit</text>
  </g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="380" y="312" width="270" height="24" rx="4"/></g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="388" y="324" font-family="Fraunces, serif" font-size="9.5" font-style="italic">Attribution systems</text>
    <text x="388" y="334" font-family="JetBrains Mono, monospace" font-size="7">LaMDA &#183; WebGPT &#183; GopherCite &#183; Sparrow</text>
  </g>

  <!-- leaf: Evaluation -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <path d="M320 436 C 350 436, 350 432, 380 432" stroke-width="1"/>
  </g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="380" y="420" width="270" height="24" rx="4"/></g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="388" y="432" font-family="Fraunces, serif" font-size="9.5" font-style="italic">Human &#183; categorization &#183; metrics</text>
    <text x="388" y="442" font-family="JetBrains Mono, monospace" font-size="7">AIS &#183; AttrScore &#183; Correctness / Precision / Recall / F1</text>
  </g>
</svg>

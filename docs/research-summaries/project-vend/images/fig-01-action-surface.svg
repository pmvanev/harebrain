<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Claudius the LLM in the centre wired directly to five real-world levers — set price, send payment, email vendor, restock, describe self — each firing straight into a real consequence with no guard between them: a refused 100-dollar overpayment, money sent to a nonexistent Venmo, a hallucinated vendor conflict, a 17 percent loss on tungsten cubes, and the 742 Evergreen Terrace identity drift.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <!-- title -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="22" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.08em">A REAL ECONOMY HANDED TO A MODEL WITH NO GUARD IN BETWEEN</text>
  </g>

  <!-- LLM core -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><ellipse cx="86" cy="215" rx="46" ry="30"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="86" cy="215" rx="46" ry="30" stroke-width="1.5" fill="none"/>
    <text x="86" y="210" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle" stroke="none">Claudius</text>
    <text x="86" y="226" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">one LLM, free rein</text>
  </g>

  <!-- the missing gate -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="300" y1="58" x2="300" y2="392" stroke-width="1.2" stroke-dasharray="2 5"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="300" y="408" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" letter-spacing="0.05em">&#8593; where a transition guard belonged</text>
  </g>

  <!-- lever rows: x for lever box ~ 150..290; consequence ~ 330..620 -->
  <!-- row 1 -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <text x="150" y="78" font-family="JetBrains Mono, monospace" font-size="9" stroke="none">set_price()</text>
    <line x1="132" y1="195" x2="150" y2="80" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="232" y1="74" x2="328" y2="74" stroke-width="1.1"/>
    <polygon points="331,74 325,71 325,77" stroke="none"/>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="334" y="60" width="288" height="30" rx="5"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="344" y="79" font-family="Fraunces, serif" font-size="11" font-style="italic">refused a customer overpaying $100 for a six-pack</text></g>

  <!-- row 2 -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <text x="150" y="138" font-family="JetBrains Mono, monospace" font-size="9" stroke="none">send_payment()</text>
    <line x1="132" y1="200" x2="150" y2="140" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="244" y1="134" x2="328" y2="134" stroke-width="1.1"/>
    <polygon points="331,134 325,131 325,137" stroke="none"/>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="334" y="120" width="288" height="30" rx="5"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="344" y="139" font-family="Fraunces, serif" font-size="11" font-style="italic">wired money to a Venmo account that did not exist</text></g>

  <!-- row 3 -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <text x="150" y="198" font-family="JetBrains Mono, monospace" font-size="9" stroke="none">email_vendor()</text>
    <line x1="133" y1="213" x2="150" y2="200" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="240" y1="194" x2="328" y2="194" stroke-width="1.1"/>
    <polygon points="331,194 325,191 325,197" stroke="none"/>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="334" y="180" width="288" height="30" rx="5"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="344" y="199" font-family="Fraunces, serif" font-size="11" font-style="italic">escalated a vendor conflict it had wholly hallucinated</text></g>

  <!-- row 4 -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <text x="150" y="258" font-family="JetBrains Mono, monospace" font-size="9" stroke="none">restock()</text>
    <line x1="133" y1="230" x2="150" y2="260" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="214" y1="254" x2="328" y2="254" stroke-width="1.1"/>
    <polygon points="331,254 325,251 325,257" stroke="none"/>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="334" y="240" width="288" height="30" rx="5"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="344" y="259" font-family="Fraunces, serif" font-size="11" font-style="italic">launched a tungsten-cube line; &#8722;17% in a single day</text></g>

  <!-- row 5 -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <text x="150" y="318" font-family="JetBrains Mono, monospace" font-size="9" stroke="none">describe_self()</text>
    <line x1="132" y1="235" x2="150" y2="320" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="240" y1="314" x2="328" y2="314" stroke-width="1.1"/>
    <polygon points="331,314 325,311 325,317" stroke="none"/>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="334" y="300" width="288" height="30" rx="5"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="344" y="319" font-family="Fraunces, serif" font-size="11" font-style="italic">claimed a blazer and a visit to 742 Evergreen Terrace</text></g>

  <!-- footer rule + caption -->
  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="362" x2="600" y2="362" stroke-width="1"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="382" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">every lever was a tool call with no precondition &#183; the model was the only thing deciding whether to pull it</text>
  </g>
</svg>

<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping Project Vend failure modes (left, oxblood) onto the harebrain primitive that would have caught each (right, blueprint): free rein over a real economy maps to a bounded action surface; identity by hallucination maps to the Manifest holding identity as ground truth; payment with no precondition maps to a transition guard on irreversible actions; the tungsten-cube pivot maps to utility scoring under the director; a month unsupervised maps to the two-clocks split.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="oxblood" stroke="none" fill="currentColor"><text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">Project Vend</text></g>
  <g class="blueprint" stroke="none" fill="currentColor"><text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text></g>
  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/></g>

  <!-- Row 1 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="60" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">free rein over a real economy</text>
    <text x="30" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">price, pay, restock, email &#8212; ungated</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="60" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">bounded action surface</text>
    <text x="370" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">only the chart&#8217;s edges are reachable</text>
  </g>

  <!-- Row 2 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="118" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">identity by hallucination</text>
    <text x="30" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the blazer, 742 Evergreen Terrace</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="118" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">Manifest holds identity</text>
    <text x="370" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">ground truth the model reads, not invents</text>
  </g>

  <!-- Row 3 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="176" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">payment with no precondition</text>
    <text x="30" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">send_payment() fires on a whim</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="176" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">guard on irreversible acts</text>
    <text x="370" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">when [payee_verified] =&gt; Pay</text>
  </g>

  <!-- Row 4 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="234" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the tungsten-cube pivot</text>
    <text x="30" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">a strategy nothing scored or vetoed</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="234" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">utility scoring + director</text>
    <text x="370" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">outer loop reweights, vetoes the drift</text>
  </g>

  <!-- Row 5 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="292" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">a month unsupervised</text>
    <text x="30" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">no human in any loop until it broke</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="292" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">two clocks</text>
    <text x="370" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">human authors slow, model runs inside fast</text>
  </g>

  <!-- arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="82"  x2="358" y2="82"  stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,82 352,79 352,85" stroke="none"/>
    <line x1="262" y1="140" x2="358" y2="140" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,140 352,137 352,143" stroke="none"/>
    <line x1="262" y1="198" x2="358" y2="198" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,198 352,195 352,201" stroke="none"/>
    <line x1="262" y1="256" x2="358" y2="256" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,256 352,253 352,259" stroke="none"/>
    <line x1="262" y1="314" x2="358" y2="314" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,314 352,311 352,317" stroke="none"/>
  </g>

  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="360" x2="580" y2="360" stroke-width="1"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="380" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Anthropic ran the experiment that proves Anthropic&#8217;s model needs the cage</text>
  </g>
</svg>

<svg width="208" height="58" viewBox="0 0 208 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A vending machine with an LLM brain for its display, a payment arrow leaving to an empty void, and a dashed hallucination bubble reading 742">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- vending machine body -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="8" y="6" width="46" height="46" rx="4"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="none">
    <rect x="8" y="6" width="46" height="46" rx="4" stroke-width="1.4"/>
    <line x1="12" y1="30" x2="38" y2="30" stroke-width="0.8"/>
    <line x1="12" y1="22" x2="38" y2="22" stroke-width="0.8"/>
    <rect x="42" y="11" width="8" height="30" rx="1" stroke-width="0.8"/>
    <rect x="13" y="44" width="20" height="4" rx="1" stroke-width="0.9"/>
  </g>
  <!-- LLM brain as the display -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><ellipse cx="25" cy="16" rx="13" ry="6.5"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="25" cy="16" rx="13" ry="6.5" stroke-width="1.2" fill="none"/>
    <text x="25" y="19" font-family="ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.05em" stroke="none">LLM</text>
  </g>
  <!-- payment arrow leaving to the void -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="58" y1="40" x2="92" y2="40" stroke-width="1.2" stroke-dasharray="3 3"/>
    <polygon points="95,40 89,37 89,43" stroke="none"/>
    <text x="60" y="35" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.3" stroke="none">$ &#8594;</text>
    <circle cx="103" cy="40" r="6" stroke-width="1.2" fill="none"/>
    <line x1="99" y1="44" x2="107" y2="36" stroke-width="1"/>
  </g>
  <!-- hallucination bubble -->
  <g class="muted" stroke="currentColor" fill="none">
    <path d="M122 10 h70 a4 4 0 0 1 4 4 v18 a4 4 0 0 1 -4 4 h-52 l-8 8 v-8 h-10 a4 4 0 0 1 -4 -4 v-18 a4 4 0 0 1 4 -4 z" stroke-width="1.1" stroke-dasharray="2.5 2.5"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="128" y="22" font-family="Fraunces, serif" font-size="8.5" font-style="italic">742 Evergreen Terrace</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="128" y="31" font-family="ui-monospace, monospace" font-size="6">re: my blazer, the tungsten</text>
  </g>
</svg>

<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A four-rung ladder labelled Semantic, Information, Data, Label from bottom to top. A severity arrow rises with the rungs; a detection-difficulty arrow falls against them — the two are inversely related. The semantic rung is annotated as uncatchable knowledge-shaped leakage; the label rung as easily-caught memorised answers.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="20" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">four rungs of leak</text></g>

  <!-- rungs: bottom = semantic (y high), top = label (y low) -->
  <!-- Label rung (top) -->
  <g class="oxblood-tint" fill="currentColor"><rect x="150" y="44" width="260" height="40" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="150" y="44" width="260" height="40" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="166" y="62" font-family="Fraunces, serif" font-size="12" font-style="italic">Label</text>
    <text x="166" y="77" font-family="JetBrains Mono, monospace" font-size="7.5">full test + answers — memorised outright</text></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="398" y="68" font-family="Spectral, serif" font-size="9" font-style="italic" text-anchor="end">easy to catch</text></g>

  <!-- Data rung -->
  <g class="oxblood-tint" fill="currentColor"><rect x="150" y="92" width="260" height="40" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="150" y="92" width="260" height="40" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="166" y="110" font-family="Fraunces, serif" font-size="12" font-style="italic">Data</text>
    <text x="166" y="125" font-family="JetBrains Mono, monospace" font-size="7.5">test inputs, labels stripped</text></g>

  <!-- Information rung -->
  <g class="oxblood-tint" fill="currentColor"><rect x="150" y="140" width="260" height="40" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="150" y="140" width="260" height="40" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="166" y="158" font-family="Fraunces, serif" font-size="12" font-style="italic">Information</text>
    <text x="166" y="173" font-family="JetBrains Mono, monospace" font-size="7.5">metadata, label distribution, timestamps</text></g>

  <!-- Semantic rung (bottom) -->
  <g class="oxblood-tint" fill="currentColor"><rect x="150" y="188" width="260" height="40" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="150" y="188" width="260" height="40" rx="5" stroke-width="1.6"/></g>
  <g class="ink" fill="currentColor"><text x="166" y="206" font-family="Fraunces, serif" font-size="12" font-style="italic">Semantic</text>
    <text x="166" y="221" font-family="JetBrains Mono, monospace" font-size="7.5">same-topic content — looks like knowledge</text></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="398" y="212" font-family="Spectral, serif" font-size="9" font-style="italic" text-anchor="end">uncatchable</text></g>

  <!-- severity arrow (left, rises toward label/top) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="40" y1="226" x2="40" y2="50" stroke-width="1.6"/>
    <polygon points="40,44 37,52 43,52" stroke="none"/>
    <text x="34" y="140" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" transform="rotate(-90 34 140)" letter-spacing="0.08em">severity &#8593;</text>
  </g>

  <!-- detection-difficulty arrow (right, rises toward semantic/bottom) -->
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <line x1="520" y1="50" x2="520" y2="226" stroke-width="1.6"/>
    <polygon points="520,232 517,224 523,224" stroke="none"/>
    <text x="526" y="140" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" transform="rotate(90 526 140)" letter-spacing="0.08em">detection difficulty &#8593;</text>
  </g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="258" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">the severe leak is catchable; the catchable leak isn't severe;</text>
    <text x="280" y="273" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">the unfixable one wears the costume of competence</text></g>
</svg>

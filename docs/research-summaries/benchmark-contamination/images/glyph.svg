<svg width="216" height="60" viewBox="0 0 216 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contamination glyph: a benchmark vial leaks into a training-data funnel feeding a model disc; a quarantine bracket fences off a fresh seeded sample.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- benchmark vial -->
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linejoin="round">
    <path d="M14 8 L26 8 L26 18 L33 38 Q34 44 28 44 L12 44 Q6 44 7 38 L14 18 Z"/>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><path d="M11 30 L29 30 L33 38 Q34 44 28 44 L12 44 Q6 44 7 38 Z"/></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.2"><line x1="13" y1="8" x2="27" y2="8"/></g>
  <!-- leak drip -->
  <g class="oxblood" stroke="none" fill="currentColor"><ellipse cx="20" cy="50" rx="2.4" ry="3.2"/></g>
  <!-- funnel (training data) -->
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.3" stroke-linejoin="round">
    <path d="M44 18 L78 18 L66 34 L66 46 L56 46 L56 34 Z"/>
  </g>
  <!-- arrow funnel to model -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="80" y1="32" x2="96" y2="32" stroke-width="1.2"/>
    <polygon points="99,32 93,29 93,35" stroke="none"/>
  </g>
  <!-- model disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><ellipse cx="120" cy="32" rx="20" ry="12"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="120" cy="32" rx="20" ry="12" stroke-width="1.4" fill="none"/>
    <text x="120" y="35" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.04em" stroke="none">model</text>
  </g>
  <!-- quarantine bracket around fresh seeded sample -->
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3">
    <path d="M158 12 L152 12 L152 52 L158 52"/>
    <path d="M198 12 L204 12 L204 52 L198 52"/>
  </g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.5">
    <circle cx="172" cy="26" r="3"/><circle cx="184" cy="26" r="3"/>
    <circle cx="178" cy="38" r="3"/>
    <line x1="172" y1="26" x2="178" y2="38"/><line x1="184" y1="26" x2="178" y2="38"/>
  </g>
  <g class="sage" stroke="none" fill="currentColor">
    <text x="178" y="50" font-family="JetBrains Mono, monospace" font-size="6" text-anchor="middle">seed N</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="178" y="9" font-family="Fraunces, serif" font-style="italic" font-size="8" text-anchor="middle">fresh</text>
  </g>
</svg>

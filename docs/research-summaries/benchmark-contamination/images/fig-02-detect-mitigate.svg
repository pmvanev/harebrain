<svg viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left column Detection splits into Matching-based (dataset inspection, membership inference, example generation) and Comparison-based (content, sequence, chronology). A red arrow labelled EAL rephrase-during-fine-tune plus fifteen percent undetected cuts across the detection column. Right column Mitigation splits into Data Curation, Data Refactoring, and Benchmark-free, with a caveat tag that the judge is contaminable too.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.12); }
    }
  </style>

  <!-- DETECTION column header -->
  <g class="oxblood" stroke="none" fill="currentColor"><text x="140" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">Detection &#8212; loses the arms race</text></g>
  <!-- MITIGATION column header -->
  <g class="blueprint" stroke="none" fill="currentColor"><text x="420" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">Mitigation &#8212; carries the weight</text></g>

  <!-- Detection: Matching-based -->
  <g class="oxblood-tint" fill="currentColor"><rect x="20" y="40" width="240" height="74" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="20" y="40" width="240" height="74" rx="6" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="32" y="58" font-family="Spectral, serif" font-size="11" font-style="italic">Matching-based</text></g>
  <g class="muted" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="8">
    <text x="32" y="74">&#8226; dataset inspection (n-gram / 50-char)</text>
    <text x="32" y="89">&#8226; membership inference (TS-Guessing)</text>
    <text x="32" y="104">&#8226; example generation, name-cloze</text>
  </g>

  <!-- Detection: Comparison-based -->
  <g class="oxblood-tint" fill="currentColor"><rect x="20" y="124" width="240" height="74" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="20" y="124" width="240" height="74" rx="6" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="32" y="142" font-family="Spectral, serif" font-size="11" font-style="italic">Comparison-based</text></g>
  <g class="muted" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="8">
    <text x="32" y="158">&#8226; content: similarity / perplexity</text>
    <text x="32" y="173">&#8226; sequence: canonical vs shuffled order</text>
    <text x="32" y="188">&#8226; chronology: pre- vs post-cutoff</text>
  </g>

  <!-- EAL break arrow across detection -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="14" y1="232" x2="262" y2="232" stroke-width="2" stroke-dasharray="5 3"/>
    <polygon points="266,232 258,228 258,236" stroke="none"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="140" y="226" font-family="Spectral, serif" font-size="9.5" font-style="italic" text-anchor="middle">EAL: rephrase during fine-tune</text>
    <text x="140" y="248" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">+15% score, evades every detector above</text>
  </g>

  <!-- divider -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1" stroke-dasharray="2 3"><line x1="290" y1="36" x2="290" y2="300"/></g>

  <!-- Mitigation: three families -->
  <g class="blueprint-tint" fill="currentColor"><rect x="312" y="40" width="236" height="58" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="312" y="40" width="236" height="58" rx="6" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="324" y="58" font-family="Spectral, serif" font-size="11" font-style="italic">Data curation</text></g>
  <g class="muted" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="8">
    <text x="324" y="74">&#8226; private (encrypt / confidential compute)</text>
    <text x="324" y="89">&#8226; dynamic (LatestEval, LiveCodeBench)</text>
  </g>

  <g class="blueprint-tint" fill="currentColor"><rect x="312" y="108" width="236" height="58" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="312" y="108" width="236" height="58" rx="6" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="324" y="126" font-family="Spectral, serif" font-size="11" font-style="italic">Data refactoring</text></g>
  <g class="muted" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="8">
    <text x="324" y="142">&#8226; regenerate (EvoEval &#8722;39.4%, DyVal2)</text>
    <text x="324" y="157">&#8226; content filtering (C4 audit)</text>
  </g>

  <g class="blueprint-tint" fill="currentColor"><rect x="312" y="176" width="236" height="58" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="312" y="176" width="236" height="58" rx="6" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="324" y="194" font-family="Spectral, serif" font-size="11" font-style="italic">Benchmark-free</text></g>
  <g class="muted" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="8">
    <text x="324" y="210">&#8226; LLM-as-judge (TreeEval)</text>
    <text x="324" y="225">&#8226; human (Chatbot Arena, 240K votes)</text>
  </g>
  <!-- caveat tag on benchmark-free -->
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.2"><rect x="338" y="244" width="184" height="22" rx="11"/></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="430" y="259" font-family="Spectral, serif" font-size="9" font-style="italic" text-anchor="middle">the judge is contaminable too</text></g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="296" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">you cannot audit your way to a clean number &#8212; you architect the leak out</text></g>
</svg>

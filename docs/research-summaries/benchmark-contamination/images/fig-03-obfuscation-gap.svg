<svg viewBox="0 0 560 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A before/after bar chart. HumanEval pass rate at full height; an arrow labelled surface-only transform drops it 39.4 percent to a shorter bar. The dropped portion is shaded and labelled was retrieval all along; the remainder is labelled reasoning that survives relabeling. A side note links to Mystery Wumpus and Blocksworld to Mystery-BW.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.10); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.10); }
    .sage-tint      { color: rgba(79, 107, 63, 0.12); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.14); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.16); }
      .sage-tint      { color: rgba(177, 201, 140, 0.16); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor"><text x="200" y="20" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">hold the structure, change the surface</text></g>

  <!-- baseline -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1"><line x1="60" y1="210" x2="400" y2="210"/></g>

  <!-- BEFORE bar (full height) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="90" y="62" width="80" height="148"/></g>
  <g class="blueprint" stroke="currentColor" fill="none" stroke-width="1.4"><rect x="90" y="62" width="80" height="148"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="130" y="228" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">original</text>
    <text x="130" y="240" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">HumanEval</text></g>

  <!-- AFTER bar: lower portion (reasoning survives) + shaded dropped portion -->
  <!-- surviving (reasoning) -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="290" y="122" width="80" height="88"/></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.4"><rect x="290" y="122" width="80" height="88"/></g>
  <!-- dropped (retrieval) hatched outline above -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="290" y="62" width="80" height="60"/></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.2" stroke-dasharray="4 3"><rect x="290" y="62" width="80" height="60"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="330" y="228" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">relabelled</text>
    <text x="330" y="240" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">(EvoEval)</text></g>

  <!-- drop arrow -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="180" y1="78" x2="284" y2="78" stroke-width="1.5"/>
    <polygon points="288,78 280,74 280,82" stroke="none"/>
    <text x="232" y="56" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">surface-only transform</text>
    <text x="232" y="70" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">&#8722;39.4%</text>
  </g>

  <!-- labels on after bar -->
  <g class="oxblood" stroke="none" fill="currentColor"><text x="378" y="94" font-family="Spectral, serif" font-size="8.5" font-style="italic">was retrieval</text>
    <text x="378" y="106" font-family="Spectral, serif" font-size="8.5" font-style="italic">all along</text></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="378" y="166" font-family="Spectral, serif" font-size="8.5" font-style="italic">reasoning that</text>
    <text x="378" y="178" font-family="Spectral, serif" font-size="8.5" font-style="italic">survives relabeling</text></g>

  <!-- side note -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1" stroke-dasharray="2 3"><line x1="468" y1="50" x2="468" y2="220"/></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="478" y="64" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.06em">SAME INSTRUMENT</text></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="9">
    <text x="478" y="86">EvoEval &#8722;39.4%</text>
    <text x="478" y="104">DyVal2 transforms</text>
    <text x="478" y="122">name-cloze</text>
    <text x="478" y="140">Blocksworld</text>
    <text x="478" y="153" font-family="JetBrains Mono, monospace" font-size="8" class="muted">&#8594; Mystery-BW</text>
    <text x="478" y="174" class="blueprint" font-style="italic">Wumpus</text>
    <text x="478" y="187" font-family="JetBrains Mono, monospace" font-size="8" class="blueprint">&#8594; Mystery Wumpus</text>
  </g>

  <g class="muted" stroke="none" fill="currentColor"><text x="200" y="262" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">the drop is the measurement: data regeneration used as contamination detection</text></g>
</svg>

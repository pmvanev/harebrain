<svg viewBox="0 0 560 322" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two-column mapping: BDC survey constructs on the left in oxblood map by dashed arrows to wumpus and harebrain constructs on the right in blueprint.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="oxblood" stroke="none" fill="currentColor"><text x="120" y="24" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">BDC survey</text></g>
  <g class="blueprint" stroke="none" fill="currentColor"><text x="440" y="24" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">wumpus / harebrain</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="24" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">built in</text></g>

  <!-- Row 1 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="40" width="208" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="40" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="61" font-family="Spectral, serif" font-size="11" text-anchor="middle">dynamic benchmark (fresh)</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="330" y="40" width="208" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="330" y="40" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="61" font-family="Spectral, serif" font-size="11" text-anchor="middle">seeded MPL &#8212; never-trained seed</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="232" y1="57" x2="328" y2="57" stroke-dasharray="3 3"/></g>

  <!-- Row 2 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="84" width="208" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="84" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="105" font-family="Spectral, serif" font-size="11" text-anchor="middle">data regeneration (EvoEval)</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="330" y="84" width="208" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="330" y="84" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="105" font-family="Spectral, serif" font-size="11" text-anchor="middle">Mystery Wumpus &#8212; relabelled surface</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="232" y1="101" x2="328" y2="101" stroke-dasharray="3 3"/></g>

  <!-- Row 3 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="128" width="208" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="128" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="149" font-family="Spectral, serif" font-size="11" text-anchor="middle">obfuscation gap as detection</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="330" y="128" width="208" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="330" y="128" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="149" font-family="Spectral, serif" font-size="11" text-anchor="middle">Wumpus &#8722; Mystery gap, on demand</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="232" y1="145" x2="328" y2="145" stroke-dasharray="3 3"/></g>

  <!-- Row 4 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="172" width="208" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="172" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="193" font-family="Spectral, serif" font-size="11" text-anchor="middle">reproducibility substrate</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="330" y="172" width="208" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="330" y="172" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="193" font-family="Spectral, serif" font-size="11" text-anchor="middle">append-only JSONL ledger</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="232" y1="189" x2="328" y2="189" stroke-dasharray="3 3"/></g>

  <!-- Row 5 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="216" width="208" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="216" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="237" font-family="Spectral, serif" font-size="11" text-anchor="middle">&#8220;the judge is contaminable&#8221;</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="330" y="216" width="208" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="330" y="216" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="237" font-family="Spectral, serif" font-size="11" text-anchor="middle">validated judge, not trusted</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="232" y1="233" x2="328" y2="233" stroke-dasharray="3 3"/></g>

  <!-- Row 6 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="260" width="208" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="260" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="281" font-family="Spectral, serif" font-size="11" text-anchor="middle">label-level leak, easy to catch</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="330" y="260" width="208" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="330" y="260" width="208" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="281" font-family="Spectral, serif" font-size="11" text-anchor="middle">oracle ground truth, never shown</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="232" y1="277" x2="328" y2="277" stroke-dasharray="3 3"/></g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="312" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">the fences the survey reaches after detection fails are the engine's defaults</text></g>
</svg>

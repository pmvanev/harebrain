<svg width="200" height="58" viewBox="0 0 200 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgentOS glyph: a single natural-language port feeding an agent kernel that fans out to three skill modules, with a personal knowledge graph beneath">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- single NL port -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="4" y="18" width="22" height="22" rx="11"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="4" y="18" width="22" height="22" rx="11" stroke-width="1.4" fill="none"/>
    <text x="15" y="33" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" stroke="none">&#x201C;</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="15" y="13" font-family="ui-monospace, monospace" font-size="6" text-anchor="middle" letter-spacing="0.08em">PORT</text>
  </g>
  <!-- intent arrow into kernel -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="27" y1="29" x2="50" y2="29" stroke-width="1.3"/>
    <polygon points="53,29 47,26 47,32" stroke="none"/>
  </g>
  <!-- agent kernel disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="80" cy="29" rx="27" ry="14"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="80" cy="29" rx="27" ry="14" stroke-width="1.4" fill="none"/>
    <text x="80" y="32" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" letter-spacing="0.06em" stroke="none">KERNEL</text>
  </g>
  <!-- fan-out to three skills -->
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <line x1="108" y1="22" x2="150" y2="13" stroke-width="1.1"/>
    <line x1="108" y1="29" x2="150" y2="29" stroke-width="1.1"/>
    <line x1="108" y1="36" x2="150" y2="45" stroke-width="1.1"/>
  </g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="151" y="7"  width="14" height="11" rx="2" stroke-width="1.2" fill="none"/>
    <rect x="151" y="23" width="14" height="11" rx="2" stroke-width="1.2" fill="none"/>
    <rect x="151" y="39" width="14" height="11" rx="2" stroke-width="1.2" fill="none"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="172" y="31" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.06em">SKILLS</text>
  </g>
  <!-- personal knowledge graph beneath (dashed up-link) -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="80" y1="43" x2="80" y2="51" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="68" cy="53" r="2.2" stroke-width="1" fill="none"/>
    <circle cx="80" cy="55" r="2.2" stroke-width="1" fill="none"/>
    <circle cx="92" cy="53" r="2.2" stroke-width="1" fill="none"/>
    <line x1="70" y1="52" x2="78" y2="55" stroke-width="0.8"/>
    <line x1="82" y1="55" x2="90" y2="52" stroke-width="0.8"/>
  </g>
</svg>

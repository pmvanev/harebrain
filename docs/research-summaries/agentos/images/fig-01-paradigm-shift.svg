<svg viewBox="0 0 620 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Layered comparison of a legacy OS stack against an AgentOS stack, five layers swapped one for one: GUI desktop becomes a single natural-language port, isolated apps become skill modules, process scheduler becomes the agent kernel, syscalls become MCP and a semantic API, and physical hardware drivers become the legacy kernel demoted to invisible infrastructure.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.12); }
    }
  </style>

  <!-- column headers -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="150" y="26" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">Legacy OS</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="470" y="26" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">AgentOS</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="26" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">&#x21D2;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="30" y1="36" x2="590" y2="36" stroke-width="1"/>
  </g>

  <!-- layer labels (center spine) -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="63"  font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">HCI</text>
    <text x="310" y="123" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">APP</text>
    <text x="310" y="183" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">CORE</text>
    <text x="310" y="243" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">SYSCALL</text>
    <text x="310" y="303" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">HW</text>
  </g>

  <!-- ===== LEGACY (left, oxblood) ===== -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="30" y="48"  width="240" height="40" rx="5"/>
    <rect x="30" y="108" width="240" height="40" rx="5"/>
    <rect x="30" y="168" width="240" height="40" rx="5"/>
    <rect x="30" y="228" width="240" height="40" rx="5"/>
    <rect x="30" y="288" width="240" height="40" rx="5"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="30" y="48"  width="240" height="40" rx="5" stroke-width="1.2" fill="none"/>
    <rect x="30" y="108" width="240" height="40" rx="5" stroke-width="1.2" fill="none"/>
    <rect x="30" y="168" width="240" height="40" rx="5" stroke-width="1.2" fill="none"/>
    <rect x="30" y="228" width="240" height="40" rx="5" stroke-width="1.2" fill="none"/>
    <rect x="30" y="288" width="240" height="40" rx="5" stroke-width="1.2" fill="none"/>
    <text x="44" y="72"  font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">GUI / desktop window manager</text>
    <text x="44" y="132" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">isolated third-party apps</text>
    <text x="44" y="192" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">process &amp; memory scheduler</text>
    <text x="44" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">syscalls / POSIX</text>
    <text x="44" y="312" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">physical hardware drivers</text>
  </g>

  <!-- swap arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="272" y1="68"  x2="348" y2="68"  stroke-width="1" stroke-dasharray="3 3"/><polygon points="348,68 342,65 342,71" stroke="none"/>
    <line x1="272" y1="128" x2="348" y2="128" stroke-width="1" stroke-dasharray="3 3"/><polygon points="348,128 342,125 342,131" stroke="none"/>
    <line x1="272" y1="188" x2="348" y2="188" stroke-width="1" stroke-dasharray="3 3"/><polygon points="348,188 342,185 342,191" stroke="none"/>
    <line x1="272" y1="248" x2="348" y2="248" stroke-width="1" stroke-dasharray="3 3"/><polygon points="348,248 342,245 342,251" stroke="none"/>
    <line x1="272" y1="308" x2="348" y2="308" stroke-width="1" stroke-dasharray="3 3"/><polygon points="348,308 342,305 342,311" stroke="none"/>
  </g>

  <!-- ===== AGENTOS (right, blueprint; bottom layer sage = demoted) ===== -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <rect x="350" y="48"  width="240" height="40" rx="5"/>
    <rect x="350" y="108" width="240" height="40" rx="5"/>
    <rect x="350" y="168" width="240" height="40" rx="5"/>
    <rect x="350" y="228" width="240" height="40" rx="5"/>
  </g>
  <g class="sage-tint" stroke="none" fill="currentColor">
    <rect x="350" y="288" width="240" height="40" rx="5"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="350" y="48"  width="240" height="40" rx="5" stroke-width="1.2" fill="none"/>
    <rect x="350" y="108" width="240" height="40" rx="5" stroke-width="1.2" fill="none"/>
    <rect x="350" y="168" width="240" height="40" rx="5" stroke-width="1.2" fill="none"/>
    <rect x="350" y="228" width="240" height="40" rx="5" stroke-width="1.2" fill="none"/>
    <text x="364" y="72"  font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">single natural-language port</text>
    <text x="364" y="132" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">user-defined skill modules</text>
    <text x="364" y="186" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">agent kernel</text>
    <text x="364" y="200" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">intent parser &#183; coordinator &#183; LLM scheduler</text>
    <text x="364" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">MCP / semantic API</text>
  </g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="350" y="288" width="240" height="40" rx="5" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <text x="364" y="306" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">legacy OS kernel</text>
    <text x="364" y="320" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">demoted to invisible infrastructure</text>
  </g>

  <!-- footer caption -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="30" y1="360" x2="590" y2="360" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="380" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">five layers swapped one-for-one &#183; the old kernel survives as plumbing the agent drives through MCP</text>
  </g>
</svg>

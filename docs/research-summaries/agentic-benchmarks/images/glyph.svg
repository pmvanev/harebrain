<svg width="216" height="60" viewBox="0 0 216 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ABC glyph: an agent feeds a task outcome into an evaluation checklist; a magnifier catches a broken check.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- agent disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><ellipse cx="24" cy="30" rx="20" ry="12"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="24" cy="30" rx="20" ry="12" stroke-width="1.4" fill="none"/>
    <text x="24" y="33" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em" stroke="none">agent</text>
  </g>
  <!-- arrow -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="45" y1="30" x2="64" y2="30" stroke-width="1.2"/>
    <polygon points="67,30 61,27 61,33" stroke="none"/>
  </g>
  <!-- checklist (evaluation) -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="70" y="9" width="64" height="42" rx="4"/></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.4"><rect x="70" y="9" width="64" height="42" rx="4"/></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1">
    <line x1="92" y1="19" x2="127" y2="19"/>
    <line x1="92" y1="30" x2="127" y2="30"/>
    <line x1="92" y1="41" x2="127" y2="41"/>
  </g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="77,19 80,22 85,15"/>
    <polyline points="77,30 80,33 85,26"/>
  </g>
  <!-- broken check (oxblood cross) on last row -->
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round">
    <line x1="77" y1="38" x2="85" y2="45"/><line x1="85" y1="38" x2="77" y2="45"/>
  </g>
  <!-- magnifier over the broken check -->
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.7">
    <circle cx="150" cy="34" r="11"/>
    <line x1="158" y1="42" x2="168" y2="52" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="184" y="37" font-family="Fraunces, serif" font-style="italic" font-size="12">ABC</text>
  </g>
</svg>

<svg viewBox="0 0 560 366" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two-column mapping: CollabEval constructs on the left in oxblood map by dashed arrows to harebrain constructs on the right in blueprint.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="oxblood" stroke="none" fill="currentColor"><text x="120" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">CollabEval</text></g>
  <g class="blueprint" stroke="none" fill="currentColor"><text x="440" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">harebrain</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="22" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">wires</text></g>

  <!-- Row 1 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="14" y="34" width="224" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="14" y="34" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="54" font-family="Spectral, serif" font-size="10" text-anchor="middle">three-phase evaluation pipeline</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="322" y="34" width="224" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="322" y="34" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="54" font-family="Spectral, serif" font-size="10" text-anchor="middle">a bounded HSM over the soft panel</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="240" y1="50" x2="320" y2="50" stroke-dasharray="3 3"/></g>

  <!-- Row 2 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="14" y="74" width="224" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="14" y="74" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="94" font-family="Spectral, serif" font-size="10" text-anchor="middle">consensus check + early exit</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="322" y="74" width="224" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="322" y="74" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="94" font-family="Spectral, serif" font-size="10" text-anchor="middle">a guarded transition — skip rounds you don't need</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="240" y1="90" x2="320" y2="90" stroke-dasharray="3 3"/></g>

  <!-- Row 3 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="14" y="114" width="224" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="14" y="114" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="134" font-family="Spectral, serif" font-size="10" text-anchor="middle">shared confidence + justifications</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="322" y="114" width="224" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="322" y="114" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="134" font-family="Spectral, serif" font-size="10" text-anchor="middle">the typed blackboard the panel writes</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="240" y1="130" x2="320" y2="130" stroke-dasharray="3 3"/></g>

  <!-- Row 4 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="14" y="154" width="224" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="14" y="154" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="174" font-family="Spectral, serif" font-size="10" text-anchor="middle">heterogeneous evaluator models</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="322" y="154" width="224" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="322" y="154" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="174" font-family="Spectral, serif" font-size="10" text-anchor="middle">decorrelated brains — the active ingredient</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="240" y1="170" x2="320" y2="170" stroke-dasharray="3 3"/></g>

  <!-- Row 5 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="14" y="194" width="224" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="14" y="194" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="214" font-family="Spectral, serif" font-size="10" text-anchor="middle">strong final judge on deadlock</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="322" y="194" width="224" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="322" y="194" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="214" font-family="Spectral, serif" font-size="10" text-anchor="middle">escalate to the oracle / hard critic</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="240" y1="210" x2="320" y2="210" stroke-dasharray="3 3"/></g>

  <!-- Row 6 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="14" y="234" width="224" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="14" y="234" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="254" font-family="Spectral, serif" font-size="10" text-anchor="middle">randomly shuffled evaluator order</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="322" y="234" width="224" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="322" y="234" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="254" font-family="Spectral, serif" font-size="10" text-anchor="middle">a guard against ordering bias (Sage's IPI)</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="240" y1="250" x2="320" y2="250" stroke-dasharray="3 3"/></g>

  <!-- Row 7 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="14" y="274" width="224" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="14" y="274" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="294" font-family="Spectral, serif" font-size="10" text-anchor="middle">collaboration beats debate (Fig. 5)</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="322" y="274" width="224" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="322" y="274" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="294" font-family="Spectral, serif" font-size="10" text-anchor="middle">no adversarial persuasion — standing rule</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="240" y1="290" x2="320" y2="290" stroke-dasharray="3 3"/></g>

  <!-- Row 8 -->
  <g class="oxblood-tint" fill="currentColor"><rect x="14" y="314" width="224" height="32" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="14" y="314" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="126" y="334" font-family="Spectral, serif" font-size="10" text-anchor="middle">robust when one model is weak</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="322" y="314" width="224" height="32" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="322" y="314" width="224" height="32" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="434" y="334" font-family="Spectral, serif" font-size="10" text-anchor="middle">the cage extracts signal — brain × cage</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="240" y1="330" x2="320" y2="330" stroke-dasharray="3 3"/></g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="360" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">the soft-critic panel rendered as a guarded HSM — but balance is not soundness; the final judge should be the oracle</text></g>
</svg>

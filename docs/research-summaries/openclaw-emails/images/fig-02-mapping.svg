<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping the OpenClaw incident (left, oxblood) onto harebrain primitives (right, blueprint): a safety rule living in volatile context maps to a transition guard outside the model; compaction dropping the rule maps to a pinned Manifest fact that cannot be summarized away; the ignored remote stop maps to a HALT state the chart can always reach; full delete permission maps to a bounded action surface; and breaking at production scale maps to a cage invariant to context length.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="oxblood" stroke="none" fill="currentColor"><text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">OpenClaw incident</text></g>
  <g class="blueprint" stroke="none" fill="currentColor"><text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text></g>
  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/></g>

  <!-- Row 1 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="60" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">safety rule in volatile context</text>
    <text x="30" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">&#8220;suggest, don&#8217;t action&#8221; as a token</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="60" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">guard outside the model</text>
    <text x="370" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">delete edge gated by the chart, not a prompt</text>
  </g>

  <!-- Row 2 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="118" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">compaction drops the rule</text>
    <text x="30" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">summarized away near capacity</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="118" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">pinned Manifest fact</text>
    <text x="370" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">held outside the window; never summarized</text>
  </g>

  <!-- Row 3 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="176" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">remote &#8220;stop&#8221; ignored</text>
    <text x="30" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">halt lost the priority contest</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="176" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">HALT always reachable</text>
    <text x="370" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">an edge from every state, highest priority</text>
  </g>

  <!-- Row 4 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="234" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">unrestricted delete permission</text>
    <text x="30" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">no least-privilege scope</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="234" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">bounded action surface</text>
    <text x="370" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">delete reachable only via a confirm state</text>
  </g>

  <!-- Row 5 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="292" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">fine on a toy inbox, broke at scale</text>
    <text x="30" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the real inbox triggered compaction</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="292" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">cage invariant to context length</text>
    <text x="370" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">guards don&#8217;t live in the window at all</text>
  </g>

  <!-- arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="82"  x2="358" y2="82"  stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,82 352,79 352,85" stroke="none"/>
    <line x1="262" y1="140" x2="358" y2="140" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,140 352,137 352,143" stroke="none"/>
    <line x1="262" y1="198" x2="358" y2="198" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,198 352,195 352,201" stroke="none"/>
    <line x1="262" y1="256" x2="358" y2="256" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,256 352,253 352,259" stroke="none"/>
    <line x1="262" y1="314" x2="358" y2="314" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,314 352,311 352,317" stroke="none"/>
  </g>

  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="360" x2="580" y2="360" stroke-width="1"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="380" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Ding&#8217;s lesson is harebrain&#8217;s thesis verbatim: safety must be encoded in architecture, not prompts</text>
  </g>
</svg>

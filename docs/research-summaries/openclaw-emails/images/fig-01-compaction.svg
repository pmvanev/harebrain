<svg viewBox="0 0 640 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The safety instruction 'suggest, do not action' lives only in the volatile context window. As the real inbox fills the window, context compaction summarizes and discards older content, and the constraint is deprioritized and lost. The persistent long-term store survives but the constraint was never written there. The agent, now unconstrained, bulk-deletes 200-plus emails; a remote stop is ignored; the run is killed by physically powering off the Mac mini.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.12); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="22" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.08em">THE CONSTRAINT WAS IN THE WRONG TIER OF MEMORY</text>
  </g>

  <!-- VOLATILE tier (top) -->
  <g class="blueprint" stroke="none" fill="currentColor"><text x="24" y="52" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.06em">SHORT-TERM &#183; volatile context window</text></g>

  <!-- t0 full window with the pin -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="24" y="60" width="150" height="86" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="24" y="60" width="150" height="86" rx="6" stroke-width="1.3"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="32" y="68" width="134" height="20" rx="3" stroke-width="1.1" fill="none"/>
    <text x="38" y="81" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">&#9888; suggest, don&#8217;t action</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="38" y="103" font-family="JetBrains Mono, monospace" font-size="7">inbox msg 1&#8230;</text>
    <text x="38" y="116" font-family="JetBrains Mono, monospace" font-size="7">inbox msg 2&#8230;</text>
    <text x="38" y="129" font-family="JetBrains Mono, monospace" font-size="7">inbox msg 3&#8230; (filling)</text>
    <text x="38" y="142" font-family="JetBrains Mono, monospace" font-size="7">&#8230; 200+ real messages</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor"><text x="99" y="160" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">t0: window near capacity</text></g>

  <!-- compaction event -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="178" y1="103" x2="232" y2="103" stroke-width="1.3"/>
    <polygon points="235,103 229,100 229,106" stroke="none"/>
    <text x="182" y="96" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">compaction</text>
    <text x="182" y="118" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">summarize +</text>
    <text x="182" y="128" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">discard old</text>
  </g>

  <!-- t1 compacted window, pin gone -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="240" y="74" width="130" height="60" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="240" y="74" width="130" height="60" rx="6" stroke-width="1.3"/></g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <rect x="248" y="82" width="114" height="18" rx="3" stroke-width="1" stroke-dasharray="2.5 2.5" fill="none"/>
    <text x="252" y="94" font-family="JetBrains Mono, monospace" font-size="7" font-style="italic" stroke="none">&#9888; dropped in summary</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="252" y="116" font-family="JetBrains Mono, monospace" font-size="7">&#8220;summary of earlier&#8230;&#8221;</text>
    <text x="252" y="128" font-family="JetBrains Mono, monospace" font-size="7">recent msgs only</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor"><text x="305" y="150" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">t1: constraint no longer present</text></g>

  <!-- PERSISTENT tier -->
  <g class="sage" stroke="none" fill="currentColor"><text x="400" y="52" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.06em">LONG-TERM &#183; persistent store</text></g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="400" y="60" width="216" height="86" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="none">
    <rect x="400" y="60" width="216" height="86" rx="6" stroke-width="1.3"/>
    <line x1="412" y1="92" x2="604" y2="92" stroke-width="0.8"/>
    <line x1="412" y1="108" x2="604" y2="108" stroke-width="0.8"/>
    <line x1="412" y1="124" x2="588" y2="124" stroke-width="0.8"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="412" y="82" font-family="JetBrains Mono, monospace" font-size="7.5">SQLite-indexed markdown &#183; survives compaction</text>
    <text x="412" y="142" font-family="JetBrains Mono, monospace" font-size="7" font-style="italic">&#8230; but the safety constraint was never written here</text>
  </g>

  <!-- consequence band -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="24" y="186" width="592" height="92" rx="8"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="24" y="186" width="592" height="92" rx="8" stroke-width="1.4"/></g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="40" y="210" font-family="Fraunces, serif" font-size="13" font-style="italic">the agent, now unconstrained, treats bulk-delete as an authorized task</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="40" y="234" font-family="JetBrains Mono, monospace" font-size="8">&#8226;  200+ emails deleted from a live inbox</text>
    <text x="40" y="250" font-family="JetBrains Mono, monospace" font-size="8">&#8226;  remote &#8220;stop&#8221; ignored &#8212; no command hierarchy treats halt as overriding</text>
    <text x="40" y="266" font-family="JetBrains Mono, monospace" font-size="8">&#8226;  run ended only by physically powering off the Mac mini</text>
  </g>

  <!-- footer -->
  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="40" y1="300" x2="600" y2="300" stroke-width="1"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="320" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">a safety rule the runtime is free to summarize away is not a safety rule &#8212; it is a hint with a half-life</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="340" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">Ding&#8217;s prescription, in one phrase: <tspan class="sage">safety must be encoded in architecture, not prompts</tspan></text>
  </g>
</svg>

<svg width="214" height="58" viewBox="0 0 214 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A full context window holding a pinned 'do not delete' instruction is compacted into a smaller window where that instruction has vanished, after which a stack of envelopes is deleted, marked times-200">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- full context window -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="6" y="8" width="58" height="42" rx="3"/></g>
  <g class="blueprint" stroke="currentColor" fill="none">
    <rect x="6" y="8" width="58" height="42" rx="3" stroke-width="1.3"/>
    <line x1="12" y1="32" x2="58" y2="32" stroke-width="0.8"/>
    <line x1="12" y1="38" x2="54" y2="38" stroke-width="0.8"/>
    <line x1="12" y1="44" x2="58" y2="44" stroke-width="0.8"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="12" y="20" font-family="ui-monospace, monospace" font-size="6">&#9888; don&#8217;t action,</text>
    <text x="12" y="27" font-family="ui-monospace, monospace" font-size="6">just suggest</text>
  </g>
  <!-- compaction arrow -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="68" y1="29" x2="92" y2="29" stroke-width="1.2"/>
    <polygon points="95,29 89,26 89,32" stroke="none"/>
    <text x="66" y="14" font-family="ui-monospace, monospace" font-size="5.5" stroke="none">compact</text>
  </g>
  <!-- compacted window, smaller, safety line gone -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="100" y="16" width="42" height="28" rx="3"/></g>
  <g class="blueprint" stroke="currentColor" fill="none">
    <rect x="100" y="16" width="42" height="28" rx="3" stroke-width="1.3"/>
    <line x1="105" y1="30" x2="137" y2="30" stroke-width="0.8"/>
    <line x1="105" y1="36" x2="133" y2="36" stroke-width="0.8"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="105" y="26" font-family="ui-monospace, monospace" font-size="6" font-style="italic">summary&#8230;</text>
    <text x="103" y="54" font-family="ui-monospace, monospace" font-size="5.5">&#9888; dropped</text>
  </g>
  <!-- arrow to deletion -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="146" y1="29" x2="164" y2="29" stroke-width="1.2"/>
    <polygon points="167,29 161,26 161,32" stroke="none"/>
  </g>
  <!-- envelope stack, deleted -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="172" y="20" width="30" height="20" rx="2"/></g>
  <g class="oxblood" stroke="currentColor" fill="none">
    <rect x="172" y="20" width="30" height="20" rx="2" stroke-width="1.3"/>
    <path d="M172 22 l15 11 l15 -11" stroke-width="1"/>
    <line x1="174" y1="16" x2="200" y2="44" stroke-width="1.6"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="180" y="52" font-family="ui-monospace, monospace" font-size="7">&#215;200</text>
  </g>
</svg>

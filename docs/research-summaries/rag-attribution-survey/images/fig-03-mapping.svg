<svg viewBox="0 0 620 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping the RAG-attribution survey constructs (left, oxblood) onto harebrain primitives (right, blueprint): retrieved references onto the cage feeding evidence to the leaf; T2 reference identification onto a transition guard reading the blackboard; T4 response correction onto EDD adversarial review; the attribution check onto the seam returning a typed sourced verdict; the four-module pipeline onto the generate-test-critique loop; LLM-as-retrieval-judge onto the soft-critic circularity warning; query refining onto AI-director query shaping.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <!-- column headers -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">RAG attribution</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/>
  </g>

  <!-- Row 1: Retrieved references <-> cage feeds evidence to the leaf -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="60" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">retrieved references R_final</text>
    <text x="30" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">external docs pulled per query</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="60" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the cage feeds the leaf</text>
    <text x="370" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">evidence on the blackboard before the call</text>
  </g>

  <!-- Row 2: T2 reference identification <-> transition guard -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="118" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">T2 reference identification</text>
    <text x="30" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">keep only verifiable refs</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="118" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">transition guard (hard)</text>
    <text x="370" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">when [supported(claim)] =&gt; emit</text>
  </g>

  <!-- Row 3: T4 response correction <-> EDD adversarial review -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="176" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">T4 response correction</text>
    <text x="30" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">NLI / self-critique on the answer</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="176" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">EDD adversarial review</text>
    <text x="370" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">soft critic on each transition</text>
  </g>

  <!-- Row 4: Attribution check <-> the seam, typed sourced verdict -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="234" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">attribution itself</text>
    <text x="30" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">claim &#8594; cited source span</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="234" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the seam</text>
    <text x="370" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">host import &#8594; typed, sourced verdict</text>
  </g>

  <!-- Row 5: four-module pipeline <-> Generate-Test-Critique loop -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="292" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">T1&#8594;T2&#8594;T3&#8594;T4 pipeline</text>
    <text x="30" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">refine &#183; identify &#183; prompt &#183; correct</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="292" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">Generate-Test-Critique</text>
    <text x="370" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the LLM-Modulo loop, on claims</text>
  </g>

  <!-- Row 6: LLM-as-retrieval-judge <-> soft-critic circularity -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="350" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="350" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="368" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">LLM-as-retrieval-judge</text>
    <text x="30" y="385" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">same model class checks itself</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="350" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="350" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="368" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">soft-critic circularity</text>
    <text x="370" y="385" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">no soundness to inherit &#8212; mark it</text>
  </g>

  <!-- Row 7: T1 query refining <-> AI-director query shaping -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="408" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="408" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="426" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">T1 query refining</text>
    <text x="30" y="443" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">q&#8242; = T(q) before retrieval</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="408" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="408" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="426" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">AI director shapes the call</text>
    <text x="370" y="443" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">outer loop conditions what gets fetched</text>
  </g>

  <!-- connecting arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="82"  x2="358" y2="82"  stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,82 352,79 352,85" stroke="none"/>
    <line x1="262" y1="140" x2="358" y2="140" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,140 352,137 352,143" stroke="none"/>
    <line x1="262" y1="198" x2="358" y2="198" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,198 352,195 352,201" stroke="none"/>
    <line x1="262" y1="256" x2="358" y2="256" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,256 352,253 352,259" stroke="none"/>
    <line x1="262" y1="314" x2="358" y2="314" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,314 352,311 352,317" stroke="none"/>
    <line x1="262" y1="372" x2="358" y2="372" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,372 352,369 352,375" stroke="none"/>
    <line x1="262" y1="430" x2="358" y2="430" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,430 352,427 352,433" stroke="none"/>
  </g>

  <!-- footer caption -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="468" x2="580" y2="468" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="486" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">attribution is the cage's hard critic aimed at claims, not plans &#183; rows 3 &amp; 6 are soft and earn no soundness</text>
  </g>
</svg>

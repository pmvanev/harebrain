<svg width="190" height="58" viewBox="0 0 190 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A query feeds a retriever that pulls evidence from a store; an LLM disc emits a response with an attribution arrow tracing back to the cited source.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- evidence store (left, oxblood = external source side) -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="6" y="14" width="30" height="30" rx="3"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="6" y="14" width="30" height="30" rx="3" stroke-width="1.3" fill="none"/>
    <line x1="6" y1="24" x2="36" y2="24" stroke-width="0.9"/>
    <line x1="6" y1="34" x2="36" y2="34" stroke-width="0.9"/>
    <text x="11" y="11" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.1em" stroke="none">DOCS</text>
  </g>
  <!-- retrieve arrow -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="37" y1="29" x2="56" y2="29" stroke-width="1.2"/>
    <polygon points="59,29 53,26 53,32" stroke="none"/>
  </g>
  <!-- LLM disc (leaf, blueprint = harebrain side) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="84" cy="29" rx="24" ry="13"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="84" cy="29" rx="24" ry="13" stroke-width="1.4" fill="none"/>
    <text x="84" y="32" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle" letter-spacing="0.1em" stroke="none">LLM</text>
  </g>
  <!-- response arrow (top) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="109" y1="20" x2="150" y2="20" stroke-width="1.3"/>
    <polygon points="153,20 147,17 147,23" stroke="none"/>
    <text x="113" y="15" font-family="ui-monospace, monospace" font-size="6.5" letter-spacing="0.3" stroke="none">verdict</text>
  </g>
  <!-- response token (right) -->
  <g class="ink" stroke="currentColor" fill="none">
    <rect x="156" y="13" width="28" height="14" rx="2" stroke-width="1.2"/>
    <line x1="160" y1="20" x2="180" y2="20" stroke-width="0.9"/>
  </g>
  <!-- attribution arrow: dashed, traces the response back to the source -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <path d="M168 28 C 168 46, 30 50, 21 45" stroke-width="1.1" stroke-dasharray="3 3" fill="none"/>
    <polygon points="21,45 28,44 25,49" stroke="none"/>
    <text x="74" y="56" font-family="ui-monospace, monospace" font-size="6.5" letter-spacing="0.3" stroke="none">attributes-to</text>
  </g>
</svg>

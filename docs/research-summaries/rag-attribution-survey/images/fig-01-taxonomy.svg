<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Taxonomy of six RAG hallucination types arranged along the retriever-to-generator axis: outdatedness and unverifiability sit at the retrieval side; overconfidence, context inconsistency, instruction deviation, and reasoning deficiency sit at the generation side. Each type is tagged with the attribution modules T1 through T4 that mitigate it.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.07); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.10); }
    }
  </style>

  <!-- title -->
  <g class="ink" stroke="none" fill="currentColor">
    <text x="320" y="22" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">Six ways RAG hallucinates</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="38" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">failure modes born at the retriever &#8594; generator seam</text>
  </g>

  <!-- the axis: retriever on the left, generator on the right -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="70" x2="600" y2="70" stroke-width="1"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="44" y="64" font-family="JetBrains Mono, monospace" font-size="9">RETRIEVER side &#183; what the cage fetched</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="596" y="64" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="end">GENERATOR side &#183; what the brain wrote</text>
  </g>

  <!-- LEFT GROUP: retrieval-born -->
  <!-- Outdatedness -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="40" y="86" width="250" height="58" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="40" y="86" width="250" height="58" rx="6" stroke-width="1.3" fill="none"/>
    <text x="52" y="106" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">Outdatedness</text>
    <text x="52" y="122" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">was true once, now stale</text>
    <text x="52" y="135" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">fix &#183; T1 query refine, T2 ref ID</text>
  </g>
  <!-- Unverifiability -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="40" y="150" width="250" height="58" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="40" y="150" width="250" height="58" rx="6" stroke-width="1.3" fill="none"/>
    <text x="52" y="170" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">Unverifiability</text>
    <text x="52" y="186" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">no evidence backs the claim</text>
    <text x="52" y="199" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">fix &#183; T2 ref ID, T4 correction</text>
  </g>

  <!-- RIGHT GROUP: generation-born -->
  <!-- Overconfidence -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="350" y="86" width="250" height="58" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="350" y="86" width="250" height="58" rx="6" stroke-width="1.3" fill="none"/>
    <text x="362" y="106" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">Overconfidence</text>
    <text x="362" y="122" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">certainty exceeds evidence</text>
    <text x="362" y="135" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">fix &#183; T3 prompt eng, T4 correction</text>
  </g>
  <!-- Context inconsistency -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="350" y="150" width="250" height="58" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="350" y="150" width="250" height="58" rx="6" stroke-width="1.3" fill="none"/>
    <text x="362" y="170" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">Context inconsistency</text>
    <text x="362" y="186" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">answer contradicts its refs</text>
    <text x="362" y="199" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">fix &#183; T3 prompt eng, T4 correction</text>
  </g>
  <!-- Instruction deviation -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="350" y="214" width="250" height="58" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="350" y="214" width="250" height="58" rx="6" stroke-width="1.3" fill="none"/>
    <text x="362" y="234" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">Instruction deviation</text>
    <text x="362" y="250" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">ignores the user&#8217;s intent</text>
    <text x="362" y="263" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">fix &#183; T1, T2, T3</text>
  </g>
  <!-- Reasoning deficiency -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="350" y="278" width="250" height="58" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="350" y="278" width="250" height="58" rx="6" stroke-width="1.3" fill="none"/>
    <text x="362" y="298" font-family="Fraunces, serif" font-size="12" font-style="italic" stroke="none">Reasoning deficiency</text>
    <text x="362" y="314" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">flawed CoT, error compounds</text>
    <text x="362" y="327" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">fix &#183; T3 prompt eng, T4 correction</text>
  </g>

  <!-- divider note between the two groups -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="320" y="230" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">retrieval</text>
    <text x="320" y="242" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">faults: 2</text>
    <text x="320" y="288" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">generation</text>
    <text x="320" y="300" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">faults: 4</text>
  </g>

  <!-- footer: the harebrain reading -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="360" x2="600" y2="360" stroke-width="1"/>
  </g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="40" y="372" width="560" height="44" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="40" y="372" width="560" height="44" rx="6" stroke-width="1.1" fill="none"/>
    <text x="52" y="390" font-family="Fraunces, serif" font-size="10.5" font-style="italic" stroke="none">harebrain reading</text>
    <text x="52" y="406" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">a blackboard pinned to retrieved refs kills outdatedness + context-inconsistency by construction; the other four still need an explicit critic</text>
  </g>
</svg>

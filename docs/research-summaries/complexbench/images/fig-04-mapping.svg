<svg viewBox="0 0 560 322" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two-column mapping: ComplexBench's composition taxonomy on the left in oxblood maps by dashed arrows to harebrain statechart constructs on the right in blueprint.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="oxblood" stroke="none" fill="currentColor"><text x="124" y="24" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">ComplexBench</text></g>
  <g class="blueprint" stroke="none" fill="currentColor"><text x="436" y="24" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">harebrain</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="24" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">maps to</text></g>

  <!-- Row template: left box, right box, dashed connector. 6 rows starting y=40 step 44 -->
  <!-- 1 And -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="40" width="204" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="40" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="124" y="61" font-family="Spectral, serif" font-size="11" text-anchor="middle">And &#8212; all hold at once</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="334" y="40" width="204" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="334" y="40" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="436" y="61" font-family="Spectral, serif" font-size="11" text-anchor="middle">conjunctive guard / orthogonal regions</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="228" y1="57" x2="332" y2="57" stroke-dasharray="3 3"/></g>

  <!-- 2 Chain -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="84" width="204" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="84" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="124" y="105" font-family="Spectral, serif" font-size="11" text-anchor="middle">Chain &#8212; in dependent order</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="334" y="84" width="204" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="334" y="84" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="436" y="105" font-family="Spectral, serif" font-size="11" text-anchor="middle">guarded sequential transitions</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="228" y1="101" x2="332" y2="101" stroke-dasharray="3 3"/></g>

  <!-- 3 Selection -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="128" width="204" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="128" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="124" y="149" font-family="Spectral, serif" font-size="11" text-anchor="middle">Selection &#8212; condition routes</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="334" y="128" width="204" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="334" y="128" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="436" y="149" font-family="Spectral, serif" font-size="11" text-anchor="middle">conditional transition <tspan font-family="JetBrains Mono, monospace" font-size="9">[cond]</tspan></text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="228" y1="145" x2="332" y2="145" stroke-dasharray="3 3"/></g>

  <!-- 4 Nesting -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="172" width="204" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="172" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="124" y="193" font-family="Spectral, serif" font-size="11" text-anchor="middle">Nesting &#8212; recurse</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="334" y="172" width="204" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="334" y="172" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="436" y="193" font-family="Spectral, serif" font-size="11" text-anchor="middle">hierarchical sub-charts (depth)</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="228" y1="189" x2="332" y2="189" stroke-dasharray="3 3"/></g>

  <!-- 5 DAG -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="216" width="204" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="216" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="124" y="237" font-family="Spectral, serif" font-size="11" text-anchor="middle">dependency-DAG scoring</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="334" y="216" width="204" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="334" y="216" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="436" y="237" font-family="Spectral, serif" font-size="11" text-anchor="middle">topology owns validity, not averaging</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="228" y1="233" x2="332" y2="233" stroke-dasharray="3 3"/></g>

  <!-- 6 RAL -->
  <g class="oxblood-tint" fill="currentColor"><rect x="22" y="260" width="204" height="34" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="260" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="124" y="281" font-family="Spectral, serif" font-size="11" text-anchor="middle">rule-augmented evaluation</text></g>
  <g class="blueprint-tint" fill="currentColor"><rect x="334" y="260" width="204" height="34" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="334" y="260" width="204" height="34" rx="5" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="436" y="281" font-family="Spectral, serif" font-size="11" text-anchor="middle">hard / soft critic split</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="228" y1="277" x2="332" y2="277" stroke-dasharray="3 3"/></g>

  <g class="muted" stroke="none" fill="currentColor"><text x="280" y="312" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">the composition taxonomy is a statechart vocabulary in disguise</text></g>
</svg>

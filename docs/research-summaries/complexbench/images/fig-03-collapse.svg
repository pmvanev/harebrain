<svg viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart: GPT-3.5-Turbo's score collapses as compositions stack — from 0.845 on a single And to 0.083 once an And, a Chain, and two Selections are nested together.">
  <style>
    .ink         { color: #1a1810; }
    .muted       { color: #5d553f; }
    .rule-soft   { color: #d4c8a4; }
    .oxblood     { color: #8b1f2c; }
    .blueprint   { color: #1f4f7a; }
    .bar-hi      { color: rgba(31, 79, 122, 0.55); }
    .bar-lo      { color: rgba(139, 31, 44, 0.55); }
    @media (prefers-color-scheme: dark) {
      .ink       { color: #ede2c4; }
      .muted     { color: #a89c7d; }
      .rule-soft { color: #3a3327; }
      .oxblood   { color: #e09098; }
      .blueprint { color: #88c0e8; }
      .bar-hi    { color: rgba(136, 192, 232, 0.55); }
      .bar-lo    { color: rgba(224, 144, 152, 0.60); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="18" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">STACK THE COMPOSITIONS, WATCH IT FALL &#183; GPT-3.5-TURBO, DRFR</text>
  </g>

  <!-- axis -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1"><line x1="210" y1="34" x2="210" y2="206"/></g>

  <!-- bars: x=210, width = value*360 -->
  <!-- 1 x And 0.845 -->
  <g class="bar-hi" stroke="none" fill="currentColor"><rect x="210" y="40" width="304" height="18" rx="2"/></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="204" y="53" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">1 &#215; And</text></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="520" y="53" font-family="JetBrains Mono, monospace" font-size="8.5">.845</text></g>
  <!-- 1 x Chain 0.686 -->
  <g class="bar-hi" stroke="none" fill="currentColor"><rect x="210" y="66" width="247" height="18" rx="2"/></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="204" y="79" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">1 &#215; Chain</text></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="463" y="79" font-family="JetBrains Mono, monospace" font-size="8.5">.686</text></g>
  <!-- 1 x Selection 0.682 -->
  <g class="bar-hi" stroke="none" fill="currentColor"><rect x="210" y="92" width="246" height="18" rx="2"/></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="204" y="105" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">1 &#215; Selection</text></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="462" y="105" font-family="JetBrains Mono, monospace" font-size="8.5">.682</text></g>
  <!-- 2 x Selection 0.377 -->
  <g class="bar-lo" stroke="none" fill="currentColor"><rect x="210" y="118" width="136" height="18" rx="2"/></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="204" y="131" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">2 &#215; Selection</text></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="352" y="131" font-family="JetBrains Mono, monospace" font-size="8.5">.377</text></g>
  <!-- Chain + 2 Selection 0.308 -->
  <g class="bar-lo" stroke="none" fill="currentColor"><rect x="210" y="144" width="111" height="18" rx="2"/></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="204" y="157" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">Chain + 2 Sel.</text></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="327" y="157" font-family="JetBrains Mono, monospace" font-size="8.5">.308</text></g>
  <!-- And + Chain + 2 Selection 0.083 -->
  <g class="bar-lo" stroke="none" fill="currentColor"><rect x="210" y="170" width="30" height="18" rx="2"/></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="204" y="183" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">And + Chain + 2 Sel.</text></g>
  <g class="oxblood" stroke="none" fill="currentColor"><text x="246" y="183" font-family="JetBrains Mono, monospace" font-size="8.5">.083</text></g>

  <!-- callout -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="0.8"><line x1="20" y1="200" x2="540" y2="200"/></g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="280" y="218" font-family="Spectral, serif" font-size="10" font-style="italic" text-anchor="middle">Even GPT-4 clears only 14.9% of multi-layer nested Selection under the coherent test.</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="232" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">the model is asked to hold the whole tree in its head &#183; the tree wins</text>
  </g>
</svg>

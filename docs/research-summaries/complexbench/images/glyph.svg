<svg width="216" height="60" viewBox="0 0 216 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ComplexBench glyph: a single instruction node branches into composed constraints — an and-fork, a chain, and a conditional selection.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
    }
  </style>
  <!-- root instruction -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><circle cx="22" cy="30" r="13"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <circle cx="22" cy="30" r="13" stroke-width="1.4" fill="none"/>
    <text x="22" y="33" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" stroke="none">I</text>
  </g>
  <!-- edges out -->
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.2">
    <line x1="35" y1="24" x2="58" y2="12"/>
    <line x1="35" y1="30" x2="58" y2="30"/>
    <line x1="35" y1="36" x2="58" y2="48"/>
  </g>
  <!-- AND fork (sage leaves, top) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <circle cx="64" cy="12" r="5" stroke-width="1.3" fill="none"/>
    <text x="78" y="15" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">&#8743; and</text>
  </g>
  <!-- CHAIN (blueprint nodes, middle) -->
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <circle cx="64" cy="30" r="5" stroke-width="1.3" fill="none"/>
    <line x1="69" y1="30" x2="83" y2="30" stroke-width="1.2"/>
    <polygon points="86,30 81,28 81,32" stroke="none"/>
    <circle cx="91" cy="30" r="5" stroke-width="1.3" fill="none"/>
    <text x="100" y="33" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">&#8594; chain</text>
  </g>
  <!-- SELECTION (oxblood condition, bottom) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="59" y="43" width="10" height="10" rx="2" stroke-width="1.3" fill="none" transform="rotate(45 64 48)"/>
    <line x1="71" y1="48" x2="84" y2="42" stroke-width="1.1"/>
    <line x1="71" y1="48" x2="84" y2="54" stroke-width="1.1" stroke-dasharray="2 2"/>
    <text x="96" y="51" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">&#8230; select</text>
  </g>
  <!-- recursion marker -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="150" y="33" font-family="Fraunces, serif" font-style="italic" font-size="11">&#215; nested</text>
  </g>
</svg>

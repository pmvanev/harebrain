<svg viewBox="0 0 560 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four composition types: And (constraints held simultaneously), Chain (tasks in sequence, each depending on the last), Selection (a condition routes to one branch), and Nested (a branch that itself contains a selection).">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.12); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="18" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">FOUR WAYS TO COMPOSE CONSTRAINTS</text>
  </g>

  <!-- dividers -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="0.8">
    <line x1="140" y1="36" x2="140" y2="206"/>
    <line x1="290" y1="36" x2="290" y2="206"/>
    <line x1="424" y1="36" x2="424" y2="206"/>
  </g>

  <!-- ===== AND (center 72) ===== -->
  <g class="ink" stroke="none" fill="currentColor"><text x="72" y="52" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">And</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="72" y="66" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">all hold at once</text></g>
  <g class="blueprint" stroke="currentColor" fill="none" stroke-width="1.3">
    <circle cx="72" cy="92" r="9"/>
    <line x1="72" y1="101" x2="42" y2="132"/>
    <line x1="72" y1="101" x2="72" y2="132"/>
    <line x1="72" y1="101" x2="102" y2="132"/>
  </g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.3">
    <circle cx="42" cy="142" r="8"/>
    <circle cx="72" cy="142" r="8"/>
    <circle cx="102" cy="142" r="8"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">
    <text x="42" y="145">c&#8321;</text><text x="72" y="145">c&#8322;</text><text x="102" y="145">c&#8323;</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor"><text x="72" y="178" font-family="Spectral, serif" font-size="9" text-anchor="middle">summary in bullets</text><text x="72" y="190" font-family="Spectral, serif" font-size="9" text-anchor="middle"><tspan class="muted">and</tspan> under 100 words</text></g>

  <!-- ===== CHAIN (center 215) ===== -->
  <g class="ink" stroke="none" fill="currentColor"><text x="215" y="52" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">Chain</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="215" y="66" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">in sequence, dependent</text></g>
  <g class="blueprint" stroke="currentColor" fill="none" stroke-width="1.3">
    <circle cx="215" cy="88" r="8"/>
    <circle cx="215" cy="122" r="8"/>
    <circle cx="215" cy="156" r="8"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor" stroke-width="1.3">
    <line x1="215" y1="96" x2="215" y2="111"/><polygon points="215,114 212,108 218,108" stroke="none"/>
    <line x1="215" y1="130" x2="215" y2="145"/><polygon points="215,148 212,142 218,142" stroke="none"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">
    <text x="215" y="91">T&#8321;</text><text x="215" y="125">T&#8322;</text><text x="215" y="159">T&#8323;</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor"><text x="215" y="184" font-family="Spectral, serif" font-size="9" text-anchor="middle">first the year, then the</text><text x="215" y="196" font-family="Spectral, serif" font-size="9" text-anchor="middle">background, then impact</text></g>

  <!-- ===== SELECTION (center 357) ===== -->
  <g class="ink" stroke="none" fill="currentColor"><text x="357" y="52" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">Selection</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="357" y="66" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">a condition routes one branch</text></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.4">
    <rect x="349" y="82" width="16" height="16" rx="2" transform="rotate(45 357 90)"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor"><text x="357" y="93" font-family="JetBrains Mono, monospace" font-size="6.5" text-anchor="middle">cond</text></g>
  <!-- taken branch (solid sage) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor" stroke-width="1.3">
    <line x1="350" y1="98" x2="333" y2="130"/><polygon points="331,133 332,126 337,130" stroke="none"/>
  </g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.4"><circle cx="329" cy="142" r="8"/></g>
  <!-- untaken branch (faded dashed) -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1.2">
    <line x1="364" y1="98" x2="381" y2="130" stroke-dasharray="3 2"/>
    <circle cx="385" cy="142" r="8" stroke-dasharray="3 2"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">
    <text x="329" y="145">B&#8321;</text><text x="385" y="145" class="rule-soft">B&#8322;</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor"><text x="357" y="178" font-family="Spectral, serif" font-size="9" text-anchor="middle">if it has an animal &#8594;</text><text x="357" y="190" font-family="Spectral, serif" font-size="9" text-anchor="middle">English, else Chinese</text></g>

  <!-- ===== NESTED (center 492) ===== -->
  <g class="ink" stroke="none" fill="currentColor"><text x="492" y="52" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">Nested</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="492" y="66" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">a branch holds a selection</text></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.4">
    <rect x="484" y="80" width="14" height="14" rx="2" transform="rotate(45 491 87)"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor" stroke-width="1.2">
    <line x1="486" y1="93" x2="474" y2="112"/><polygon points="472,115 473,108 478,112" stroke="none"/>
    <line x1="496" y1="93" x2="508" y2="112"/><polygon points="510,115 505,111 510,108" stroke="none"/>
  </g>
  <!-- inner selection inside left branch -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="448" y="116" width="52" height="62" rx="5"/></g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1" stroke-dasharray="3 2"><rect x="448" y="116" width="52" height="62" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.3">
    <rect x="468" y="122" width="11" height="11" rx="2" transform="rotate(45 473 128)"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor" stroke-width="1.1">
    <line x1="469" y1="133" x2="461" y2="150"/><polygon points="459,153 460,147 465,150" stroke="none"/>
    <line x1="477" y1="133" x2="485" y2="150"/><polygon points="487,153 482,150 487,147" stroke="none"/>
  </g>
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.2"><circle cx="457" cy="160" r="6"/><circle cx="489" cy="160" r="6"/></g>
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1.2"><circle cx="516" cy="124" r="7" stroke-dasharray="3 2"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="492" y="196" font-family="Spectral, serif" font-size="9" text-anchor="middle">selection within selection</text></g>
</svg>

<svg viewBox="0 0 620 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping OS-Symphony constructs (left, oxblood) onto harebrain primitives (right, blueprint): Orchestrator ↔ LLM at the leaf, milestone-driven long-term memory ↔ blackboard/Manifest, binary milestone marker ↔ per-key decay rule, sliding window ↔ working-memory facts, RMA trajectory reflection ↔ AI director, off-track error types ↔ director interrupts, tool agents ↔ the seam, multimodal searcher ↔ director-triggered tool dispatch, bounded OS action set ↔ the bounded action surface.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <!-- column headers -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">OS-Symphony</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/>
  </g>

  <!-- Row 1 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="56" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="56" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="74" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">Orchestrator</text>
    <text x="30" y="91" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">reads window + reflection, acts</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="56" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="56" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="74" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">LLM at the leaf</text>
    <text x="370" y="91" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">one call, prompt from curated slots</text>
  </g>

  <!-- Row 2 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="108" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="108" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="126" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">milestone LTM  H_long</text>
    <text x="30" y="143" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">summaries + sparse screenshots</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="108" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="108" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="126" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">blackboard / Manifest</text>
    <text x="370" y="143" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">typed durable store w/ retention</text>
  </g>

  <!-- Row 3 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="160" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="160" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="178" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">milestone marker  mⱼ</text>
    <text x="30" y="195" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">binary: retain pixels or drop</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="160" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="160" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="178" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">decay policy (gating mode)</text>
    <text x="370" y="195" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">which facts persist past their step</text>
  </g>

  <!-- Row 4 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="212" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="212" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="230" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">sliding window  H_short</text>
    <text x="30" y="247" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">last K turns of obs/thought/act</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="212" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="212" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="230" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">working-memory facts</text>
    <text x="370" y="247" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">fresh detail, bounded age</text>
  </g>

  <!-- Row 5 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="264" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="264" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="282" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">trajectory reflection F_R</text>
    <text x="30" y="299" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">audits on-track-ness retrospectively</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="264" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="264" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="282" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">AI director</text>
    <text x="370" y="299" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">outer loop auditing the inner</text>
  </g>

  <!-- Row 6 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="316" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="316" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="334" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">off-track error types</text>
    <text x="30" y="351" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">GUI / Tutorial / Code / drift</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="316" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="316" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="334" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">director interrupts</text>
    <text x="370" y="351" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">retry / re-plan / inject / escalate</text>
  </g>

  <!-- Row 7 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="368" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="368" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="386" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">tool agents</text>
    <text x="30" y="403" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">Searcher / Grounder / Coder</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="368" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="368" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="386" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the seam</text>
    <text x="370" y="403" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">host import &#8594; typed verdict</text>
  </g>

  <!-- Row 8 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="420" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="420" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="438" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">searcher on Lack-of-Tutorial</text>
    <text x="30" y="455" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">retrieval fired on detected gap</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="420" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="420" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="438" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">director-triggered dispatch</text>
    <text x="370" y="455" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">tool call on a detected gap</text>
  </g>

  <!-- Row 9 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="472" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="472" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="490" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">bounded OS action set</text>
    <text x="30" y="507" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">click / type / scroll / hotkey</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="472" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="472" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="490" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">bounded action surface</text>
    <text x="370" y="507" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the chart&#8217;s declared transitions</text>
  </g>

  <!-- connecting arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="78"  x2="358" y2="78"  stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,78 352,75 352,81" stroke="none"/>
    <line x1="262" y1="130" x2="358" y2="130" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,130 352,127 352,133" stroke="none"/>
    <line x1="262" y1="182" x2="358" y2="182" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,182 352,179 352,185" stroke="none"/>
    <line x1="262" y1="234" x2="358" y2="234" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,234 352,231 352,237" stroke="none"/>
    <line x1="262" y1="286" x2="358" y2="286" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,286 352,283 352,289" stroke="none"/>
    <line x1="262" y1="338" x2="358" y2="338" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,338 352,335 352,341" stroke="none"/>
    <line x1="262" y1="390" x2="358" y2="390" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,390 352,387 352,393" stroke="none"/>
    <line x1="262" y1="442" x2="358" y2="442" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,442 352,439 352,445" stroke="none"/>
    <line x1="262" y1="494" x2="358" y2="494" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,494 352,491 352,497" stroke="none"/>
  </g>

  <!-- footer caption -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="540" x2="580" y2="540" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="560" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">OS-Symphony audits topology retrospectively &#183; harebrain makes it geometry</text>
    <text x="310" y="576" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">same shape, one guarantee short: every checker here is a soft critic</text>
  </g>
</svg>

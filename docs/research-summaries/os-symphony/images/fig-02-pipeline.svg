<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OS-Symphony pipeline: a central Orchestrator reads current screenshot, short-term window, retrieved tutorial and RMA reflection, then emits thought plus action. It dispatches left to a tool-agent bank (Searcher, General Grounder, OCR Grounder, Coder) and receives a milestone-gated trajectory-level reflection from the Reflection-Memory Agent on the right. The bounded action set click/type/scroll/hotkey drives the OS environment (Linux, macOS, Windows).">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.12); }
    }
  </style>

  <!-- Orchestrator (center) -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="230" y="120" width="180" height="120" rx="8"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="230" y="120" width="180" height="120" rx="8" stroke-width="1.6" fill="none"/>
    <text x="320" y="142" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle" stroke="none">Orchestrator</text>
    <text x="320" y="162" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">reads: oᵢ · H_short · T · Rᵢ</text>
    <line x1="248" y1="172" x2="392" y2="172" stroke-width="0.8"/>
    <text x="320" y="190" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">F_O(I, Rᵢ, oᵢ, T, H_short)</text>
    <text x="320" y="212" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="middle" stroke="none">&#8594; thought tᵢ · action aᵢ</text>
    <text x="320" y="230" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">dispatch tool  OR  GUI action</text>
  </g>

  <!-- Tool agents (left) -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="100" y="112" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle">Tool Agents</text>
  </g>
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="20" y="120" width="160" height="120" rx="8"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="20" y="120" width="160" height="120" rx="8" stroke-width="1.3" fill="none"/>
    <text x="32" y="142" font-family="JetBrains Mono, monospace" font-size="8.5" stroke="none">Multimodal Searcher</text>
    <text x="40" y="156" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">SeeAct in browser sandbox &#8594; T</text>
    <text x="32" y="176" font-family="JetBrains Mono, monospace" font-size="8.5" stroke="none">General Grounder</text>
    <text x="32" y="196" font-family="JetBrains Mono, monospace" font-size="8.5" stroke="none">OCR Grounder</text>
    <text x="40" y="210" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">{text, id, bbox}</text>
    <text x="32" y="228" font-family="JetBrains Mono, monospace" font-size="8.5" stroke="none">Coder (file edit)</text>
  </g>
  <!-- dispatch arrows orch<->tools -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="228" y1="170" x2="184" y2="170" stroke-width="1.2"/>
    <polygon points="181,170 187,167.5 187,172.5" stroke="none"/>
    <line x1="184" y1="192" x2="228" y2="192" stroke-width="1.2" stroke-dasharray="3 3"/>
    <polygon points="231,192 225,189.5 225,194.5" stroke="none"/>
    <text x="206" y="164" font-family="JetBrains Mono, monospace" font-size="6" text-anchor="middle" stroke="none">call</text>
    <text x="206" y="204" font-family="JetBrains Mono, monospace" font-size="6" text-anchor="middle" stroke="none">result</text>
  </g>

  <!-- RMA (right) -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="540" y="112" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle">Reflection-Memory Agent</text>
  </g>
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="460" y="120" width="160" height="120" rx="8"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="460" y="120" width="160" height="120" rx="8" stroke-width="1.3" fill="none"/>
    <text x="472" y="142" font-family="JetBrains Mono, monospace" font-size="7.5" stroke="none">H_long = {(Sⱼ,oⱼ,mⱼ)}</text>
    <text x="472" y="158" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">milestone-gated pixels</text>
    <line x1="472" y1="166" x2="608" y2="166" stroke-width="0.8"/>
    <text x="472" y="182" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">F_R &#8594; Rᵢ, mᵢ, kᵢ</text>
    <text x="472" y="200" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">On-track / Completed</text>
    <text x="472" y="214" font-family="JetBrains Mono, monospace" font-size="7" stroke="none">Infeasible / Off-track</text>
    <text x="472" y="230" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">err: GUI·Tutorial·Code·drift</text>
  </g>
  <!-- reflection arrow RMA -> orch -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="458" y1="180" x2="412" y2="180" stroke-width="1.3"/>
    <polygon points="409,180 415,177.5 415,182.5" stroke="none"/>
    <text x="435" y="174" font-family="JetBrains Mono, monospace" font-size="6" text-anchor="middle" stroke="none">Rᵢ</text>
  </g>

  <!-- Environment (far right, below) + action set -->
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="320" y="280" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">action set: { click · type · scroll · hotkey }</text>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <line x1="320" y1="240" x2="320" y2="266" stroke-width="1.3"/>
    <polygon points="320,269 317.5,263 322.5,263" stroke="none"/>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="200" y="296" width="240" height="40" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="200" y="296" width="240" height="40" rx="6" stroke-width="1.3" fill="none"/>
    <text x="320" y="313" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">OS environment</text>
    <text x="320" y="328" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">Linux (Ubuntu) · macOS · Windows</text>
  </g>
  <!-- screenshot back to orch -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <path d="M 200 316 L 150 316 L 150 200 L 228 200" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
    <polygon points="231,200 225,197.5 225,202.5" stroke="none"/>
    <text x="160" y="258" font-family="JetBrains Mono, monospace" font-size="6.5" stroke="none">screenshot oᵢ</text>
  </g>
</svg>

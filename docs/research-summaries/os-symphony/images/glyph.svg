<svg width="200" height="58" viewBox="0 0 200 58" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OS-Symphony glyph: an Orchestrator disc conducting three tool-agent staves, with a milestone-gated reflection arrow returning from a Reflection-Memory Agent">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- Orchestrator disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="28" cy="29" rx="23" ry="13"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="28" cy="29" rx="23" ry="13" stroke-width="1.4" fill="none"/>
    <text x="28" y="32" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.05em" stroke="none">ORCH</text>
  </g>
  <!-- three staves (dispatch) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="52" y1="20" x2="120" y2="20" stroke-width="1.2"/>
    <line x1="52" y1="29" x2="120" y2="29" stroke-width="1.2"/>
    <line x1="52" y1="38" x2="120" y2="38" stroke-width="1.2"/>
    <polygon points="123,20 117,17.5 117,22.5" stroke="none"/>
    <polygon points="123,29 117,26.5 117,31.5" stroke="none"/>
    <polygon points="123,38 117,35.5 117,40.5" stroke="none"/>
  </g>
  <!-- tool agents box -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <rect x="125" y="11" width="40" height="36" rx="4"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="125" y="11" width="40" height="36" rx="4" stroke-width="1.4" fill="none"/>
    <text x="131" y="22" font-family="ui-monospace, monospace" font-size="6.5" stroke="none">search</text>
    <text x="131" y="33" font-family="ui-monospace, monospace" font-size="6.5" stroke="none">ground</text>
    <text x="131" y="44" font-family="ui-monospace, monospace" font-size="6.5" stroke="none">coder</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="145" y="8" font-family="ui-monospace, monospace" font-size="5.5" letter-spacing="0.1em" text-anchor="middle">TOOLS</text>
  </g>
  <!-- reflection return arrow (bottom, dashed, oxblood) with milestone dots -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="160" y1="52" x2="40" y2="52" stroke-width="1.2" stroke-dasharray="4 4"/>
    <polygon points="37,52 43,49.5 43,54.5" stroke="none"/>
    <circle cx="150" cy="52" r="1.6" stroke="none"/>
    <circle cx="110" cy="52" r="1.6" stroke="none"/>
    <circle cx="70" cy="52" r="1.6" stroke="none"/>
    <text x="180" y="50" font-family="ui-monospace, monospace" font-size="6" text-anchor="middle" stroke="none">RMA</text>
  </g>
</svg>

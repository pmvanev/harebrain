<svg viewBox="0 0 620 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping HART constructs (left, oxblood) onto harebrain primitives (right, blueprint): hallucinated span onto LLM-leaf output under guard, span identification onto where-clause scoping, hallucination type onto a typed verdict tag, error mechanism onto a typed error taxonomy on the seam, evidence retrieval onto the hard critic's evidence lookup, trace quadruple onto the guard verdict payload, causal tracing onto blackboard provenance.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <!-- column headers -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">HART</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/>
  </g>

  <!-- Row 1: Hallucinated span <-> LLM-leaf output under guard -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="60" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">hallucinated span</text>
    <text x="30" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">a fragment of model output</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="60" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="60" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="78" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">LLM-leaf output under guard</text>
    <text x="370" y="95" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">one call per state, then checked</text>
  </g>

  <!-- Row 2: Span identification <-> where-clause scoping -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="118" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">span identification</text>
    <text x="30" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">localize (b, e) char offsets</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="118" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="118" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="136" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">guard scope (the where)</text>
    <text x="370" y="153" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">which claim a guard fires on</text>
  </g>

  <!-- Row 3: Hallucination type <-> typed verdict tag -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="176" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">hallucination type (|y&#x2095;|=4)</text>
    <text x="30" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">entity &#183; fact &#183; logic &#183; fabricate</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="176" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="176" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="194" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">typed verdict tag</text>
    <text x="370" y="211" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">what kind of failure, on the seam</text>
  </g>

  <!-- Row 4: Error mechanism <-> typed error taxonomy on the seam -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="234" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">error mechanism (|y&#2091;|=5)</text>
    <text x="30" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">why it failed: fabrication, leakage&#8230;</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="234" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="234" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="252" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">typed error taxonomy</text>
    <text x="370" y="269" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">enum the director routes on</text>
  </g>

  <!-- Row 5: Evidence retrieval <-> hard critic's evidence lookup -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="292" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">evidence retrieval</text>
    <text x="30" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">S-BERT &#8594; FAISS &#8594; Cross-Encoder</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="292" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="292" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="310" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">hard critic's lookup</text>
    <text x="370" y="327" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the sound source the guard reads</text>
  </g>

  <!-- Row 6: Trace quadruple <-> guard verdict payload -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="350" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="350" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="368" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">trace quadruple T&#x1d62;</text>
    <text x="30" y="385" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">(span, type, mechanism, evidence)</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="350" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="350" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="368" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">guard verdict payload</text>
    <text x="370" y="385" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">what a constructive critic returns</text>
  </g>

  <!-- Row 7: Causal tracing <-> blackboard provenance -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="408" width="240" height="44" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="408" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="426" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">causal tracing</text>
    <text x="30" y="443" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">claim &#8594; mechanism &#8594; grounds</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="408" width="240" height="44" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="408" width="240" height="44" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="426" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">blackboard provenance</text>
    <text x="370" y="443" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">why a fact is on the board</text>
  </g>

  <!-- connecting arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="82"  x2="358" y2="82"  stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,82 352,79 352,85" stroke="none"/>
    <line x1="262" y1="140" x2="358" y2="140" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,140 352,137 352,143" stroke="none"/>
    <line x1="262" y1="198" x2="358" y2="198" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,198 352,195 352,201" stroke="none"/>
    <line x1="262" y1="256" x2="358" y2="256" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,256 352,253 352,259" stroke="none"/>
    <line x1="262" y1="314" x2="358" y2="314" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,314 352,311 352,317" stroke="none"/>
    <line x1="262" y1="372" x2="358" y2="372" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,372 352,369 352,375" stroke="none"/>
    <line x1="262" y1="430" x2="358" y2="430" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="358,430 352,427 352,433" stroke="none"/>
  </g>

  <!-- footer caption -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="468" x2="580" y2="468" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="486" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">HART is post-hoc &amp; span-level &#183; harebrain wants the same verdict shape, pre-commit &amp; per-state</text>
  </g>
</svg>

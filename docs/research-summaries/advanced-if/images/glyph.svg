<svg width="214" height="62" viewBox="0 0 214 62" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AdvancedIF glyph: an LLM disc emits a response into a rubric checklist of two passes and one fail, an all-or-nothing gate yields a failing verdict.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- LLM disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="27" cy="31" rx="23" ry="13"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="27" cy="31" rx="23" ry="13" stroke-width="1.4" fill="none"/>
    <text x="27" y="34" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle" letter-spacing="0.1em" stroke="none">LLM</text>
  </g>
  <!-- response arrow -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="51" y1="31" x2="76" y2="31" stroke-width="1.2"/>
    <polygon points="79,31 73,28 73,34" stroke="none"/>
  </g>
  <!-- rubric checklist -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="83" y="8" width="62" height="46" rx="4"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="83" y="8" width="62" height="46" rx="4" stroke-width="1.4" fill="none"/>
  </g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1">
    <line x1="104" y1="19" x2="138" y2="19"/>
    <line x1="104" y1="31" x2="138" y2="31"/>
    <line x1="104" y1="43" x2="138" y2="43"/>
  </g>
  <!-- two pass -->
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="90,19 93,22 99,15"/>
    <polyline points="90,31 93,34 99,27"/>
  </g>
  <!-- one fail -->
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round">
    <line x1="90" y1="40" x2="98" y2="47"/>
    <line x1="98" y1="40" x2="90" y2="47"/>
  </g>
  <!-- all-or-nothing arrow -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="146" y1="31" x2="172" y2="31" stroke-width="1.3"/>
    <polygon points="175,31 169,28 169,34" stroke="none"/>
    <text x="148" y="25" font-family="ui-monospace, monospace" font-size="6" letter-spacing="0.3" stroke="none">all?</text>
  </g>
  <!-- failing verdict token -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><circle cx="192" cy="31" r="13"/></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round">
    <circle cx="192" cy="31" r="13" stroke-width="1.4"/>
    <line x1="187" y1="26" x2="197" y2="36"/>
    <line x1="197" y1="26" x2="187" y2="36"/>
  </g>
</svg>

<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An instruction is decomposed into seven independently-checkable criteria; six are satisfied and one fails; an all-or-nothing conjunction turns the whole response into a FALSE verdict.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.12); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="18" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">ONE INSTRUCTION &#183; SEVEN CRITERIA &#183; ALL OR NOTHING</text>
  </g>

  <!-- prompt -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="20" y="40" width="120" height="170" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="20" y="40" width="120" height="170" rx="6" stroke-width="1.6" fill="none"/>
    <text x="80" y="62" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle" stroke="none">prompt</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="80" y="86" font-family="Spectral, serif" font-size="9.5" text-anchor="middle">expert-written,</text>
    <text x="80" y="99" font-family="Spectral, serif" font-size="9.5" text-anchor="middle">6+ entangled</text>
    <text x="80" y="112" font-family="Spectral, serif" font-size="9.5" text-anchor="middle">instructions</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="80" y="138" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">tone &#183; format</text>
    <text x="80" y="150" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">length &#183; verbiage</text>
    <text x="80" y="162" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">negative &#183; nested</text>
    <text x="80" y="174" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">conditional</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="80" y="200" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" letter-spacing="0.1em">DECOMPOSE &#8595;</text>
  </g>

  <!-- decompose arrow -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="142" y1="125" x2="176" y2="125" stroke-width="1.3"/>
    <polygon points="179,125 173,122 173,128" stroke="none"/>
  </g>

  <!-- seven criteria rows -->
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="9.5">
    <text x="206" y="55">family-friendly only</text>
    <text x="206" y="76">exactly 10&#8211;15 songs</text>
    <text x="206" y="97">exclude the Beatles</text>
    <text x="206" y="118">numbered list, no prose</text>
    <text x="206" y="139">title in bold</text>
    <text x="206" y="160">differ from prior turn</text>
    <text x="206" y="181">warm, upbeat tone</text>
  </g>
  <!-- pass marks (sage) for six -->
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="186,51 190,55 196,47"/>
    <polyline points="186,72 190,76 196,68"/>
    <polyline points="186,114 190,118 196,110"/>
    <polyline points="186,135 190,139 196,131"/>
    <polyline points="186,156 190,160 196,152"/>
    <polyline points="186,177 190,181 196,173"/>
  </g>
  <!-- one fail (oxblood) at criterion 3 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="182" y="86" width="190" height="16" rx="3"/></g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.9" stroke-linecap="round">
    <line x1="186" y1="89" x2="196" y2="98"/>
    <line x1="196" y1="89" x2="186" y2="98"/>
  </g>
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="338" y="97" font-family="JetBrains Mono, monospace" font-size="8" font-style="italic">slips one in</text>
  </g>

  <!-- brace into conjunction -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="1.3">
    <path d="M 376 48 q 8 0 8 8 L 384 110 q 0 8 8 8 q -8 0 -8 8 L 384 177 q 0 8 -8 8"/>
  </g>

  <!-- AND gate -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><circle cx="430" cy="125" r="26"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <circle cx="430" cy="125" r="26" stroke-width="1.6" fill="none"/>
    <text x="430" y="121" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle" stroke="none">&#8743;</text>
    <text x="430" y="138" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">all</text>
  </g>

  <!-- verdict arrow -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="458" y1="125" x2="486" y2="125" stroke-width="1.4"/>
    <polygon points="489,125 483,122 483,128" stroke="none"/>
  </g>

  <!-- FALSE verdict -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="492" y="104" width="56" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="492" y="104" width="56" height="42" rx="6" stroke-width="2" fill="none"/>
    <text x="520" y="123" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle" stroke="none">FALSE</text>
    <text x="520" y="138" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">reward 0</text>
  </g>

  <!-- footnote -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="232" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">six of seven right earns nothing &#183; the score is the percentage of responses that satisfy <tspan font-style="italic">every</tspan> criterion</text>
  </g>
</svg>

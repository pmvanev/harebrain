<svg viewBox="0 0 620 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two columns mapping Harness Engineering concepts (left, oxblood) onto harebrain primitives (right, blueprint): the harness itself maps to the cage; feedforward guides map to the slow-clock chart and pinned blackboard facts; feedback sensors map to transition guards plus EDD review; computational sensors map to hard guards; inferential sensors map to soft EDD review; the steering loop maps to the AI director; harnessability maps to whether a workflow has a small named state space; service-topology templates map to pre-approved chart blueprints.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <!-- column headers -->
  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="130" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">Harness Engineering</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="490" y="28" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle">harebrain</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="28" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">&#x2194;</text>
  </g>
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="40" x2="580" y2="40" stroke-width="1"/>
  </g>

  <!-- Row 1: the harness <-> the cage -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="56" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="56" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="74" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the harness</text>
    <text x="30" y="90" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">everything but the model</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="56" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="56" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="74" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">the cage</text>
    <text x="370" y="90" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">chart + blackboard + guards</text>
  </g>

  <!-- Row 2: feedforward guides <-> slow-clock chart + pinned facts -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="108" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="108" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="126" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">feedforward guides</text>
    <text x="30" y="142" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">steer before the agent acts</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="108" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="108" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="126" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">chart topology + pinned facts</text>
    <text x="370" y="142" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">where-you-are, before the call</text>
  </g>

  <!-- Row 3: feedback sensors <-> guards + EDD -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="160" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="160" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="178" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">feedback sensors</text>
    <text x="30" y="194" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">observe after &#183; self-correct</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="160" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="160" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="178" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">transition guards</text>
    <text x="370" y="194" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">when [tests_green] =&gt; Done</text>
  </g>

  <!-- Row 4: computational sensor <-> hard guard -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="212" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="212" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="230" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">computational sensor</text>
    <text x="30" y="246" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">ArchUnit, linter, type check</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="212" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="212" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="230" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">hard guard (sound)</text>
    <text x="370" y="246" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">fires deterministically</text>
  </g>

  <!-- Row 5: inferential sensor <-> soft EDD review -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="264" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="264" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="282" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">inferential sensor</text>
    <text x="30" y="298" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">LLM-as-judge review</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="264" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="264" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="282" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">EDD adversarial review</text>
    <text x="370" y="298" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">soft verdict, chart routes on it</text>
  </g>

  <!-- Row 6: steering loop <-> AI director -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="316" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="316" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="334" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">steering loop</text>
    <text x="30" y="350" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">revise controls on failures</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="316" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="316" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="334" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">AI director (slow clock)</text>
    <text x="370" y="350" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">outer loop rewrites the cage</text>
  </g>

  <!-- Row 7: harnessability <-> small named state space -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="368" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="368" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="386" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">harnessability</text>
    <text x="30" y="402" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">how amenable to control</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="368" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="368" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="386" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">small named state space</text>
    <text x="370" y="402" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">the honest-tradeoff test</text>
  </g>

  <!-- Row 8: topology templates <-> pre-approved blueprints -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="20" y="420" width="240" height="42" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="20" y="420" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="30" y="438" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">topology templates</text>
    <text x="30" y="454" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">variety-reduction (Ashby)</text>
  </g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="360" y="420" width="240" height="42" rx="6"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="360" y="420" width="240" height="42" rx="6" stroke-width="1.3" fill="none"/>
    <text x="370" y="438" font-family="Fraunces, serif" font-size="11" font-style="italic" stroke="none">pre-approved blueprints</text>
    <text x="370" y="454" font-family="JetBrains Mono, monospace" font-size="8" stroke="none">new Blueprint : Name &#183; Tier 2</text>
  </g>

  <!-- connecting arrows -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="262" y1="77"  x2="358" y2="77"  stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,77 352,74 352,80" stroke="none"/>
    <line x1="262" y1="129" x2="358" y2="129" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,129 352,126 352,132" stroke="none"/>
    <line x1="262" y1="181" x2="358" y2="181" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,181 352,178 352,184" stroke="none"/>
    <line x1="262" y1="233" x2="358" y2="233" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,233 352,230 352,236" stroke="none"/>
    <line x1="262" y1="285" x2="358" y2="285" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,285 352,282 352,288" stroke="none"/>
    <line x1="262" y1="337" x2="358" y2="337" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,337 352,334 352,340" stroke="none"/>
    <line x1="262" y1="389" x2="358" y2="389" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,389 352,386 352,392" stroke="none"/>
    <line x1="262" y1="441" x2="358" y2="441" stroke-width="1" stroke-dasharray="3 3"/><polygon points="358,441 352,438 352,444" stroke="none"/>
  </g>

  <!-- footer caption -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="478" x2="580" y2="478" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="496" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">the harness named from the SE-practice side &#183; harebrain names the same cage from game AI</text>
  </g>
</svg>

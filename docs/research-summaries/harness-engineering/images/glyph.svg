<svg width="200" height="64" viewBox="0 0 200 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harness-engineering glyph: a feedforward guide arrow steering into a coding agent before it acts, the agent emitting a change, and a feedback sensor arrow returning the verdict to close the loop">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>
  <!-- feedforward guide arrow (top, into agent) -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="6" y1="16" x2="68" y2="16" stroke-width="1.3"/>
    <polygon points="71,16 65,13 65,19" stroke="none"/>
    <text x="8" y="11" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.3" stroke="none">guide</text>
  </g>
  <!-- agent disc -->
  <g class="blueprint-tint" stroke="none" fill="currentColor">
    <ellipse cx="96" cy="32" rx="26" ry="14"/>
  </g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="96" cy="32" rx="26" ry="14" stroke-width="1.4" fill="none"/>
    <text x="96" y="35" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle" letter-spacing="0.08em" stroke="none">AGENT</text>
  </g>
  <!-- change emitted (right) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="124" y1="32" x2="160" y2="32" stroke-width="1.3"/>
    <polygon points="163,32 157,29 157,35" stroke="none"/>
  </g>
  <!-- codebase / change box -->
  <g class="oxblood-tint" stroke="none" fill="currentColor">
    <rect x="166" y="20" width="28" height="24" rx="3"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="166" y="20" width="28" height="24" rx="3" stroke-width="1.4" fill="none"/>
    <text x="180" y="35" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle" stroke="none">&#9670;</text>
  </g>
  <!-- feedback sensor arrow (bottom, returning) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <path d="M 180 46 L 180 56 L 96 56 L 96 48" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
    <polygon points="96,46 93,52 99,52" stroke="none"/>
    <text x="120" y="62" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.3" stroke="none">sensor</text>
  </g>
</svg>

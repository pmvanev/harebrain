<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The steering loop as a cybernetic governor: feedforward guides steer the coding agent before it acts; the agent emits a change to the codebase; feedback sensors observe after and return a signal that lets the agent self-correct; a human watches recurring failure patterns and revises the guides and sensors on a slow outer loop.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.07); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    .sage-tint      { color: rgba(79, 107, 63, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
      .sage-tint      { color: rgba(177, 201, 140, 0.12); }
    }
  </style>

  <!-- title -->
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="22" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">the harness as cybernetic governor</text>
  </g>

  <!-- feedforward: guides -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="30" y="60" width="150" height="58" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="30" y="60" width="150" height="58" rx="6" stroke-width="1.3" fill="none"/>
    <text x="105" y="84" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle" stroke="none">feedforward</text>
    <text x="105" y="101" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">guides &#183; steer before</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="105" y="133" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">AGENTS.md &#183; skills &#183; code mods</text>
  </g>

  <!-- agent -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><ellipse cx="310" cy="89" rx="78" ry="36"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <ellipse cx="310" cy="89" rx="78" ry="36" stroke-width="1.4" fill="none"/>
    <text x="310" y="86" font-family="Fraunces, serif" font-size="14" font-style="italic" text-anchor="middle" stroke="none">coding agent</text>
    <text x="310" y="104" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">model + harness</text>
  </g>

  <!-- feedback: sensors -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="440" y="60" width="150" height="58" rx="6"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="440" y="60" width="150" height="58" rx="6" stroke-width="1.3" fill="none"/>
    <text x="515" y="84" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle" stroke="none">feedback</text>
    <text x="515" y="101" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">sensors &#183; observe after</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="515" y="133" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle">linters &#183; tests &#183; LLM review</text>
  </g>

  <!-- guide -> agent arrow -->
  <g class="sage" stroke="currentColor" fill="currentColor">
    <line x1="180" y1="89" x2="228" y2="89" stroke-width="1.4"/>
    <polygon points="231,89 225,86 225,92" stroke="none"/>
  </g>
  <!-- agent -> sensor arrow (the change) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="388" y1="89" x2="436" y2="89" stroke-width="1.4"/>
    <polygon points="439,89 433,86 433,92" stroke="none"/>
    <text x="412" y="83" font-family="JetBrains Mono, monospace" font-size="7" text-anchor="middle" stroke="none">change</text>
  </g>

  <!-- self-correct: sensor signal back to agent (inner loop) -->
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <path d="M 515 118 L 515 168 L 310 168 L 310 127" stroke-width="1.3" fill="none" stroke-dasharray="4 3"/>
    <polygon points="310,124 307,130 313,130" stroke="none"/>
    <text x="412" y="183" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle" stroke="none">self-correct &#183; signal optimised for LLM</text>
  </g>

  <!-- the codebase being regulated -->
  <g class="ink" stroke="currentColor" fill="none">
    <rect x="235" y="208" width="150" height="34" rx="5" stroke-width="1.2"/>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="310" y="229" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">codebase &#8594; desired state</text>
  </g>
  <g class="muted" stroke="currentColor" fill="currentColor">
    <line x1="412" y1="168" x2="412" y2="208" stroke-width="1" stroke-dasharray="2 3"/>
  </g>

  <!-- outer loop: human revises the controls (steering loop) -->
  <g class="muted" stroke="currentColor" fill="currentColor">
    <path d="M 105 118 L 105 300 L 515 300 L 515 118" stroke-width="1.2" fill="none" stroke-dasharray="5 4"/>
    <polygon points="105,121 102,127 108,127" stroke="none"/>
    <polygon points="515,121 512,127 518,127" stroke="none"/>
  </g>
  <g class="ink" stroke="none" fill="currentColor">
    <text x="310" y="296" font-family="Fraunces, serif" font-size="12" font-style="italic" text-anchor="middle">the steering loop &#8212; human revises guides &amp; sensors from recurring failures</text>
  </g>

  <!-- footer note -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="40" y1="324" x2="580" y2="324" stroke-width="1"/>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="310" y="344" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">feedforward-only repeats mistakes blind &#183; feedback-only never learns &#183; you need both</text>
  </g>
</svg>

<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two-column mapping: AdvancedIF constructs on the left in oxblood map by dashed arrows to harebrain primitives on the right in blueprint.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.08); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.06); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.10); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.10); }
    }
  </style>

  <g class="oxblood" stroke="none" fill="currentColor">
    <text x="124" y="24" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">AdvancedIF</text>
  </g>
  <g class="blueprint" stroke="none" fill="currentColor">
    <text x="436" y="24" font-family="Fraunces, serif" font-size="13" font-style="italic" text-anchor="middle">harebrain</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="24" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">maps to</text>
  </g>

  <!-- row builder: 5 rows -->
  <!-- Row 1 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="22" y="40" width="204" height="38" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="40" width="204" height="38" rx="5" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="124" y="63" font-family="Spectral, serif" font-size="11" text-anchor="middle">rubric criterion (decomposed)</text></g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="334" y="40" width="204" height="38" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="334" y="40" width="204" height="38" rx="5" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="436" y="63" font-family="Spectral, serif" font-size="11" text-anchor="middle">EDD expectation on a state</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="228" y1="59" x2="332" y2="59" stroke-dasharray="3 3"/></g>

  <!-- Row 2 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="22" y="90" width="204" height="38" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="90" width="204" height="38" rx="5" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="124" y="113" font-family="Spectral, serif" font-size="11" text-anchor="middle">all-or-nothing pass</text></g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="334" y="90" width="204" height="38" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="334" y="90" width="204" height="38" rx="5" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="436" y="110" font-family="Spectral, serif" font-size="11" text-anchor="middle">conjunctive transition guard</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="436" y="122" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">[all_criteria = TRUE]</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="228" y1="109" x2="332" y2="109" stroke-dasharray="3 3"/></g>

  <!-- Row 3 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="22" y="140" width="204" height="38" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="140" width="204" height="38" rx="5" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="124" y="163" font-family="Spectral, serif" font-size="11" text-anchor="middle">rubric verifier (LLM judge)</text></g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="334" y="140" width="204" height="38" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="334" y="140" width="204" height="38" rx="5" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="436" y="163" font-family="Spectral, serif" font-size="11" text-anchor="middle">soft critic / director review</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="228" y1="159" x2="332" y2="159" stroke-dasharray="3 3"/></g>

  <!-- Row 4 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="22" y="190" width="204" height="38" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="190" width="204" height="38" rx="5" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="124" y="207" font-family="Spectral, serif" font-size="11" text-anchor="middle">multi-turn carried context</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="124" y="220" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">the hard frontier</text></g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="334" y="190" width="204" height="38" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="334" y="190" width="204" height="38" rx="5" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="436" y="213" font-family="Spectral, serif" font-size="11" text-anchor="middle">the blackboard</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="228" y1="209" x2="332" y2="209" stroke-dasharray="3 3"/></g>

  <!-- Row 5 -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="22" y="240" width="204" height="38" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="none"><rect x="22" y="240" width="204" height="38" rx="5" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="124" y="263" font-family="Spectral, serif" font-size="11" text-anchor="middle">system-prompt steerability</text></g>
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="334" y="240" width="204" height="38" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="none"><rect x="334" y="240" width="204" height="38" rx="5" stroke-width="1.3"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="436" y="263" font-family="Spectral, serif" font-size="11" text-anchor="middle">pinned blackboard facts</text></g>
  <g class="muted" stroke="currentColor" fill="none" stroke-width="1.1"><line x1="228" y1="259" x2="332" y2="259" stroke-dasharray="3 3"/></g>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="294" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">a benchmark for instruction-following, read as a parts list for the cage</text>
  </g>
</svg>

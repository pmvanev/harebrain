<svg viewBox="0 0 560 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart: IFEval is saturated near 90 percent, but the best frontier models reach only the high-70s on AdvancedIF, and RIFL lifts Llama 4 Maverick from 51.4 to 58.1 — all far short of the 100 percent north star.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .blueprint-tint { color: rgba(31, 79, 122, 0.55); }
    .sage-fill      { color: rgba(79, 107, 63, 0.65); }
    .muted-fill     { color: rgba(93, 85, 63, 0.30); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .blueprint-tint { color: rgba(136, 192, 232, 0.55); }
      .sage-fill      { color: rgba(177, 201, 140, 0.60); }
      .muted-fill     { color: rgba(168, 156, 125, 0.30); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="18" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">THE GAP THE BENCHMARK EXISTS TO SHOW</text>
  </g>

  <!-- north-star axis at 100% (x = 160 + 100*3.4 = 500) -->
  <g class="rule-soft" stroke="currentColor" fill="none">
    <line x1="160" y1="36" x2="160" y2="228" stroke-width="1"/>
  </g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <line x1="500" y1="36" x2="500" y2="228" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="500" y="244" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle" stroke="none">100 &#183; north star</text>
  </g>

  <!-- IFEval saturated (muted) -->
  <g class="muted-fill" stroke="none" fill="currentColor"><rect x="160" y="44" width="306" height="18" rx="2"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="155" y="57" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">IFEval (Maverick)</text>
    <text x="472" y="57" font-family="JetBrains Mono, monospace" font-size="8.5">90.0</text>
    <text x="166" y="57" font-family="Spectral, serif" font-size="8.5" font-style="italic" fill="currentColor">saturated &#8212; the old test no longer separates models</text>
  </g>

  <!-- divider -->
  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="20" y1="74" x2="540" y2="74" stroke-width="0.8"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="20" y="90" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.1em">ADVANCEDIF (avg of CIF &#183; CC &#183; SS)</text>
  </g>

  <!-- frontier bars (blueprint) -->
  <!-- GPT-5 77.9 -> width 264.9 -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="160" y="98" width="265" height="16" rx="2"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="431" y="110" font-family="JetBrains Mono, monospace" font-size="8.5">77.9</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="155" y="110" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">GPT-5</text></g>

  <!-- Gemini 3 Pro 74.7 -> 254 -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="160" y="120" width="254" height="16" rx="2"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="420" y="132" font-family="JetBrains Mono, monospace" font-size="8.5">74.7</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="155" y="132" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">Gemini 3 Pro</text></g>

  <!-- Claude 4 Sonnet 63.8 -> 217 -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="160" y="142" width="217" height="16" rx="2"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="383" y="154" font-family="JetBrains Mono, monospace" font-size="8.5">63.8</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="155" y="154" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">Claude 4 Sonnet</text></g>

  <!-- divider -->
  <g class="rule-soft" stroke="currentColor" fill="none"><line x1="20" y1="168" x2="540" y2="168" stroke-width="0.8"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="20" y="184" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.1em">RIFL POST-TRAINING (Llama 4 Maverick)</text>
  </g>

  <!-- Maverick base 51.4 -> 175 -->
  <g class="muted-fill" stroke="none" fill="currentColor"><rect x="160" y="192" width="175" height="16" rx="2"/></g>
  <g class="ink" stroke="none" fill="currentColor"><text x="341" y="204" font-family="JetBrains Mono, monospace" font-size="8.5">51.4</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="155" y="204" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">Maverick (base)</text></g>

  <!-- Maverick + RIFL 58.1 -> 197.5 ; show +6.7 segment in sage -->
  <g class="muted-fill" stroke="none" fill="currentColor"><rect x="160" y="210" width="175" height="16" rx="2"/></g>
  <g class="sage-fill" stroke="none" fill="currentColor"><rect x="335" y="210" width="23" height="16" rx="2"/></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="364" y="222" font-family="JetBrains Mono, monospace" font-size="8.5">58.1</text></g>
  <g class="muted" stroke="none" fill="currentColor"><text x="155" y="222" font-family="JetBrains Mono, monospace" font-size="8.5" text-anchor="end">+ RIFL</text></g>
  <g class="sage" stroke="none" fill="currentColor"><text x="396" y="222" font-family="Spectral, serif" font-size="8.5" font-style="italic">+6.7 from a rubric-shaped reward</text></g>
</svg>

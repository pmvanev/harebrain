<svg viewBox="0 0 560 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Agentic Benchmark Checklist in three columns: Task Validity (T.1 to T.10), Outcome Validity (O.a to O.i), and Benchmark Reporting (R.1 to R.13), each grouped into subcategories with representative items.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .sage-tint      { color: rgba(79, 107, 63, 0.10); }
    .blueprint-tint { color: rgba(31, 79, 122, 0.10); }
    .oxblood-tint   { color: rgba(139, 31, 44, 0.08); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .sage-tint      { color: rgba(177, 201, 140, 0.14); }
      .blueprint-tint { color: rgba(136, 192, 232, 0.14); }
      .oxblood-tint   { color: rgba(224, 144, 152, 0.14); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="18" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">THE AGENTIC BENCHMARK CHECKLIST &#183; 33 ITEMS, 3 PARTS</text>
  </g>

  <!-- ============ COL 1 : TASK VALIDITY ============ -->
  <g class="sage-tint" stroke="none" fill="currentColor"><rect x="14" y="30" width="174" height="26" rx="5"/></g>
  <g class="sage" stroke="currentColor" fill="currentColor">
    <rect x="14" y="30" width="174" height="26" rx="5" stroke-width="1.4" fill="none"/>
    <text x="101" y="47" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">Task Validity &#183; T</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7.5">
    <text x="22" y="74" letter-spacing="0.08em">TOOL</text>
  </g>
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="8.5">
    <text x="34" y="88">tool versions pinned</text>
    <text x="34" y="100">APIs reachable, errors handled</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7.5"><text x="22" y="118" letter-spacing="0.08em">ENVIRONMENT</text></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="8.5">
    <text x="34" y="132">state cleared between runs</text>
    <text x="34" y="144">agent isolated from ground truth</text>
    <text x="34" y="156">frozen &#8212; no live website</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7.5"><text x="22" y="174" letter-spacing="0.08em">IMPLEMENTATION</text></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="8.5">
    <text x="34" y="188">ground truth verified correct</text>
    <text x="34" y="200">every task verified solvable</text>
    <text x="34" y="212">an oracle solver exists</text>
    <text x="34" y="224">no exploitable shortcuts</text>
  </g>
  <!-- check marks col1 -->
  <g class="sage" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="24,85 27,88 31,82"/><polyline points="24,97 27,100 31,94"/>
    <polyline points="24,129 27,132 31,126"/><polyline points="24,141 27,144 31,138"/><polyline points="24,153 27,156 31,150"/>
    <polyline points="24,185 27,188 31,182"/><polyline points="24,197 27,200 31,194"/><polyline points="24,209 27,212 31,206"/><polyline points="24,221 27,224 31,218"/>
  </g>

  <!-- ============ COL 2 : OUTCOME VALIDITY ============ -->
  <g class="blueprint-tint" stroke="none" fill="currentColor"><rect x="192" y="30" width="174" height="26" rx="5"/></g>
  <g class="blueprint" stroke="currentColor" fill="currentColor">
    <rect x="192" y="30" width="174" height="26" rx="5" stroke-width="1.4" fill="none"/>
    <text x="279" y="47" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">Outcome Validity &#183; O</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7.5"><text x="200" y="74" letter-spacing="0.08em">INFORMATION ACQUISITION</text></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="8.5">
    <text x="212" y="88">accept semantic equivalents</text>
    <text x="212" y="100">robust to listing all answers</text>
    <text x="212" y="112">LLM judge validated vs humans</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7.5"><text x="200" y="130" letter-spacing="0.08em">CODE GENERATION</text></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="8.5">
    <text x="212" y="144">test cases verified for quality</text>
    <text x="212" y="156">coverage measured objectively</text>
    <text x="212" y="168">fuzz hits real edge cases</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7.5"><text x="200" y="186" letter-spacing="0.08em">STATE &amp; REASONING</text></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="8.5">
    <text x="212" y="200">all success states enumerated</text>
    <text x="212" y="212">trivial state hacks blocked</text>
    <text x="212" y="224">guessing minimized</text>
  </g>
  <g class="blueprint" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="202,85 205,88 209,82"/><polyline points="202,97 205,100 209,94"/><polyline points="202,109 205,112 209,106"/>
    <polyline points="202,141 205,144 209,138"/><polyline points="202,153 205,156 209,150"/><polyline points="202,165 205,168 209,162"/>
    <polyline points="202,197 205,200 209,194"/><polyline points="202,209 205,212 209,206"/><polyline points="202,221 205,224 209,218"/>
  </g>

  <!-- ============ COL 3 : REPORTING ============ -->
  <g class="oxblood-tint" stroke="none" fill="currentColor"><rect x="370" y="30" width="174" height="26" rx="5"/></g>
  <g class="oxblood" stroke="currentColor" fill="currentColor">
    <rect x="370" y="30" width="174" height="26" rx="5" stroke-width="1.4" fill="none"/>
    <text x="457" y="47" font-family="Fraunces, serif" font-size="11" font-style="italic" text-anchor="middle" stroke="none">Reporting &#183; R</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7.5"><text x="378" y="74" letter-spacing="0.08em">TRANSPARENCY</text></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="8.5">
    <text x="390" y="88">open-sourced + open harness</text>
    <text x="390" y="100">held-out / anti-contamination</text>
    <text x="390" y="112">capability&#8211;measure link stated</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7.5"><text x="378" y="130" letter-spacing="0.08em">FLAW MITIGATION</text></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="8.5">
    <text x="390" y="144">corrections documented</text>
    <text x="390" y="156">residual-flaw impact quantified</text>
  </g>
  <g class="muted" stroke="none" fill="currentColor" font-family="JetBrains Mono, monospace" font-size="7.5"><text x="378" y="174" letter-spacing="0.08em">INTERPRETATION</text></g>
  <g class="ink" stroke="none" fill="currentColor" font-family="Spectral, serif" font-size="8.5">
    <text x="390" y="188">confidence intervals reported</text>
    <text x="390" y="200">non-AI / human baselines</text>
    <text x="390" y="212">trivial-agent baselines</text>
    <text x="390" y="224">guidance for reading flawed evals</text>
  </g>
  <g class="oxblood" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="380,85 383,88 387,82"/><polyline points="380,97 383,100 387,94"/><polyline points="380,109 383,112 387,106"/>
    <polyline points="380,141 383,144 387,138"/><polyline points="380,153 383,156 387,150"/>
    <polyline points="380,185 383,188 387,182"/><polyline points="380,197 383,200 387,194"/><polyline points="380,209 383,212 387,206"/><polyline points="380,221 383,224 387,218"/>
  </g>

  <!-- footer -->
  <g class="rule-soft" stroke="currentColor" fill="none" stroke-width="0.8"><line x1="20" y1="244" x2="540" y2="244" stroke-dasharray="3 3"/></g>
  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="262" font-family="Spectral, serif" font-size="9.5" font-style="italic" text-anchor="middle">Across ten benchmarks: 7 break task validity, 7 break outcome validity, all 10 fall short on reporting.</text>
    <text x="280" y="278" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">applied to CVE-Bench, the checklist cut overestimation by 33% &#8212; confirmed by cybersecurity experts</text>
  </g>
</svg>

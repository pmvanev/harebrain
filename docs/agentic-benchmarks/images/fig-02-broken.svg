<svg viewBox="0 0 560 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Six cards cataloguing broken agentic benchmarks and the size of the error each flaw introduces, from tau-bench's do-nothing pass to CVE-Bench's 33 percent overestimate that ABC removed.">
  <style>
    .ink            { color: #1a1810; }
    .muted          { color: #5d553f; }
    .rule-soft      { color: #d4c8a4; }
    .oxblood        { color: #8b1f2c; }
    .blueprint      { color: #1f4f7a; }
    .sage           { color: #4f6b3f; }
    .card           { color: rgba(93, 85, 63, 0.05); }
    @media (prefers-color-scheme: dark) {
      .ink            { color: #ede2c4; }
      .muted          { color: #a89c7d; }
      .rule-soft      { color: #3a3327; }
      .oxblood        { color: #e09098; }
      .blueprint      { color: #88c0e8; }
      .sage           { color: #b1c98c; }
      .card           { color: rgba(168, 156, 125, 0.08); }
    }
  </style>

  <g class="muted" stroke="none" fill="currentColor">
    <text x="280" y="20" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle" letter-spacing="0.12em">SEVEN OF TEN BENCHMARKS FAIL TASK VALIDITY &#183; SEVEN FAIL OUTCOME VALIDITY</text>
  </g>

  <!-- card template helper rendered inline; 3 cols x 2 rows -->
  <!-- Row 1 -->
  <!-- tau-bench -->
  <g class="card" fill="currentColor"><rect x="16" y="34" width="172" height="92" rx="6"/></g>
  <g class="rule-soft" stroke="currentColor" fill="none"><rect x="16" y="34" width="172" height="92" rx="6" stroke-width="1"/></g>
  <g class="ink" fill="currentColor"><text x="28" y="54" font-family="Fraunces, serif" font-size="12" font-style="italic">&#964;-bench</text></g>
  <g class="ink" fill="currentColor" font-family="Spectral, serif" font-size="9">
    <text x="28" y="72">a do-nothing agent passes</text>
    <text x="28" y="84">38% of intentionally</text>
    <text x="28" y="96">impossible tasks</text>
  </g>
  <g class="oxblood" fill="currentColor"><text x="28" y="118" font-family="JetBrains Mono, monospace" font-size="11">+38% over</text></g>

  <!-- SWE-bench-Verified -->
  <g class="card" fill="currentColor"><rect x="194" y="34" width="172" height="92" rx="6"/></g>
  <g class="rule-soft" stroke="currentColor" fill="none"><rect x="194" y="34" width="172" height="92" rx="6" stroke-width="1"/></g>
  <g class="ink" fill="currentColor"><text x="206" y="54" font-family="Fraunces, serif" font-size="12" font-style="italic">SWE-bench Verified</text></g>
  <g class="ink" fill="currentColor" font-family="Spectral, serif" font-size="9">
    <text x="206" y="72">thin unit tests let</text>
    <text x="206" y="84">incorrect patches pass</text>
  </g>
  <g class="oxblood" fill="currentColor"><text x="206" y="118" font-family="JetBrains Mono, monospace" font-size="11">24% of top-50 wrong</text></g>

  <!-- SWE-Lancer -->
  <g class="card" fill="currentColor"><rect x="372" y="34" width="172" height="92" rx="6"/></g>
  <g class="rule-soft" stroke="currentColor" fill="none"><rect x="372" y="34" width="172" height="92" rx="6" stroke-width="1"/></g>
  <g class="ink" fill="currentColor"><text x="384" y="54" font-family="Fraunces, serif" font-size="12" font-style="italic">SWE-Lancer</text></g>
  <g class="ink" fill="currentColor" font-family="Spectral, serif" font-size="9">
    <text x="384" y="72">tests overwritable without</text>
    <text x="384" y="84">the password &#8212; replace with</text>
    <text x="384" y="96">assert 1==1</text>
  </g>
  <g class="oxblood" fill="currentColor"><text x="384" y="118" font-family="JetBrains Mono, monospace" font-size="11">100% w/o solving</text></g>

  <!-- Row 2 -->
  <!-- KernelBench -->
  <g class="card" fill="currentColor"><rect x="16" y="138" width="172" height="92" rx="6"/></g>
  <g class="rule-soft" stroke="currentColor" fill="none"><rect x="16" y="138" width="172" height="92" rx="6" stroke-width="1"/></g>
  <g class="ink" fill="currentColor"><text x="28" y="158" font-family="Fraunces, serif" font-size="12" font-style="italic">KernelBench</text></g>
  <g class="ink" fill="currentColor" font-family="Spectral, serif" font-size="9">
    <text x="28" y="176">fuzzer varies only values,</text>
    <text x="28" y="188">not shapes; reads stale</text>
    <text x="28" y="200">ground-truth from memory</text>
  </g>
  <g class="oxblood" fill="currentColor"><text x="28" y="222" font-family="JetBrains Mono, monospace" font-size="11">+31% over</text></g>

  <!-- OSWorld -->
  <g class="card" fill="currentColor"><rect x="194" y="138" width="172" height="92" rx="6"/></g>
  <g class="rule-soft" stroke="currentColor" fill="none"><rect x="194" y="138" width="172" height="92" rx="6" stroke-width="1"/></g>
  <g class="ink" fill="currentColor"><text x="206" y="158" font-family="Fraunces, serif" font-size="12" font-style="italic">OSWorld</text></g>
  <g class="ink" fill="currentColor" font-family="Spectral, serif" font-size="9">
    <text x="206" y="176">live websites drifted;</text>
    <text x="206" y="188">13 of 46 chrome tasks</text>
    <text x="206" y="200">broke their selectors</text>
  </g>
  <g class="blueprint" fill="currentColor"><text x="206" y="222" font-family="JetBrains Mono, monospace" font-size="11">&#8722;28% under</text></g>

  <!-- CVE-Bench -->
  <g class="card" fill="currentColor"><rect x="372" y="138" width="172" height="92" rx="6"/></g>
  <g class="sage" stroke="currentColor" fill="none"><rect x="372" y="138" width="172" height="92" rx="6" stroke-width="1.3"/></g>
  <g class="ink" fill="currentColor"><text x="384" y="158" font-family="Fraunces, serif" font-size="12" font-style="italic">CVE-Bench</text></g>
  <g class="ink" fill="currentColor" font-family="Spectral, serif" font-size="9">
    <text x="384" y="176">grading on a SLEEP keyword</text>
    <text x="384" y="188">anywhere in the log &#8212;</text>
    <text x="384" y="200">the ABC case study</text>
  </g>
  <g class="sage" fill="currentColor"><text x="384" y="222" font-family="JetBrains Mono, monospace" font-size="11">&#8722;33% after ABC</text></g>
</svg>
